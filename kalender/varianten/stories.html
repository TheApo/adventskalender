<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<title>Advent-Stories – {{TITEL}}</title>
<link rel="stylesheet" href="../fonts/stories.css">
<style>
:root{
  /* Farben: Mitternacht, Samt, Kerzenwachs, Kerzengold, Weihnachtsrot, Glut */
  --mitternacht:#0a1430;
  --samt:#14234a;
  --wachs:#f8ecd6;
  --kerzengold:#f4b740;
  --weihnachtsrot:#e1302a;
  --glut:#ff7b3a;
  --leise:rgba(248,236,214,.7);
  --hauch:rgba(248,236,214,.15);
  --ringfarben:var(--weihnachtsrot),var(--glut),var(--kerzengold),#fff0c4,var(--kerzengold),var(--glut),var(--weihnachtsrot);
  /* Schrift */
  --schrift:'Familjen Grotesk','Avenir Next','Segoe UI',system-ui,sans-serif;
  --gr-s:13px; --gr-m:16px; --gr-l:20px; --gr-xl:26px;
  --rand:16px;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--mitternacht);color-scheme:dark;-webkit-text-size-adjust:100%;
  /* Tastatur-Fokus und scrollIntoView halten Chips und Kacheln oberhalb der Ecke des festen Knopfs unten links */
  scroll-padding-bottom:calc(var(--menue-knopf-zone,64px) + env(safe-area-inset-bottom,0px))}
html.gesperrt{overflow:hidden}
body{margin:0;min-height:100vh;font-family:var(--schrift);font-size:var(--gr-m);line-height:1.45;color:var(--wachs);
  background:
    radial-gradient(80% 420px at 92% -60px,rgba(244,183,64,.17),transparent 70%),
    var(--mitternacht);
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
img{display:block}
:focus-visible{outline:3px solid var(--kerzengold);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Kopf ---------- */
/* Unten mindestens die Knopf-Zone (--menue-knopf-zone, 64 px) plus Luft: ganz nach unten gescrollt liegt der
   letzte Abschnitt über dem Menü-Knopf, nicht darunter */
.start{max-width:1280px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 0 calc(env(safe-area-inset-bottom,0px) + var(--menue-knopf-zone,64px) + 20px)}
/* Menü-Knopf aus kalender.js (runder 40-px-Knopf, id kalender-reset): bleibt direkt an body und sitzt – wie in
   allen Ansichten – fest unten links (Lage setzt kalender.js, hier nur die Farben). Beim Scrollen gleitet der
   Inhalt kurz darunter durch; feste Leisten gibt es unten keine. Solange der Story-Player offen ist (html.gesperrt), ist er ausgeblendet. */
html #kalender-reset{font-family:var(--schrift);background:rgba(10,20,48,.76);border-color:rgba(248,236,214,.3);color:var(--wachs)}
html.gesperrt #kalender-reset{display:none}
.kopf{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:0 calc(var(--rand) + env(safe-area-inset-right,0px)) 0 calc(var(--rand) + env(safe-area-inset-left,0px))}
h1{margin:0;font-weight:700;line-height:1}
.m-name{display:block;font-size:31px;letter-spacing:-.03em}
.m-sub{display:block;margin-top:5px;font-size:15px;font-weight:500;color:var(--leise)}
.kerzen{display:flex;align-items:flex-end;gap:7px;padding-bottom:3px}
.kerzen svg{width:13px;height:40px;overflow:visible}
.kerzen .wachs{fill:var(--wachs)}
.kerzen .aus .wachs{fill:rgba(248,236,214,.42)}
.kerzen .docht{stroke:#3b2a1d;stroke-width:1.3;stroke-linecap:round}
.kerzen .aus .docht{stroke:rgba(248,236,214,.5)}
.kerzen .flamme{fill:var(--kerzengold);filter:drop-shadow(0 0 3px rgba(255,170,60,.95)) drop-shadow(0 0 9px rgba(255,140,40,.55));transform-box:fill-box;transform-origin:50% 100%;animation:flackern 3.2s ease-in-out infinite}
.kerzen .an:nth-child(2) .flamme{animation-delay:-1.1s}.kerzen .an:nth-child(3) .flamme{animation-delay:-2s}.kerzen .an:nth-child(4) .flamme{animation-delay:-.6s}
@keyframes flackern{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(.94,1.06) rotate(-2deg)}60%{transform:scale(1.03,.96) rotate(1.5deg)}}

/* ---------- Story-Leiste ---------- */
.leiste-wrap{position:relative;margin-top:18px}
.leiste{position:relative;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scroll-snap-type:x proximity;
  padding:6px calc(var(--rand) + env(safe-area-inset-right,0px)) 8px calc(var(--rand) + env(safe-area-inset-left,0px));scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 24px),transparent)}
.leiste::-webkit-scrollbar{display:none}
.kreis{flex:0 0 auto;width:84px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:4px 0 2px;border:0;background:none;cursor:pointer;border-radius:16px;scroll-snap-align:center;touch-action:manipulation}
.ring{position:relative;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring::before{content:'';position:absolute;inset:0;border-radius:50%;background:var(--hauch)}
.ring>img{position:relative;width:calc(100% - 6px);height:calc(100% - 6px);border-radius:50%;object-fit:cover;border:2px solid var(--mitternacht)}
.st-neu .ring::before,.ring.lebt::before{background:conic-gradient(from 0deg,var(--ringfarben));animation:drehen 7s linear infinite}
.st-neu .ring>img,.ring.lebt>img{width:calc(100% - 8px);height:calc(100% - 8px);border-width:3px}
.st-gesehen .ring::before{background:rgba(248,236,214,.28)}
.st-gesehen .ring>img{width:calc(100% - 4px);height:calc(100% - 4px)}
@keyframes drehen{to{transform:rotate(1turn)}}
.st-zu .ring::before{display:none}
.strich{position:absolute;inset:0;width:100%;height:100%}
.strich circle{fill:rgba(20,35,74,.55);stroke:rgba(248,236,214,.45);stroke-width:1.6;stroke-dasharray:3.2 1.8;stroke-linecap:round}
.k-datum{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1}
.k-datum b{font-size:24px;font-weight:700;letter-spacing:-.03em}
.k-datum small{margin-top:3px;font-size:13px;color:var(--leise)}
.k-text{font-size:14px;font-weight:700;line-height:1.2;color:var(--leise);white-space:nowrap;font-variant-numeric:tabular-nums}
.k-text small{font-size:14px;font-weight:500}
.st-neu .k-text{color:var(--kerzengold)}
.ist-nachholen .k-text{margin-top:3px}
.ist-heute .ring{filter:drop-shadow(0 0 14px rgba(244,183,64,.38))}
.ist-heute .k-text{color:var(--wachs);font-weight:700;margin-top:3px}
.k-marke{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);padding:1px 8px 2px;border-radius:99px;border:2px solid var(--mitternacht);background:var(--weihnachtsrot);color:#fff;font-size:12.5px;font-weight:700;line-height:1.25;white-space:nowrap}
.k-marke.gold{padding:1px 6px 2px;background:var(--kerzengold);color:var(--mitternacht);font-size:12px}
.wackeln .ring{animation:wackeln .5s ease}
@keyframes wackeln{0%,100%{transform:rotate(0)}18%{transform:rotate(-11deg)}38%{transform:rotate(9deg)}58%{transform:rotate(-6deg)}78%{transform:rotate(3deg)}}
.leiste-pfeil{display:none;position:absolute;top:30px;z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid var(--hauch);background:rgba(20,35,74,.94);color:var(--wachs);place-items:center;cursor:pointer;transition:opacity .2s}
.leiste-pfeil svg{width:22px;height:22px}
.leiste-pfeil[disabled]{opacity:0;pointer-events:none}
.leiste-pfeil.links{left:6px}.leiste-pfeil.rechts{right:6px}

.blase{position:absolute;z-index:6;top:0;left:0;width:max-content;max-width:min(300px,calc(100% - 24px));padding:11px 15px 12px;border-radius:16px;background:var(--wachs);color:var(--mitternacht);box-shadow:0 14px 34px rgba(0,0,0,.4);opacity:0;transform:translateY(-6px) scale(.96);transform-origin:var(--px,50%) 0;transition:opacity .18s,transform .22s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.blase.zeigen{opacity:1;transform:none}
.blase::before{content:'';position:absolute;top:-6px;left:var(--px,50%);width:14px;height:14px;margin-left:-7px;background:inherit;border-radius:3px;transform:rotate(45deg)}
.blase b{display:block;font-size:17px;line-height:1.2}
.blase span{display:block;margin-top:3px;font-size:14px;line-height:1.3;color:#3a4566}

/* ---------- Heute-Karte ---------- */
.inhalt{padding:0 calc(var(--rand) + env(safe-area-inset-right,0px)) 0 calc(var(--rand) + env(safe-area-inset-left,0px))}
.heute-karte{position:relative;margin-top:14px;padding:28px 20px 20px;border-radius:28px;text-align:center;overflow:hidden;
  background:radial-gradient(110% 62% at 50% 16%,rgba(244,183,64,.2),transparent 64%),linear-gradient(180deg,#182b5a,#111f45);
  border:1px solid rgba(248,236,214,.09)}
.hk-ring{position:relative;width:150px;height:150px;margin:0 auto;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.hk-ring::before{content:'';position:absolute;inset:0;border-radius:50%;background:rgba(248,236,214,.3)}
.hk-ring.lebt::before{background:conic-gradient(from 0deg,var(--ringfarben));animation:drehen 7s linear infinite}
.hk-ring.zu{cursor:default}
.hk-ring.zu::before{display:none}
.hk-foto{position:absolute;inset:5px;border-radius:50%;overflow:hidden;border:4px solid #152854;background:var(--samt)}
.hk-ring.lebt .hk-foto{inset:6px}
.hk-foto img{width:100%;height:100%;object-fit:cover}
.hk-foto.verhuellt img{filter:blur(8px) brightness(.6) saturate(1.25);transform:scale(1.2)}
.hk-zahl{position:relative;font-size:64px;font-weight:700;line-height:1;letter-spacing:-.05em;text-shadow:0 2px 20px rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
.hk-ring.zu .hk-zahl{font-size:52px}
.hk-ring.zu small{display:block;font-size:15px;font-weight:500;letter-spacing:0;color:var(--leise);text-align:center;margin-top:2px}
.hk-ring.zu .strich circle{stroke-width:1.1;stroke-dasharray:2.4 1.6}
.hk-text{margin-top:20px}
.hk-datum{margin:0;font-size:15px;color:var(--leise)}
.hk-titel{margin:3px 0 0;font-size:var(--gr-xl);font-weight:700;line-height:1.12;letter-spacing:-.02em;text-wrap:balance}
.hk-info{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 0;font-size:14px;color:var(--leise)}
.hk-segmente{display:flex;gap:4px}
.hk-segmente i{width:20px;height:3px;border-radius:2px;background:rgba(248,236,214,.3)}
.hk-segmente.voll i{background:var(--kerzengold)}
.hk-absatz{max-width:34ch;margin:10px auto 0;font-size:15.5px;color:var(--leise);text-wrap:pretty}
.los{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;margin-top:20px;padding:0 22px;border:0;border-radius:99px;
  background:var(--wachs);color:var(--mitternacht);font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 10px 34px rgba(244,183,64,.22);touch-action:manipulation}
.los svg{width:18px;height:18px;fill:currentColor;flex:none}
.los.leise{background:transparent;color:var(--wachs);border:1.5px solid rgba(248,236,214,.4);box-shadow:none}
.los:active{transform:scale(.98)}

/* ---------- Abschnitte ---------- */
.abschnitt{margin-top:34px}
.abschnitt h2{margin:0;font-size:var(--gr-l);font-weight:700;letter-spacing:-.015em;line-height:1.2}
.hinweis{margin:4px 0 16px;font-size:14.5px;color:var(--leise)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:center;gap:11px;min-height:58px;padding:6px 18px 6px 6px;border-radius:99px;border:1px solid var(--hauch);background:rgba(248,236,214,.06);text-align:left;cursor:pointer;touch-action:manipulation}
.chip .ring{width:46px;height:46px}
.chip b{display:block;font-size:15.5px;line-height:1.2}
.chip small{display:block;font-size:14px;line-height:1.25;color:var(--leise)}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:16px 10px}
.kachel{display:block;align-self:start;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer;border-radius:16px;touch-action:manipulation}
.kb{position:relative;display:block;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:var(--samt)}
.kb img{width:100%;height:100%;object-fit:cover}
.kb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 52%,rgba(6,12,32,.7))}
.kn{position:absolute;z-index:1;left:9px;bottom:7px;font-size:22px;font-weight:700;line-height:1;letter-spacing:-.03em}
.kh{position:absolute;z-index:1;top:8px;right:8px;width:20px;height:20px;fill:var(--weihnachtsrot);filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.kt{display:-webkit-box;margin-top:7px;font-size:14px;line-height:1.25;color:var(--leise);-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.leer{padding:20px;border:1.5px dashed var(--hauch);border-radius:18px;color:var(--leise);font-size:15px}
.anleitung{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.anleitung li{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:20px;background:rgba(248,236,214,.05);border:1px solid rgba(248,236,214,.08)}
.anleitung p{margin:0;font-size:15.5px;line-height:1.4}
.anleitung b{display:block;font-size:16.5px;color:var(--wachs)}
.anleitung span{color:var(--leise)}
.a-bild{flex:none;width:56px;height:56px;display:grid;place-items:center}
.a-bild .ring{width:52px;height:52px}
.a-bild .ring i{position:relative;width:calc(100% - 8px);height:calc(100% - 8px);border-radius:50%;border:3px solid var(--mitternacht);background:linear-gradient(160deg,#c4557a,#f59a4a 55%,#2a2a4a)}
.a-seg{display:flex;gap:3px;width:52px}
.a-seg i{flex:1;height:4px;border-radius:2px;background:rgba(248,236,214,.3)}
.a-seg i:first-child{background:var(--wachs)}
.a-bild svg{width:46px;height:46px;fill:none;stroke:var(--kerzengold);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.weihnachten .st-gesehen .ring::before{background:linear-gradient(140deg,var(--kerzengold),#fff0c4 45%,var(--glut))}


/* ---------- Story-Player ---------- */
.player{--oben:env(safe-area-inset-top,0px);--unten:env(safe-area-inset-bottom,0px);--links:env(safe-area-inset-left,0px);--rechts:env(safe-area-inset-right,0px);position:fixed;inset:0;z-index:50;display:none;overflow:hidden;background:rgb(10,20,48);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.player.offen{display:block}
.player:focus{outline:none}
.hinter{position:absolute;inset:0;display:none;overflow:hidden}
.player.breit .hinter{display:block}
.hinter i{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(40px) brightness(.42) saturate(1.3)}
.hinter::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 25%,rgba(5,10,26,.72))}
.buehne{position:absolute;inset:0}
.player.breit{--oben:0px;--unten:0px;--links:0px;--rechts:0px}
.player.breit .buehne{inset:auto;left:calc(50% - var(--bw) / 2);top:calc(50% - var(--bh) / 2);width:var(--bw);height:var(--bh);
  transition:width .34s cubic-bezier(.3,.7,.2,1),height .34s cubic-bezier(.3,.7,.2,1),left .34s cubic-bezier(.3,.7,.2,1),top .34s cubic-bezier(.3,.7,.2,1)}
.player.sofort .buehne,.player.sofort .pfeil{transition:none!important}
.wuerfel{position:absolute;inset:0;transform-style:preserve-3d}
.seite{position:absolute;inset:0;overflow:hidden;background:#081024;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.player.breit .seite{border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.seite.vorne{transform:rotateY(0deg) translateZ(var(--halb))}
.seite.rechts{transform:rotateY(90deg) translateZ(var(--halb))}
.seite.links{transform:rotateY(-90deg) translateZ(var(--halb))}
.seite.aus{visibility:hidden}
.wuerfel.ruhe,.wuerfel.ruhe .seite.vorne{transform:none}
.s-hg{position:absolute;inset:-24px;background-size:cover;background-position:center;opacity:.9}
/* Solange das Foto lädt: unscharfe Vorschau als Grund (meist schon im Browser-Cache) */
.s-hg.vorab{filter:blur(26px) brightness(.7) saturate(1.2);transform:scale(1.12)}
.foto{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;transition:opacity .25s}
/* Ladezustand: Foto erst zeigen, wenn es fertig dekodiert ist; Kreis dreht sich (erst nach kurzer Zeit sichtbar, damit nichts flackert) */
.seite.laedt .foto{opacity:0}
.s-lader{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid rgba(248,236,214,.22);border-top-color:var(--wachs);opacity:0;transition:opacity .2s;pointer-events:none;animation:drehen .9s linear infinite paused}
.seite.laedt .s-lader{opacity:1;transition-delay:.25s;animation-play-state:running}
.s-titel:empty,.s-text:empty,.s-zahl:empty{display:none}
.s-text:empty+.s-zahl{margin-top:0}
.foto.frei{box-shadow:0 0 0 1px rgba(255,255,255,.05),0 14px 50px rgba(3,6,18,.5)}
.v-oben,.v-unten{position:absolute;left:0;right:0;pointer-events:none}
.v-oben{top:0;height:150px;background:linear-gradient(rgba(6,12,32,.7),rgba(6,12,32,.25) 60%,transparent)}
.v-unten{bottom:0;height:200px;background:linear-gradient(transparent,rgba(6,12,32,.4) 40%,rgba(6,12,32,.82))}
.balken{position:absolute;left:calc(10px + var(--links));right:calc(10px + var(--rechts));top:calc(var(--oben) + 10px);display:flex;gap:4px}
.seg{flex:1;height:3px;border-radius:2px;background:rgba(248,236,214,.3);overflow:hidden}
.seg i{display:block;height:100%;background:var(--wachs);transform:scaleX(0);transform-origin:0 50%}
.s-kopf{position:absolute;left:calc(12px + var(--links));right:calc(104px + var(--rechts));top:calc(var(--oben) + 24px);display:flex;align-items:center;gap:10px}
.s-avatar{flex:none;width:42px;height:42px;padding:2.5px;border-radius:50%;background:conic-gradient(var(--ringfarben))}
.s-avatar img{width:100%;height:100%;border-radius:50%;border:2px solid #0b1636;object-fit:cover}
.s-kopftext{flex:1;min-width:0}
.s-datum{margin:0;font-size:14.5px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.s-titel{margin:1px 0 0;font-size:14px;line-height:1.25;color:var(--leise);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.s-fuss{position:absolute;left:calc(16px + var(--links));right:calc(86px + var(--rechts));bottom:calc(var(--unten) + 20px)}
.s-text{margin:0;font-size:21px;font-weight:700;line-height:1.18;letter-spacing:-.015em;text-wrap:balance;text-shadow:0 1px 14px rgba(0,0,0,.5)}
.s-zahl{margin:6px 0 0;font-size:14px;color:var(--leise)}
.schatten{position:absolute;inset:0;background:#02050f;opacity:0;pointer-events:none}
.balken,.s-kopf,.s-fuss,.v-oben,.v-unten{transition:opacity .22s}
.player.halten .balken,.player.halten .s-kopf,.player.halten .s-fuss,.player.halten .v-oben,.player.halten .v-unten,.player.halten .steuer{opacity:0}
.tipp{position:absolute;inset:0;z-index:2;touch-action:none;cursor:pointer}
.steuer{position:absolute;inset:0;z-index:4;pointer-events:none;transition:opacity .22s}
.steuer button{pointer-events:auto;touch-action:manipulation}
.knopf{position:absolute;top:calc(var(--oben) + 23px);width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;cursor:pointer}
.knopf svg{width:24px;height:24px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.55))}
.k-pause{right:calc(52px + var(--rechts))}.k-pause svg{fill:var(--wachs)}
.k-zu{right:calc(6px + var(--rechts))}.k-zu svg{stroke:var(--wachs);stroke-width:2.4;stroke-linecap:round;fill:none}
.k-herz{position:absolute;right:calc(14px + var(--rechts));bottom:calc(var(--unten) + 16px);width:58px;height:58px;display:grid;place-items:center;border:1px solid rgba(248,236,214,.2);border-radius:50%;background:rgba(10,20,48,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer}
.k-herz svg{width:28px;height:28px;fill:none;stroke:var(--wachs);stroke-width:2;stroke-linejoin:round;transition:fill .2s,stroke .2s}
.k-herz.voll svg{fill:var(--weihnachtsrot);stroke:var(--weihnachtsrot)}
.flug{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none}
.flug svg{width:100%;height:100%}
.pause-hinweis{position:absolute;left:50%;top:50%;z-index:3;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;background:rgba(10,20,48,.72);font-size:14.5px;font-weight:700;transform:translate(-50%,-50%);opacity:0;transition:opacity .2s;pointer-events:none}
.pause-hinweis svg{width:16px;height:16px;fill:var(--wachs)}
.player.nutzerpause .pause-hinweis{opacity:1}
.p-hinweis{position:absolute;left:50%;top:40%;z-index:3;width:max-content;max-width:calc(100% - 48px);padding:12px 18px 13px;border-radius:18px;background:var(--wachs);color:var(--mitternacht);text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.4);transform:translate(-50%,-50%) scale(.94);opacity:0;transition:opacity .18s,transform .24s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.p-hinweis.zeigen{opacity:1;transform:translate(-50%,-50%)}
.p-hinweis b{display:block;font-size:17px;line-height:1.2}
.p-hinweis span{display:block;margin-top:3px;font-size:14px;color:#3a4566}
.zwischen{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--oben) + 76px) calc(28px + var(--rechts)) calc(var(--unten) + 32px) calc(28px + var(--links));text-align:center;background:rgba(8,15,38,.78);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);opacity:0;transition:opacity .25s}
.zwischen[hidden]{display:none}
.zwischen.zeigen{opacity:1}
.zw-ring.hk-ring{width:136px;height:136px;flex:none;margin:0;cursor:default}
.hk-ring.gold::before{background:linear-gradient(140deg,var(--kerzengold),#fff0c4 45%,var(--glut))}
.zw-ring.wackelt{animation:wackeln .55s ease .3s}
.zw-inhalt{display:flex;flex-direction:column;align-items:center}
.zw-titel{margin:22px 0 0;font-size:28px;font-weight:700;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.zw-text{max-width:30ch;margin:8px 0 0;font-size:16px;color:var(--leise);text-wrap:pretty}
.zw-knoepfe{display:flex;flex-direction:column;gap:10px;width:min(100%,300px);margin-top:24px}
.zw-knoepfe .los{margin-top:0}
.player.zwischen-offen .k-pause,.player.zwischen-offen .k-herz{display:none}
@media (max-height:500px){
  .v-oben{height:100px}.v-unten{height:130px}
  .s-text{font-size:18px}
  .zwischen{flex-direction:row;gap:32px;padding-top:calc(var(--oben) + 60px);padding-bottom:20px;text-align:left}
  .zw-ring.hk-ring{width:112px;height:112px}
  .zw-inhalt{align-items:flex-start}
  .zw-titel{margin-top:0;font-size:24px}
  .zw-knoepfe{flex-direction:row;width:auto;margin-top:18px}
  .zw-knoepfe .los{min-width:0;width:auto}
}
.pfeil{display:none;position:absolute;top:50%;z-index:4;width:56px;height:56px;margin-top:-28px;border-radius:50%;border:1px solid rgba(248,236,214,.24);background:rgba(248,236,214,.1);color:var(--wachs);place-items:center;cursor:pointer;transition:background .15s,opacity .2s}

.pfeil:not([disabled]):active{background:rgba(248,236,214,.22)}
.player.breit .pfeil{display:grid;transition:left .34s cubic-bezier(.3,.7,.2,1),background .15s,opacity .2s}
.pfeil-l{left:calc(50% - var(--bw) / 2 - 84px)}
.pfeil-r{left:calc(50% + var(--bw) / 2 + 28px)}

/* ---------- Breitere Bildschirme ---------- */
@media (min-width:768px){
  :root{--rand:32px}
  .m-name{font-size:42px}
  .m-sub{font-size:17px}
  .kerzen svg{width:16px;height:48px}

  .leiste-pfeil{display:grid}
  .leiste{scroll-padding-inline:64px}
  .kreis{width:88px}
  .ring{width:78px;height:78px}
  .heute-karte{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:34px;padding:32px 36px;text-align:left}
  .heute-karte .hk-ring{width:190px;height:190px;margin:0}
  .hk-text{margin-top:0}
  .hk-info{justify-content:flex-start}
  .hk-absatz{margin-left:0}
  .los{width:auto;display:inline-flex;min-width:250px}
  .raster{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:20px 14px}
}
@media (min-width:1024px){
  .inhalt{display:grid;grid-template-columns:minmax(330px,370px) 1fr;gap:44px;align-items:start;margin-top:8px}
  .heute-karte{position:sticky;top:20px;display:block;padding:36px 30px 30px;text-align:center}
  .heute-karte .hk-ring{width:196px;height:196px;margin:0 auto}
  .hk-text{margin-top:22px}
  .hk-info{justify-content:center}
  .hk-absatz{margin-left:auto}
  .los{display:flex;width:100%}
  .abschnitt{margin-top:14px}
  .abschnitt+.abschnitt{margin-top:38px}
  .abschnitt h2{font-size:24px}
  .anleitung{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .anleitung li{flex-direction:column;align-items:flex-start;padding:20px}
  .raster{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
}
@media (prefers-reduced-motion:reduce){
  .st-neu .ring::before,.ring.lebt::before,.hk-ring.lebt::before,.kerzen .flamme{animation:none}

  .player.breit .buehne,.player.breit .pfeil{transition:none}
  .zw-ring.wackelt{animation:none}
  .s-lader{animation:none}
  .seite.laedt .s-lader{animation:pulsieren 1.8s ease-in-out infinite}
}

      el.hinter.getAnimations().forEach(function (a) { a.cancel(); });
    };
  }
  function setzeHaltenAus() { el.player.classList.remove('halten'); }

  /* Gesten: Tippen, Halten, Wischen */
  var g = null;
  el.tipp.addEventListener('pointerdown', function (e) {
    if (!P || P.pause.wechsel || g || zw) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    g = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: performance.now(), modus: null, gehalten: false, dx: 0, dy: 0, ziel: null };
    try { el.tipp.setPointerCapture(e.pointerId); } catch (err) { /* synthetisch */ }
    g.timer = setTimeout(function () { if (g && !g.modus) { g.gehalten = true; setzeHalten(true); } }, 220);
  });
  el.tipp.addEventListener('pointermove', function (e) {
    if (!g || e.pointerId !== g.id || !P) return;
    var dx = e.clientX - g.x0, dy = e.clientY - g.y0;
    g.dx = dx; g.dy = dy;
    if (!g.modus) {
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) g.modus = 'quer';
      else if (dy > 10 && dy > Math.abs(dx)) g.modus = 'runter';
      else return;
      clearTimeout(g.timer);
      P.pause.drag = true;
      setzeHalten(false);
    }
    if (g.modus === 'quer') zieheQuer(dx);
    else zieheRunter(dy);
  });
  function gesteEnde(e, abbruch) {
    if (!g || e.pointerId !== g.id) return;
    clearTimeout(g.timer);
    var gg = g; g = null;
    if (!P) return;
    var dt = Math.max(1, performance.now() - gg.t0);
    if (gg.modus === 'quer') loslassenQuer(gg.dx, gg.dx / dt, gg.ziel);
    else if (gg.modus === 'runter') loslassenRunter(gg.dy, gg.dy / dt);
    else if (gg.gehalten) setzeHalten(false);
    else if (!abbruch) {
      var r = el.tipp.getBoundingClientRect();
      if (gg.x0 - r.left < r.width * 0.3) zurueck(); else weiter();
    }
    if (P && gg.modus !== 'quer') P.pause.drag = false;
  }
  el.tipp.addEventListener('pointerup', function (e) { gesteEnde(e, false); });
  el.tipp.addEventListener('pointercancel', function (e) { gesteEnde(e, true); });
  el.player.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function zieheQuer(dx) {
    var W = halb * 2, r = dx < 0 ? 1 : -1, ziel = P.tag + r;
    var gueltig = ziel >= 1 && ziel <= maxTag();
    if (RUHIG) { g.ziel = gueltig ? ziel : null; return; }
    if (!gueltig) {
      if (!B.classList.contains('aus')) B.className = 'seite aus';
      g.ziel = null;
      setzeWinkel(Math.max(-14, Math.min(14, dx / W * 90 * 0.22)));
      return;
    }
    if (g.ziel !== ziel) { bereiteB(ziel, r); g.ziel = ziel; }
    setzeWinkel(Math.max(-90, Math.min(90, dx / W * 90)));
  }
  function loslassenQuer(dx, v, ziel) {
    var W = halb * 2, r = dx < 0 ? 1 : -1;
    var schnell = Math.abs(v) > 0.45;
    if (ziel && (Math.abs(dx) > W * 0.28 || schnell)) {
      P.pause.drag = false;
      P.pause.wechsel = true;
      if (RUHIG) { bereiteB(ziel, r); tauschen(ziel); return; }
      var rest = 1 - Math.abs(winkel) / 90;
      animiereWinkel(winkel, -90 * r, 140 + 300 * rest, raus).then(function () { if (P) tauschen(ziel); });
    } else {
      if (!ziel && Math.abs(dx) > W * 0.15) grenzHinweis(r);
      P.pause.wechsel = true;
      animiereWinkel(winkel, 0, RUHIG ? 1 : 240, raus).then(function () {
        B.className = 'seite aus';
        setzeWinkel(0);
        if (P) { P.pause.wechsel = false; P.pause.drag = false; }
      });
    }
  }
  function zieheRunter(dy) {
    var d = Math.max(0, dy), H = window.innerHeight;
    el.buehne.style.transform = 'translateY(' + d + 'px) scale(' + (1 - Math.min(d, H) / H * 0.22).toFixed(4) + ')';
    var a = Math.max(0.25, 1 - d / (H * 0.7));
    el.player.style.backgroundColor = 'rgba(10,20,48,' + a.toFixed(3) + ')';
    el.hinter.style.opacity = a.toFixed(3);
    el.steuer.style.opacity = String(Math.max(0, 1 - d / 60));
  }
  function loslassenRunter(dy, v) {
    if (dy > 110 || (v > 0.55 && dy > 30)) { schliesse('runter'); return; }
    var start = el.buehne.style.transform || 'none';
    el.buehne.style.transform = '';
    el.player.style.backgroundColor = '';
    el.hinter.style.opacity = '';
    el.steuer.style.opacity = '';
    if (!RUHIG && el.buehne.animate) el.buehne.animate([{ transform: start }, { transform: 'none' }], { duration: 220, easing: 'cubic-bezier(.2,.8,.3,1)' });
  }

  /* Knöpfe */
  el.zu.addEventListener('click', function () { schliesse('knopf'); });
  el.pause.addEventListener('click', function () { if (P) setzePause(!P.pause.nutzer); });
  el.pfeilL.addEventListener('click', function () { zurueck(); });
  el.pfeilR.addEventListener('click', function () { vorwaerts(); });
  el.hinter.addEventListener('click', function () { schliesse('knopf'); });
  el.herz.addEventListener('click', function () {
    if (!P) return;
    herzen[P.tag] = (herzen[P.tag] || 0) + 1;
    herzSichern();
    el.herz.classList.add('voll');
    el.herz.setAttribute('aria-label', tx('stories.herzNochmal', 'Noch ein Herz schicken'));
    herzRegen();
    ansage(tx('stories.herzGeschickt', 'Herz für Tag {n} geschickt', { n: P.tag }));
  });
  function herzRegen() {
    var sr = el.steuer.getBoundingClientRect(), hr = el.herz.getBoundingClientRect();
    var x = hr.left + hr.width / 2 - sr.left, y = hr.top + hr.height / 2 - sr.top;
    if (el.herz.animate) el.herz.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.22)' }, { transform: 'scale(1)' }], { duration: 320, easing: 'cubic-bezier(.3,1.6,.5,1)' });
    if (!el.herz.animate) return;
    var farben = ['var(--weihnachtsrot)', 'var(--glut)', 'var(--kerzengold)', '#ff5a6e', 'var(--wachs)'];
    var n = RUHIG ? 1 : 9, hoehe = Math.min(sr.height * 0.6, 420);
    for (var i = 0; i < n; i++) {
      var f = document.createElement('span');
      f.className = 'flug';
      f.innerHTML = ICON.herz;
      f.style.left = x + 'px'; f.style.top = y + 'px';
      f.firstChild.style.fill = farben[i % farben.length];
      el.steuer.appendChild(f);
      var dx = (Math.random() - 0.65) * 120, h = hoehe * (0.55 + Math.random() * 0.45), s = 0.6 + Math.random() * 0.9, rot = (Math.random() - 0.5) * 50;
      var anim = RUHIG
        ? f.animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1.3)' }, { opacity: 0, transform: 'scale(1.3)' }], { duration: 700 })
        : f.animate([
          { opacity: 0, transform: 'translate(0,0) scale(.3)' },
          { opacity: 1, transform: 'translate(' + (dx * 0.15) + 'px,' + (-h * 0.12) + 'px) scale(' + s + ')', offset: 0.14 },
          { opacity: 0.9, transform: 'translate(' + (dx * 0.6) + 'px,' + (-h * 0.6) + 'px) scale(' + s + ') rotate(' + (rot * 0.6) + 'deg)', offset: 0.6 },
          { opacity: 0, transform: 'translate(' + dx + 'px,' + (-h) + 'px) scale(' + (s * 0.85) + ') rotate(' + rot + 'deg)' }
        ], { duration: 1300 + Math.random() * 700, delay: i * 55, easing: 'cubic-bezier(.25,.6,.35,1)', fill: 'backwards' });
      anim.onfinish = (function (k) { return function () { k.remove(); }; })(f);
    }
  }

  /* Tastatur */
  document.addEventListener('keydown', function (e) {
    if (!P) return;
    var k = e.key;
    if (k === 'Escape') { e.preventDefault(); schliesse('knopf'); return; }
    if (k === 'ArrowRight') { e.preventDefault(); vorwaerts(); return; }
    if (k === 'ArrowLeft') { e.preventDefault(); zurueck(); return; }
    if (k === 'ArrowDown' || k === 'PageDown') { e.preventDefault(); tagWechsel(1); return; }
    if (k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); tagWechsel(-1); return; }
    if (k === ' ' || k === 'Spacebar') {
      if (e.target.closest && e.target.closest('button')) return;
      e.preventDefault(); if (!zw) setzePause(!P.pause.nutzer); return;
    }
    if (k === 'Tab') {
      var liste = $$('button', el.zwischen).concat([el.pause, el.zu, el.herz, el.pfeilL, el.pfeilR]).filter(function (b) { return b.offsetParent !== null && !b.disabled; });
      if (!liste.length) return;
      var i = liste.indexOf(document.activeElement);
      e.preventDefault();
      var n = e.shiftKey ? (i <= 0 ? liste.length - 1 : i - 1) : (i === -1 || i === liste.length - 1 ? 0 : i + 1);
      liste[n].focus();
    }
  });

  document.addEventListener('visibilitychange', function () { if (P) P.pause.versteckt = document.hidden; });
  var groesseTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(groesseTimer);
    groesseTimer = setTimeout(function () { if (P) masse(); leistePfeile(); versteckeBlase(); }, 80);
  });

  K.onChange(function () {
    /* schliesse('sofort') rendert selbst und setzt den Fokus – danach nicht noch einmal rendern (Fokus ginge verloren) */
    if (P && P.tag > maxTag()) { schliesse('sofort'); return; }
    if (P) pfeileAktualisieren();
    render();
  });

  render();
})();
</script>
