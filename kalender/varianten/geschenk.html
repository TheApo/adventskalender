<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6dcd8">
<title>Der Gabentisch – {{TITEL}}</title>
<link rel="stylesheet" href="../fonts/geschenk.css">
<style>
:root {
  /* Farben: Zuckerrosa Wand, Brombeer-Tinte, Kirschband, Tannenpapier, Goldkordel, Seidenpapier */
  --wand: #f6dcd8;
  --brombeer: #3d1830;
  --kirsch: #c8203f;
  --tanne: #1f5c45;
  --gold: #e8b04a;
  --seide: #fff8f4;
  /* Schriften: Plakat-Schwung für Titel und Zahlen, sehr gut lesbare Textschrift, Handschrift für Anhänger */
  --schrift-titel: 'Shrikhand', 'Cooper Black', Georgia, serif;
  --schrift-text: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --schrift-hand: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
  /* Menü-Knopf aus kalender.js (#kalender-reset, runder 40-px-Knopf: Ansicht wechseln, Testmodus): sitzt in
     allen Varianten fest unten links (kalender.js setzt die Lage selbst, Varianten verschieben ihn nicht).
     Diese Seite hält die Ecke frei (Fläche --menue-knopf-zone, 64 × 64 px): die Pille „weiter unten“
     weicht nach oben aus, die Fußzeile lässt links und rechts 64 px frei. In Fokus- und Bildansicht ausgeblendet. */
  --spalten: 3;
  --spalt: 8px;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--wand); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overscroll-behavior-x: none; }
html.vollansicht { overflow: hidden; overscroll-behavior: none; }
body {
  position: relative; margin: 0; min-height: 100vh; color: var(--brombeer);
  font-family: var(--schrift-text); font-size: 17px; line-height: 1.45; overflow-x: clip;
  background:
    radial-gradient(120% 60% at 50% -8%, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0) 62%),
    radial-gradient(circle, rgba(255, 255, 255, .55) 0 1.4px, transparent 1.9px) 0 0 / 26px 26px,
    radial-gradient(circle, rgba(200, 32, 63, .08) 0 1.1px, transparent 1.6px) 13px 13px / 26px 26px,
    var(--wand);
}
body.fest { background:
    radial-gradient(120% 60% at 50% -8%, rgba(255, 244, 214, .85), rgba(255, 255, 255, 0) 62%),
    radial-gradient(circle, rgba(255, 255, 255, .55) 0 1.4px, transparent 1.9px) 0 0 / 26px 26px,
    radial-gradient(circle, rgba(232, 176, 74, .22) 0 1.3px, transparent 1.8px) 13px 13px / 26px 26px,
    var(--wand); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--kirsch); outline-offset: 3px; }
.unsichtbar { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
img { -webkit-user-drag: none; user-select: none; -webkit-user-select: none; }

/* ---------- Seite ---------- */
.seite { max-width: 1240px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); }
.kopf { position: relative; text-align: center; padding: 10px 4px 0; }
.wimpel { display: none; position: absolute; left: -14px; right: -14px; top: -14px; height: 34px; pointer-events: none;
  background:
    linear-gradient(rgba(61, 24, 48, .45), rgba(61, 24, 48, .45)) 0 5px / 100% 1.5px no-repeat,
    conic-gradient(from 150deg at 50% 0, var(--kirsch) 0 60deg, transparent 0) 0 6px / 44px 28px repeat-x,
    conic-gradient(from 150deg at 50% 0, var(--gold) 0 60deg, transparent 0) 22px 6px / 44px 28px repeat-x; }
body.fest .wimpel { display: block; }
body.fest .kopf { padding-top: 34px; }
.titel { margin: 0; font-family: var(--schrift-titel); font-weight: 400; color: var(--kirsch); line-height: .98; letter-spacing: .005em;
  text-shadow: 2px 2px 0 var(--seide), 4px 5px 0 rgba(61, 24, 48, .13); text-wrap: balance; }
.titel span { display: block; }
.titel .t1 { font-size: clamp(44px, 14vw, 76px); }
.titel .t2 { font-size: clamp(23px, 7vw, 38px); margin-top: 4px; }
.heute-zeile { margin: 12px auto 0; font-weight: 700; font-size: 19px; }
.hilfe { margin: 4px auto 0; max-width: 34ch; text-wrap: pretty; }
.kopf-knoepfe { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 14px 0 6px; }
.kopf-knoepfe[hidden] { display: none; }
@media (max-width: 679px) {
  .kopf-knoepfe { gap: 8px; margin-top: 12px; }
  .kopf-knoepfe .knopf { min-height: 46px; padding: 0 22px; font-size: 16px; }
  .kopf-knoepfe .knopf svg { width: 19px; height: 19px; }
  .heute-zeile { margin-top: 10px; font-size: 18px; }
  .hilfe { font-size: 16px; }
}

/* Knöpfe: ein Stück Schleifenband mit eingekerbten Enden */
.knopf { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 30px;
  border: 0; background: none; color: var(--seide); font-weight: 700; font-size: 18px; line-height: 1.1; cursor: pointer; isolation: isolate;
  -webkit-tap-highlight-color: transparent; border-radius: 4px; transition: transform .15s; }
.knopf::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, #df3352, var(--kirsch) 55%, #a8152f);
  clip-path: polygon(0 0, 100% 0, calc(100% - 13px) 50%, 100% 100%, 0 100%, 13px 50%); box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
.knopf::after { content: ""; position: absolute; inset: 5px 15px; z-index: -1; border-top: 1.5px dashed rgba(255, 248, 244, .45); border-bottom: 1.5px dashed rgba(255, 248, 244, .45); pointer-events: none; }
.knopf:active { transform: scale(.97); }
.knopf svg { width: 22px; height: 22px; flex: none; }
.knopf-leise { color: var(--brombeer); }
.knopf-leise::before { background: var(--seide); box-shadow: none; }
.knopf-leise::after { border-color: rgba(61, 24, 48, .3); }
.knopf-gold { color: var(--brombeer); }
.knopf-gold::before { background: linear-gradient(180deg, #f6cd73, var(--gold) 55%, #c98d27); }
.knopf-gold::after { border-color: rgba(61, 24, 48, .35); }
.knopf[hidden] { display: none; }

/* ---------- Gabentisch / Regal ---------- */
.tisch { position: relative; margin: 18px auto 0; }
.etagen { display: grid; row-gap: 22px; }
.etage { position: relative; display: grid; grid-template-columns: repeat(var(--spalten), minmax(0, 1fr)); column-gap: var(--spalt); padding: 0 2px; }
.etage::after { content: ""; position: absolute; z-index: 0; left: -10px; right: -10px; bottom: -11px; height: 13px; border-radius: 3px;
  background: linear-gradient(180deg, #fffdfb 0 3px, #f3e4df 3px 6px, #e6cfc9 6px, #d7bab4);
  box-shadow: 0 10px 14px -8px rgba(61, 24, 48, .45), 0 1px 0 rgba(61, 24, 48, .12); }
.gabe { position: relative; z-index: 1; display: block; width: 100%; aspect-ratio: 100 / 118; margin: 0; padding: 0; border: 0; border-radius: 12px; background: none;
  cursor: pointer; container-type: inline-size; -webkit-tap-highlight-color: transparent; }
.gabe:focus-visible { outline-offset: 2px; }
.fig { position: absolute; inset: 0; transform-origin: 50% 97%; rotate: var(--dreh, 0deg); }
.fig svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.gabe text { pointer-events: none; }
.gabe .zahl { font-family: var(--schrift-titel); fill: var(--brombeer); }
.gabe .hand { font-family: var(--schrift-hand); font-weight: 700; fill: var(--brombeer); }
.z-heute .fig { filter: drop-shadow(0 0 1px rgba(232, 176, 74, .9)) drop-shadow(0 0 12px rgba(232, 176, 74, .75)); }
.z-heute .heiligenschein { animation: schein 2.6s ease-in-out 3; }
@keyframes schein { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
.z-zu .fig { filter: saturate(.86); }
.gabe.weg .fig { visibility: hidden; }
/* Foto in der offenen Schachtel: zwischen Rückwand (SVG hinten) und Vorderwand (SVG vorn) */
.vk { position: absolute; z-index: 1; aspect-ratio: 1; padding: 3.2%; margin: 0; background: var(--seide); border-radius: 2px; box-shadow: 0 2px 5px rgba(61, 24, 48, .3); rotate: var(--vkd, 0deg); }
/* Fotofläche: solange das Vorschaubild (echte Bilder kommen asynchron vom Server) noch lädt, sieht man hier
   einen hellen Hauch der Tagesfarbe, der sanft pulsiert – nie ein leeres oder dunkles Feld */
.vk::before { content: ""; position: absolute; inset: 3.2%; border-radius: 1px; background: #ead7d0;
  background: color-mix(in srgb, var(--fb, #e9d6cf) 34%, #f3e3dd); }
.vk img, .vk .ersatz { position: relative; display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 1px; }
.vk img { transition: opacity .3s ease-out; }
.vk.wartet img { opacity: 0; transition: none; }
.vk.wartet::before { animation: laedt 1.1s ease-in-out infinite alternate; }
.fig .vorn { z-index: 2; }
.ersatz { position: relative; display: grid !important; place-items: center; background: repeating-linear-gradient(135deg, #f1dcd5 0 6px, #ead0c8 6px 12px) !important;
  font-family: var(--schrift-hand); font-weight: 700; color: rgba(61, 24, 48, .7); font-size: max(12px, 13cqi); line-height: 1; text-align: center; }
.laedt { animation: laedt 1.1s ease-in-out infinite alternate; }
@keyframes laedt { from { opacity: .55; } to { opacity: 1; } }
.wackelt { animation: wackeln .55s cubic-bezier(.36, .07, .19, .97); }
@keyframes wackeln { 0%, 100% { transform: rotate(0); } 18% { transform: rotate(-7deg); } 38% { transform: rotate(6deg); } 58% { transform: rotate(-4deg); } 78% { transform: rotate(2deg); } }
.huepft { animation: huepfen .9s cubic-bezier(.3, .7, .3, 1); }
@keyframes huepfen { 0%, 100% { transform: none; } 22% { transform: translateY(-16%) scale(1.04, .97); } 40% { transform: translateY(0) scale(1.06, .92); } 58% { transform: translateY(-7%); } 76% { transform: none; } }

/* Sprechblase für gesperrte Geschenke */
.blase { position: absolute; z-index: 20; left: 0; top: 0; width: max-content; max-width: min(260px, calc(100vw - 28px)); padding: 9px 14px 10px; border-radius: 14px;
  background: var(--brombeer); color: var(--seide); font-size: 16px; line-height: 1.3; text-align: center; pointer-events: none;
  box-shadow: 0 10px 24px -8px rgba(61, 24, 48, .6); animation: blaseRein .28s cubic-bezier(.2, .9, .3, 1.3); }
.blase[hidden] { display: none; }
.blase strong { display: block; font-family: var(--schrift-titel); font-weight: 400; font-size: 20px; line-height: 1.15; color: var(--gold); margin-bottom: 2px; }
.blase::after { content: ""; position: absolute; top: 100%; left: var(--pfeil, 50%); margin-left: -8px; border: 8px solid transparent; border-top-color: var(--brombeer); }
.blase.unten::after { top: auto; bottom: 100%; border-top-color: transparent; border-bottom-color: var(--brombeer); }
@keyframes blaseRein { from { opacity: 0; transform: translateY(6px) scale(.94); } to { opacity: 1; transform: none; } }

.fuss { position: relative; margin: 40px auto 0; padding: 0 64px calc(22px + env(safe-area-inset-bottom)); min-height: 68px; text-align: center; font-size: 15px; color: rgba(61, 24, 48, .72); }
.fuss p { margin: 0; padding-top: 14px; }
html.vollansicht #kalender-reset { display: none; }

/* Hinweis, wenn das heutige Geschenk weiter unten liegt (verrät die Richtung, nicht den Platz) */
.weiter-unten { position: fixed; z-index: 30; left: 0; right: 0; bottom: max(14px, calc(env(safe-area-inset-bottom) + 8px)); margin: 0 auto;
  display: flex; align-items: center; gap: 9px; width: max-content; min-height: 48px; max-width: calc(100vw - 28px); padding: 0 20px 0 15px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--brombeer); color: var(--seide); font-weight: 700; font-size: 16px; line-height: 1.15; text-align: left; -webkit-tap-highlight-color: transparent;
  box-shadow: 0 0 0 3px rgba(232, 176, 74, .85), 0 12px 26px -8px rgba(61, 24, 48, .7); animation: unten-rein .4s cubic-bezier(.2, .9, .3, 1.2); }
.weiter-unten[hidden] { display: none; }
.weiter-unten svg { width: 22px; height: 22px; flex: none; color: var(--gold); animation: unten-pfeil 1.1s ease-in-out .5s 4; }
.weiter-unten:focus-visible { outline-color: var(--gold); outline-offset: 4px; }
html.vollansicht .weiter-unten { display: none; }
/* Schmale Bildschirme: unten mittig würde die Pille in die Ecke des Menü-Knopfs reichen (Tipp auf den Pfeil
   öffnete sonst das Erwachsenen-Menü) → sie schwebt knapp über der Knopf-Zone */
@media (max-width: 559px) {
  .weiter-unten { bottom: calc(var(--menue-knopf-zone, 64px) + env(safe-area-inset-bottom, 0px)); }
}
@keyframes unten-rein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes unten-pfeil { 0%, 100% { transform: none; } 50% { transform: translateY(4px); } }

/* ---------- Fokus: das Geschenk kommt nach vorn ---------- */
.fokus, .ansicht { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; overflow: hidden; color: var(--seide);
  overscroll-behavior: none; touch-action: pan-y pinch-zoom; /* waagerechtes Wischen nie an den Browser (Zurück-Geste) */ }
.fokus { background: transparent; }
.fk-grund { position: absolute; inset: 0; background: radial-gradient(70% 52% at 50% 58%, #6a2a4c 0%, #4a1d39 48%, #2c0f22 100%); }
.fokus::backdrop { background: transparent; }
.ansicht::backdrop { background: rgba(44, 15, 34, .6); }
.fokus-innen { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-width: 720px; margin: 0 auto;
  padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.fk-kopf { position: relative; z-index: 11; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; } /* über der Effektebene */
.fk-tag { margin: 0; line-height: 1.1; }
.fk-tag b { display: block; font-family: var(--schrift-titel); font-weight: 400; font-size: 26px; color: var(--gold); }
.fk-tag span { font-size: 16px; opacity: .88; }
.knopf-rund { display: grid; place-items: center; flex: none; width: 50px; height: 50px; padding: 0; border: 0; border-radius: 50%; cursor: pointer; color: var(--seide);
  background: rgba(255, 248, 244, .1); box-shadow: inset 0 0 0 1.5px rgba(255, 248, 244, .5); -webkit-tap-highlight-color: transparent; }
.knopf-rund svg { width: 24px; height: 24px; }
.knopf-rund:disabled { opacity: .28; cursor: default; }
.knopf-rund:not(:disabled):active { background: rgba(255, 248, 244, .2); }
.fokus :focus-visible, .ansicht :focus-visible { outline-color: var(--gold); }
.fk-buehne { position: relative; min-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.fk-buehne.reisst { cursor: crosshair; }
.fk-buehne.fertig { cursor: default; } /* bleibt touch-action: none – Weiterwischen pustet Schnipsel weg */
.fk-tisch { position: absolute; left: 50%; translate: -50% 0; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(20, 4, 14, .55), rgba(20, 4, 14, .2) 62%, transparent); }
.fk-geschenk { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; }
.fk-geschenk > * { position: absolute; }
.fk-geschenk svg { overflow: visible; }
.fk-hinten { z-index: 1; left: 0; top: 0; }
.fk-deckel { z-index: 4; left: 0; top: 0; transform-origin: 30% 100%; }
.fk-deckel.hinten { z-index: 1; }
.fk-fotohalter { z-index: 2; left: 0; top: 0; clip-path: inset(-300% -60% 0 -60%); pointer-events: none; }
.fk-foto { position: absolute; pointer-events: auto; border: 0; left: 0; top: 0; padding: 4%; background: var(--seide); border-radius: 3px; box-shadow: 0 12px 26px -8px rgba(20, 4, 14, .6); cursor: pointer; transform-origin: 50% 100%; }
.fk-foto img, .fk-foto .ersatz { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 2px; background: #e9d6cf; }
.fk-foto img { animation: einblenden .3s ease-out; }
@keyframes einblenden { from { opacity: 0; } }
.fk-foto .ersatz { font-size: 22px; }
.fk-vorn { z-index: 3; left: 0; top: 0; pointer-events: none; }
.fk-papier { z-index: 5; left: 0; top: 0; pointer-events: none; }
.fk-fx { position: fixed; inset: 0; z-index: 10; width: 100%; height: 100%; pointer-events: none; }
.fk-fuss { position: relative; z-index: 11; text-align: center; padding-top: 6px; }
/* Fortschritt beim Papierreißen: eine Geschenkband-Leiste, die bis zur Schleife wächst (ohne Prozentzahlen) */
.fk-leiste { position: absolute; left: 50%; bottom: 100%; width: min(210px, 60%); height: 12px; translate: calc(-50% - 9px) -4px; border-radius: 999px; pointer-events: none;
  background: rgba(255, 248, 244, .1); box-shadow: inset 0 0 0 1.5px rgba(255, 248, 244, .32); opacity: 0; visibility: hidden; transition: opacity .35s, visibility 0s .35s; }
.fk-leiste.an { opacity: 1; visibility: visible; transition: opacity .35s; }
.fk-leiste-band { position: absolute; left: 2px; top: 2px; bottom: 2px; width: calc((100% - 4px) * var(--wert, 0)); border-radius: 999px;
  background: repeating-linear-gradient(-55deg, rgba(255, 255, 255, .34) 0 3px, transparent 3px 8px), var(--gold); transition: width .3s cubic-bezier(.2, .8, .3, 1); }
.fk-leiste-ziel { position: absolute; left: 100%; top: 50%; width: 30px; height: 20px; margin: -11px 0 0 -12px; overflow: visible;
  fill: var(--band, #c8203f); stroke: rgba(255, 248, 244, .75); stroke-width: 1.6; paint-order: stroke; filter: drop-shadow(0 1px 1.5px rgba(20, 4, 14, .55)); }
.fk-leiste-ziel.hopst { animation: hopsen .55s ease; }
@keyframes hopsen { 30% { transform: translateY(-5px) rotate(-10deg) scale(1.12); } 62% { transform: translateY(1px) rotate(6deg); } }
.schritte { display: flex; justify-content: center; gap: 6px; margin: 0 0 8px; padding: 0; list-style: none; font-size: 14px; }
.schritte li { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; padding: 2px 11px 2px 8px; border-radius: 999px; color: rgba(255, 248, 244, .7); box-shadow: inset 0 0 0 1px rgba(255, 248, 244, .25); }
.schritte li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; }
.schritte li.jetzt { color: var(--brombeer); background: var(--gold); box-shadow: none; font-weight: 700; }
.schritte li.jetzt::before { background: var(--brombeer); box-shadow: none; }
.schritte li.erledigt { color: var(--seide); }
.schritte li.erledigt::before { width: 11px; height: 7px; border-radius: 0; box-shadow: none; border: solid currentColor; border-width: 0 0 2.5px 2.5px; rotate: -45deg; translate: 0 -2px; }
/* Platz für Überschrift + zwei Zeilen von Anfang an: die Fußzeile wächst beim Auspacken nicht mehr in die
   Bühne hinein (sonst rücken Schritte und Hinweis nachträglich über Band und Schnipsel am Tischrand);
   auch Fortschrittsleiste und Knöpfe springen so beim Wechsel der Hinweise nicht */
.fk-hinweis { display: flex; flex-direction: column; justify-content: center; min-height: 4.2em; margin: 0 auto 10px; max-width: 32ch; font-size: 18px; line-height: 1.35; text-wrap: balance; }
.fk-hinweis b { font-family: var(--schrift-titel); font-weight: 400; font-size: 22px; color: var(--gold); display: block; line-height: 1.2; }
.fk-hinweis.stupst { animation: stupsen .4s ease; }
@keyframes stupsen { 30% { transform: translateX(-5px); } 60% { transform: translateX(4px); } }
.fk-knoepfe { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

/* ---------- Bildansicht ---------- */
.ansicht { background:
    radial-gradient(80% 50% at 50% 45%, rgba(255, 248, 244, .12), transparent 70%),
    radial-gradient(circle, rgba(255, 248, 244, .07) 0 1.4px, transparent 1.9px) 0 0 / 26px 26px,
    #3d1830; }
.ansicht-innen { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px;
  padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.ansicht-kopf { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; max-width: 1100px; width: 100%; margin: 0 auto; }
.knopf-klein { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 14px 0 11px; border: 0; border-radius: 999px; cursor: pointer; color: var(--seide);
  font-weight: 700; font-size: 15px; background: rgba(255, 248, 244, .1); box-shadow: inset 0 0 0 1.5px rgba(255, 248, 244, .4); }
.knopf-klein svg { width: 20px; height: 20px; flex: none; }
.ansicht-zaehler { margin: 0; font-size: 15px; opacity: .8; }
.ansicht-buehne { position: relative; min-height: 0; overflow: hidden; touch-action: pan-y pinch-zoom; user-select: none; -webkit-user-select: none; cursor: grab; }
.spur { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; }
.spur img { display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 14px 28px rgba(10, 2, 8, .55)); pointer-events: none; transition: opacity .25s; }
.spur img.laedt-noch { opacity: 0; transition: none; }
/* Platzhalter-Rahmen, solange das große Foto lädt (oder wenn es nicht ankommt): schon in der echten
   Bildform (Seitenverhältnis aus den Metadaten), Tagesfarbe gedämpft + wandernder Lichtschimmer */
.ansicht-platz { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 70%; height: 70%; min-width: min(100%, 250px); min-height: 150px;
  display: grid; place-content: center; justify-items: center; gap: 14px; padding: 14px; overflow: hidden; border-radius: 4px; text-align: center;
  background: #5a2a45; background: color-mix(in srgb, var(--fb, #7a3a5c) 40%, #4a1d39); box-shadow: 0 14px 28px -6px rgba(10, 2, 8, .55); }
.ansicht-platz[hidden] { display: none; }
.ansicht-platz.laedt::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(100deg, rgba(255, 248, 244, 0) 25%, rgba(255, 248, 244, .14) 50%, rgba(255, 248, 244, 0) 75%);
  transform: translateX(-100%); animation: schimmern 1.5s ease-in-out infinite; }
@keyframes schimmern { to { transform: translateX(100%); } }
.ansicht-status { position: relative; margin: 0; max-width: 22ch; font-family: var(--schrift-hand); font-weight: 700; font-size: 26px; line-height: 1.15; color: rgba(255, 248, 244, .9); text-wrap: balance; }
.ansicht-platz .knopf { position: relative; }
.ansicht-platz .knopf[hidden] { display: none; }
.ansicht-fuss { display: grid; grid-template-columns: 50px minmax(0, 1fr) 50px; align-items: center; gap: 8px; max-width: 780px; width: 100%; margin: 0 auto; }
.ansicht-text { text-align: center; min-width: 0; }
.ansicht-text h2 { margin: 0; font-family: var(--schrift-titel); font-weight: 400; font-size: clamp(21px, 5.6vw, 28px); line-height: 1.15; color: var(--gold); text-wrap: balance;
  overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
/* echte Bildunterschriften mit langen Wörtern („Neujahrsspaziergang“): etwas kleiner statt mitten im Wort umbrechen */
.ansicht-text h2.lang { font-size: clamp(17px, 4.6vw, 26px); }
.ansicht-text p { margin: 2px 0 0; font-size: 16px; opacity: .88; }

/* ---------- Größere Bildschirme ---------- */
@media (min-width: 680px) {
  :root { --spalten: 6; --spalt: 12px; }
  .seite { padding-left: max(24px, env(safe-area-inset-left)); padding-right: max(24px, env(safe-area-inset-right)); }
  .hilfe { max-width: 52ch; }
  .etagen { row-gap: 26px; }
  .tisch { margin-top: 26px; }
}
@media (min-width: 960px) {
  :root { --spalten: 8; --spalt: 14px; }
  .kopf { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 34px; text-align: left; max-width: 1100px; margin: 0 auto; }
  .titel { grid-row: span 3; }
  .titel .t1 { font-size: 68px; }
  .titel .t2 { font-size: 32px; }
  .heute-zeile, .hilfe { margin-left: 0; }
  .heute-zeile { margin-top: 0; }
  .kopf-knoepfe { justify-content: flex-start; margin-bottom: 0; }
  .tisch { max-width: 1160px; margin-top: 24px; }
  /* Gabentisch in drei Stufen: hinten schmaler, vorne die breite Tischplatte mit Decke */
  .etage:nth-child(1) { margin: 0 7%; }
  .etage:nth-child(2) { margin: 0 3.5%; }
  .etage:nth-child(3)::after { height: 18px; bottom: -16px; left: -18px; right: -18px; }
  .etage:nth-child(3)::before { content: ""; position: absolute; z-index: 0; left: -18px; right: -18px; bottom: -44px; height: 30px; border-radius: 0 0 6px 6px;
    background: radial-gradient(14px 10px at 14px 0, var(--kirsch) 98%, transparent) 0 100% / 28px 10px repeat-x, linear-gradient(var(--kirsch), #a8152f) 0 0 / 100% 22px no-repeat;
    clip-path: inset(0 0 0 0); filter: drop-shadow(0 6px 6px rgba(61, 24, 48, .3)); }
  .fuss { margin-top: 64px; }
  .fokus-innen { max-width: 820px; }
}
@media (min-width: 960px) and (max-height: 860px) {
  .titel .t1 { font-size: 58px; }
  .titel .t2 { font-size: 28px; }
  .etagen { row-gap: 22px; }
}
/* Handy quer / niedrige Fenster: Kopf zweispaltig und kleiner, damit schon im ersten Bild die erste
   Geschenkreihe zu sehen ist (sonst füllt allein der Titel die ganze Höhe) */
@media (max-height: 540px) and (min-width: 600px) {
  .seite { padding-top: max(10px, env(safe-area-inset-top)); }
  .kopf { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 28px; text-align: left; max-width: 1100px; margin: 0 auto; padding-top: 0; }
  body.fest .kopf { padding-top: 26px; }
  .titel { grid-row: span 3; }
  .titel .t1 { font-size: 46px; }
  .titel .t2 { font-size: 23px; margin-top: 2px; }
  .heute-zeile, .hilfe { margin-left: 0; }
  .heute-zeile { margin-top: 0; font-size: 18px; }
  .hilfe { font-size: 16px; max-width: 46ch; }
  .kopf-knoepfe { justify-content: flex-start; margin: 10px 0 0; }
  .kopf-knoepfe .knopf { min-height: 44px; padding: 0 22px; font-size: 16px; }
  .tisch { margin-top: 18px; }
}
/* Handy quer: Hinweis und Knöpfe neben das Geschenk, damit es groß bleibt */
@media (max-height: 540px) and (min-width: 600px) {
  .fokus-innen { max-width: none; grid-template-columns: minmax(0, 1fr) minmax(220px, 34%); grid-template-rows: auto minmax(0, 1fr); column-gap: 12px; }
  .fk-kopf { grid-column: 1 / -1; min-height: 46px; }
  .fk-buehne { grid-row: 2; grid-column: 1; }
  .fk-fuss { grid-row: 2; grid-column: 2; align-self: center; padding-top: 0; }
  .fk-hinweis { font-size: 16px; min-height: 6em; } /* schmale Spalte: Überschrift + drei Zeilen, damit Leiste und Knopf nicht springen */
}
@media (prefers-reduced-motion: reduce) {
  .wackelt, .huepft { animation-duration: .01s; }
  .z-heute .heiligenschein, .laedt, .vk.wartet::before, .ansicht-platz.laedt::before { animation: none; }
  .fk-foto img { animation: none; }
  .blase { animation: none; }
  .knopf { transition: none; }
  .weiter-unten, .weiter-unten svg { animation: none; }
  .fk-leiste, .fk-leiste.an, .fk-leiste-band { transition: none; }
  .fk-leiste-ziel.hopst { animation: none; }
}
</style>

<div class="seite">
  <header class="kopf">
    <div class="wimpel" aria-hidden="true"></div>
    <h1 class="titel"><span class="t1">{{TITEL_A}}</span> <span class="t2">{{TITEL_B}}</span></h1>
    <p class="heute-zeile" id="heuteZeile"></p>
    <p class="hilfe" id="hilfe"></p>
    <div class="kopf-knoepfe" id="kopfKnoepfe">
      <button type="button" class="knopf" id="heuteFinden"><svg aria-hidden="true"><use href="#i-suche"/></svg><span>Heute finden</span></button>
      <button type="button" class="knopf knopf-leise" id="nachholen" hidden></button>
    </div>
  </header>

  <section class="tisch" id="tisch" aria-labelledby="tischTitel">
    <h2 class="unsichtbar" id="tischTitel">Alle 24 Geschenke</h2>
    <div class="etagen" id="etagen"></div>
    <div class="blase" id="blase" hidden></div>
  </section>
</div>
<footer class="fuss"><p id="fussText">Jeden Tag ein Geschenk. Geöffnete kannst du jederzeit wieder ansehen.</p></footer>
<button type="button" class="weiter-unten" id="weiterUnten" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15m-6.5-6.5L12 19l6.5-6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Dein Geschenk liegt weiter unten</span></button>
<p class="unsichtbar" id="ansage" role="status" aria-live="polite"></p>

<dialog class="fokus" id="fokus" aria-labelledby="fkTitel" aria-describedby="fkHinweis">
  <div class="fk-grund" id="fkGrund" aria-hidden="true"></div>
  <div class="fokus-innen" id="fkInnen">
    <div class="fk-kopf">
      <p class="fk-tag" id="fkTitel"><b id="fkNummer"></b><span id="fkDatum"></span></p>
      <button type="button" class="knopf-rund" id="fkZu" aria-label="Zurück zum Gabentisch"><svg aria-hidden="true"><use href="#i-zu"/></svg></button>
    </div>
    <div class="fk-buehne" id="fkBuehne">
      <div class="fk-tisch" id="fkTisch"></div>
      <div class="fk-geschenk" id="fkGeschenk">
        <svg class="fk-hinten" id="fkHinten" aria-hidden="true"></svg>
        <div class="fk-fotohalter" id="fkFotoHalter"><button type="button" class="fk-foto" id="fkFoto" tabindex="-1" aria-label="Foto groß ansehen"></button></div>
        <svg class="fk-vorn" id="fkVorn" aria-hidden="true"></svg>
        <svg class="fk-deckel" id="fkDeckel" aria-hidden="true"></svg>
        <canvas class="fk-papier" id="fkPapier" aria-hidden="true"></canvas>

      <ol class="schritte" id="fkSchritte" aria-hidden="true"><li>Schleife</li><li>Papier</li><li>Foto</li></ol>
      <p class="fk-hinweis" id="fkHinweis"></p>
      <div class="fk-knoepfe">
        <button type="button" class="knopf knopf-gold" id="fkAuspacken"><svg aria-hidden="true"><use href="#i-paket"/></svg><span>Auspacken</span></button>
        <button type="button" class="knopf knopf-leise" id="fkZurueck" hidden>Zum Gabentisch</button>

    </div>
  </div>
  <canvas class="fk-fx" id="fkFx" aria-hidden="true"></canvas>
</dialog>

<dialog class="ansicht" id="ansicht" aria-labelledby="ansichtTitel">

    <div class="ansicht-kopf">
      <button type="button" class="knopf-klein" id="nochmal"><svg aria-hidden="true"><use href="#i-paket"/></svg><span>Nochmal auspacken</span></button>

      <button type="button" class="knopf-rund" id="ansichtZu" aria-label="Bildansicht schließen"><svg aria-hidden="true"><use href="#i-zu"/></svg></button>
    </div>
    <div class="ansicht-buehne" id="ansichtBuehne">
      <div class="spur" id="spur"><img id="ansichtBild" alt="" draggable="false" data-kein-ersatz>

    </div>
  </div>
</dialog>

  var LOSE_STUECKE_BIS = 0.005;

  };

  function zufall(seed) {
    var a = seed >>> 0;
    return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function leinwand(w, h) { var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
  function klemme(v, a, b) { return v < a ? a : v > b ? b : v; }
  function f1(v) { return Math.round(v * 10) / 10; }
  var MASKE = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return MASKE[c]; }); }
  function sage(text) { el.ansage.textContent = ''; setTimeout(function () { el.ansage.textContent = text; }, 40); }
  function brumm(muster) { if (navigator.vibrate && !REDUZIERT) { try { navigator.vibrate(muster); } catch (e) { /* egal */ } } }

  // Bilder immer über Image + onload/decode laden (echte Server-URLs: asynchron, evtl. 403/404/Netzfehler).
  // Das Versprechen liefert erst ein fertig dekodiertes Bild; bei Fehlern wird es verworfen (nächster Versuch lädt neu).
  var bildCache = {}, geladen = {}; // geladen: URLs, die schon einmal fertig da waren (liegen im Browser-Speicher)
  function ladeBild(url) {
    if (!url) return Promise.reject(new Error('keine URL'));
    if (bildCache[url]) return bildCache[url];
    var p = new Promise(function (ok, fehl) {
      var img = new Image();
      img.decoding = 'async';
      img.onload = function () {
        var fertig = function () { geladen[url] = 1; ok(img); };
        if (img.decode) img.decode().then(fertig, fertig); else fertig();
      };
      img.onerror = function () { delete bildCache[url]; fehl(new Error('Bild fehlt')); };
      img.src = url;
    });
    bildCache[url] = p;
    return p;
  }
  function sicher(fn) { try { return fn(); } catch (e) { return ''; } }
  // Bildunterschrift kann leer sein (echte Bilder ohne Eintrag in texte.txt)

  // Gemalter „Foto folgt“-Platzhalter (nur Produktions-Baustein, im Prototyp gibt es den nicht → '')
  function platzhalterVon(t, px) { return typeof F.platzhalter === 'function' ? sicher(function () { return F.platzhalter(t, px); }) : ''; }
  // Seitenverhältnis (Breite/Höhe) der Collage: echte Maße, falls bekannt (Produktion), sonst aus dem Format

    var m = typeof F.masse === 'function' ? sicher(function () { return F.masse(t); }) : null;
    if (m && m.w > 0 && m.h > 0) return m.w / m.h;
    return sicher(function () { return F.format(t); }) === 'hoch' ? 2 / 3 : 1;
  }
  function farbeVon(t) { var f = sicher(function () { return F.farbe(t); }); return /^#[0-9a-f]{6}$/i.test(f) ? f : '#c98f8f'; }

  /* ================================================================
     Geschenkpapiere: eine Kachel-Malfunktion je Papier (für SVG-Raster und Canvas)
     ================================================================ */
  function stern(g, x, y, R, r, n) {
    g.beginPath();

    A.token++;
    if (!FK.offen) document.documentElement.classList.remove('vollansicht');
    if (A.nochmalWeiter) { A.nochmalWeiter = false; return; }
    var t = A.liste[A.i], z = knoepfe[t] && document.contains(knoepfe[t]) ? knoepfe[t] : A.opener;
    fokussiere(z);
  }
  el.ansicht.addEventListener('close', nachAnsicht);
  el.aZu.addEventListener('click', schliesseAnsicht);
  el.nochmal.addEventListener('click', function () {
    var t = A.liste[A.i];
    A.nochmalWeiter = true;
    schliesseAnsicht();
    oeffneFokus(t, knoepfe[t], true);
  });

  // Rahmen für Ladezustand/Fehler in der echten Bildform, so groß wie das Foto später (object-fit: contain)
  function platzAnpassen() {
    var sw = el.spur.clientWidth, sh = el.spur.clientHeight, r = A.form || 1;
    if (!sw || !sh) return;
    var w = Math.min(sw, sh * r);
    el.aPlatz.style.width = Math.round(w) + 'px'; el.aPlatz.style.height = Math.round(w / r) + 'px';
  }
  function zeigePlatz(text, fehler) {
    el.aStatus.textContent = text;
    el.aNochmal.hidden = !fehler;
    el.aPlatz.classList.toggle('laedt', !fehler);
    el.aPlatz.hidden = false;
    platzAnpassen();
  }
  // Großes Bild (F.bild) nur hier – und zusätzlich höchstens die beiden Nachbarn vorladen
  function setzeAnsicht(t, sofort) {
    var titel = titelVon(t), mein = ++A.token, url = sicher(function () { return F.bild(t); });
    el.aTitel.textContent = titel || 'Tag ' + t;
    el.aTitel.classList.toggle('lang', titel.split(/\s+/).some(function (wort) { return wort.length > 14; }));
    el.aDatum.textContent = titel ? 'Tag ' + t + ' – ' + K.datumText(t) : K.datumText(t);
    el.aZaehler.textContent = (A.i + 1) + ' von ' + A.liste.length;
    el.zurueck.disabled = A.i <= 0; el.weiter.disabled = A.i >= A.liste.length - 1;
    el.aBild.classList.add('laedt-noch');
    el.aBild.alt = titel ? 'Fotocollage von Tag ' + t + ': ' + titel : 'Fotocollage von Tag ' + t;
    A.form = seitenVerhaeltnis(t);
    el.aPlatz.style.setProperty('--fb', farbeVon(t));
    el.aPlatz.hidden = true;
    // kurz warten: Bilder aus dem Speicher sollen nicht mit einem Ladezustand aufblitzen
    var warte = setTimeout(function () { if (mein === A.token) zeigePlatz('Foto wird ausgepackt …', false); }, sofort ? 0 : 140);
    ladeBild(url).then(function (img) {
      if (mein !== A.token) return;
      clearTimeout(warte);
      el.aBild.src = img.src; el.aBild.classList.remove('laedt-noch'); el.aPlatz.hidden = true;
      if (url.indexOf('data:') !== 0) vkErneuern(t); // Netz ist (wieder) da → Platzhalter im Regal ersetzen
      setTimeout(function () {
        if (mein !== A.token || !el.ansicht.open) return;
        [A.liste[A.i + 1], A.liste[A.i - 1]].forEach(function (n) { if (n && K.istGeoeffnet(n)) ladeBild(sicher(function () { return F.bild(n); })).catch(function () { /* egal */ }); });
      }, 350);
    }, function () {
      if (mein !== A.token) return;
      clearTimeout(warte);
      el.aBild.removeAttribute('src');
      zeigePlatz('Dieses Foto kommt gerade nicht an.', true);
    });
  }
  el.aNochmal.addEventListener('click', function () {
    if (!A.offen) return;
    var hatteFokus = document.activeElement === el.aNochmal;
    setzeAnsicht(A.liste[A.i], true);
    if (hatteFokus) fokussiere(el.aZu);
  });
  function zeigeAnsichtsBild(richtung) {
    var t = A.liste[A.i];
    if (!richtung || REDUZIERT || !el.spur.animate) { setzeAnsicht(t); el.spur.style.transform = ''; return; }
    var von = el.spur.style.transform || 'translateX(0px)';
    var aus = el.spur.animate([{ transform: von, opacity: 1 }, { transform: 'translateX(' + (-richtung * 34) + '%)', opacity: 0 }], { duration: 160, easing: 'ease-in', fill: 'forwards' });
    aus.onfinish = function () {
      setzeAnsicht(t); el.spur.style.transform = ''; aus.cancel();
      el.spur.animate([{ transform: 'translateX(' + (richtung * 34) + '%)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 240, easing: 'cubic-bezier(.2,.7,.2,1)' });
    };
  }
  function blaettern(d) {
    var n = A.i + d;
    if (n < 0 || n >= A.liste.length) { zurueckfedern(); return; }
    A.i = n; zeigeAnsichtsBild(d);
  }
  function zurueckfedern() {
    var von = el.spur.style.transform || 'translateX(0px)';
    el.spur.style.transform = '';
    if (el.spur.animate && !REDUZIERT) el.spur.animate([{ transform: von }, { transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1.2)' });
  }
  el.zurueck.addEventListener('click', function () { blaettern(-1); });
  el.weiter.addEventListener('click', function () { blaettern(1); });
  el.ansicht.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); blaettern(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); blaettern(1); }
  });
  el.aBuehne.addEventListener('dragstart', function (e) { e.preventDefault(); });
  el.aBuehne.addEventListener('pointerdown', function (e) {
    if (e.button > 0) return;
    // Knöpfe auf der Bühne („Nochmal versuchen“) bekommen ihren Klick – nicht als Wischgeste einfangen
    if (e.target.closest && e.target.closest('button')) return;
    if (e.pointerType === 'mouse') e.preventDefault();
    A.zug = { id: e.pointerId, x: e.clientX, t: performance.now(), dx: 0 };
    try { el.aBuehne.setPointerCapture(e.pointerId); } catch (x) { /* egal */ }
  });
  el.aBuehne.addEventListener('pointermove', function (e) {
    var z = A.zug;
    if (!z || e.pointerId !== z.id) return;
    var dx = e.clientX - z.x;
    if ((dx > 0 && A.i <= 0) || (dx < 0 && A.i >= A.liste.length - 1)) dx *= .3;
    z.dx = dx; el.spur.style.transform = 'translateX(' + dx.toFixed(1) + 'px)';
  });
  function ansichtZugEnde(e) {
    var z = A.zug;
    if (!z || e.pointerId !== z.id) return;
    A.zug = null;
    var dx = z.dx, dauer = performance.now() - z.t, grenze = Math.min(90, el.aBuehne.clientWidth * .18);
    if (e.type !== 'pointercancel' && (Math.abs(dx) > grenze || (Math.abs(dx) > 28 && dauer < 260))) blaettern(dx < 0 ? 1 : -1);
    else if (dx !== 0) zurueckfedern();
  }
  el.aBuehne.addEventListener('pointerup', ansichtZugEnde);
  el.aBuehne.addEventListener('pointercancel', ansichtZugEnde);

  /* ================================================================
     Start, Datum wechseln, Größe
     ================================================================ */
  function renderAlles() {
    if (FK.offen) schliesseFokus(true);
    A.nochmalWeiter = false;
    schliesseAnsicht(); versteckeBlase();
    kopf(); baueTisch();
    beobachteHeute(true);
  }
  renderAlles();
  K.onChange(renderAlles);
  var groesseUhr = 0;
  window.addEventListener('resize', function () {
    clearTimeout(groesseUhr);
    groesseUhr = setTimeout(function () {
      if (spalten() !== aktSpalten) { versteckeBlase(); baueTisch(); beobachteHeute(false); }
      if (FK.offen) fkNeuVermessen();
      if (A.offen && !el.aPlatz.hidden) platzAnpassen();
    }, 120);
  });
  // Die einmalige Einladung (heutiges Geschenk hüpft, sobald es zu sehen ist) steckt in beobachteHeute().
})();
