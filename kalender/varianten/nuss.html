<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Der Nussknacker – {{TITEL}}</title>
<link rel="stylesheet" href="../fonts/nuss.css">
<style>
:root{
  --tisch:#2a1a10;     /* dunkle Eichenplatte, Bildansicht */
  --holz:#d9a86c;      /* Buchenholz des Nussknackers */
  --leinen:#efe5d2;    /* Leinentuch, helle Schrift */
  --lack:#b8352b;      /* roter Drechslerlack */
  --gold:#e8b84a;      /* die goldene Nuss */
  --kerze:#ffd58f;     /* Kerzenschein */
  --schrift-titel:'Young Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --schrift-text:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --schrift-zahl:'Bree Serif','Rockwell',Georgia,serif;
}
*{box-sizing:border-box}
html{background:var(--tisch);-webkit-text-size-adjust:100%}
html.ansicht-offen{overflow:hidden}
/* Menü-Knopf aus kalender.js (#kalender-reset, runder 40-px-Knopf: Ansicht wechseln, Testmodus): kalender.js
   setzt ihn fest unten links (Inline-Stil, nicht verschiebbar). Die Seite lässt unten genug Rand
   (--menue-knopf-zone), damit am Seitenende nichts darunter liegt; in der Bildansicht ist er ausgeblendet. */
html.ansicht-offen #kalender-reset{display:none}
body{position:relative;margin:0;min-height:100vh;color:var(--leinen);font-family:var(--schrift-text);font-size:1.0625rem;line-height:1.5;overflow-x:clip}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(70% 42% at 12% 4%,rgba(255,196,110,.22),transparent 70%),
    radial-gradient(90% 60% at 50% 110%,rgba(0,0,0,.5),transparent 70%),
    repeating-linear-gradient(90deg,transparent 0 calc(25% - 2px),rgba(0,0,0,.32) calc(25% - 2px) 25%),
    repeating-linear-gradient(91deg,rgba(255,222,170,.028) 0 3px,transparent 3px 11px,rgba(0,0,0,.06) 11px 13px,transparent 13px 23px,rgba(255,222,170,.02) 23px 24px,transparent 24px 37px),
    linear-gradient(180deg,#3d2717 0%,var(--tisch) 46%,#1d120a 100%)}
body.november::before{background:
    radial-gradient(70% 42% at 12% 4%,rgba(255,196,110,.13),transparent 70%),
    radial-gradient(90% 60% at 50% 110%,rgba(0,0,0,.55),transparent 70%),
    repeating-linear-gradient(90deg,transparent 0 calc(25% - 2px),rgba(0,0,0,.32) calc(25% - 2px) 25%),
    repeating-linear-gradient(91deg,rgba(255,222,170,.025) 0 3px,transparent 3px 11px,rgba(0,0,0,.06) 11px 13px,transparent 13px 23px),
    linear-gradient(180deg,#33200f 0%,#25170d 46%,#190f08 100%)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--kerze);outline-offset:3px}
/* Nach Tippen/Klicken setzt das Skript den Fokus weiter (Screenreader, spätere Tastaturbedienung) – der Ring
   erscheint aber nur bei Tastaturbedienung (html.per-zeiger: letzte Eingabe war Finger, Maus oder Stift) */
html.per-zeiger :focus-visible{outline:none}
.unsichtbar{position:absolute!important;top:0;left:0;width:1px;height:1px;margin:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* ---------- Seite ---------- */
.seite{max-width:1320px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(max(18px,env(safe-area-inset-bottom)) + 58px) max(14px,env(safe-area-inset-left))}
.kopf{position:relative;text-align:center;padding:2px 6px 0}
.kopf h1,.tafel h2,.a-text h2,.blase strong{font-variant-numeric:lining-nums}
.kopf h1{margin:0;font-family:var(--schrift-titel);font-weight:400;font-size:clamp(1.7rem,7.2vw,2.75rem);line-height:1.08;letter-spacing:.005em;color:#f8ecd6;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.heute-zeile{margin:.35rem 0 0;color:var(--kerze);font-size:1.02rem;text-wrap:balance}
.lichterkette{display:none;position:absolute;left:-14px;right:-14px;top:-14px;height:34px;pointer-events:none;
  background:
    radial-gradient(circle at 50% 70%,#fff1c2 0 2.4px,rgba(255,206,120,.55) 3.4px,transparent 8px) 0 0/58px 34px,
    radial-gradient(150% 60% at 50% -20%,transparent 0 60%,rgba(60,40,20,.7) 61% 64%,transparent 65%) 0 0/58px 34px}
body.fest .lichterkette{display:block}
body.fest .kopf{padding-top:24px}

.tisch{display:grid;grid-template-columns:minmax(0,1fr);row-gap:26px;margin-top:10px}
.werkbank{position:relative;min-width:0}
.werkbank::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(48% 34% at 14% 36%,rgba(255,190,105,.2),rgba(255,170,90,.07) 55%,transparent 75%)}

/* ---------- Bühne mit Nussknacker ---------- */
.buehne{--bw:min(100%,560px);position:relative;width:var(--bw);aspect-ratio:100/74;margin:0 auto;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.buehne canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* Nur Griff- und Nusszone fangen Touch-Gesten; König, Kerze und Brett lassen die Seite scrollen */
.zone{position:absolute;z-index:1;-webkit-tap-highlight-color:transparent}
.zone-griff{left:60%;top:0;right:0;height:52%;touch-action:none;cursor:grab}
.zone-nuss{left:37%;top:28%;width:26%;height:48%}
.buehne.scharf .zone-nuss{touch-action:none;cursor:grab}
.buehne.scharf{cursor:pointer}
.buehne.zieht,.buehne.zieht .zone{cursor:grabbing}
.sagt{position:absolute;left:27%;top:8.5%;z-index:3;max-width:46%;padding:.28rem .7rem .34rem;border-radius:13px 13px 13px 4px;background:#fbf4e6;color:#3a200d;
  font-family:var(--schrift-titel);font-size:clamp(.92rem,3.7vw,1.12rem);line-height:1.15;white-space:nowrap;box-shadow:0 8px 18px -8px rgba(0,0,0,.75);pointer-events:none;opacity:0;transform-origin:0 100%}
.sagt::after{content:"";position:absolute;left:-7px;bottom:5px;border:7px solid transparent;border-left:0;border-right-color:#fbf4e6}
.ton{position:absolute;left:0;top:0;z-index:3;display:grid;place-items:center;width:40px;height:40px;padding:0;border:0;border-radius:50%;cursor:pointer;
  color:rgba(239,229,210,.62);background:rgba(239,229,210,.05);box-shadow:inset 0 0 0 1px rgba(239,229,210,.2);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ton::before{content:"";position:absolute;inset:-3px}
.ton svg{width:21px;height:21px}
.ton[aria-pressed="true"] .aus,.ton[aria-pressed="false"] .an{display:none}
.ton:active{background:rgba(239,229,210,.14)}
.knall{position:absolute;left:0;top:0;z-index:2;pointer-events:none;font-family:var(--schrift-titel);font-size:clamp(1.3rem,5.6vw,2.1rem);line-height:1;color:#fff3d6;white-space:nowrap;
  text-shadow:0 0 1px #3a200d,0 2px 0 #3a200d,0 0 14px rgba(255,190,90,.65);opacity:0}

.tafel{text-align:center;max-width:34rem;margin:4px auto 0;padding:0 4px}
.tafel h2{margin:0 0 .2rem;font-family:var(--schrift-titel);font-weight:400;font-size:clamp(1.35rem,5.4vw,1.75rem);line-height:1.15;color:#f8ecd6;text-wrap:balance}
.tafel p{margin:0 auto .85rem;max-width:30rem;color:rgba(239,229,210,.86);text-wrap:pretty}
.knoepfe{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tafel .knoepfe{margin:2px 0 14px}
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.6rem 1.25rem;border:0;border-radius:14px;font-weight:700;font-size:1.04rem;line-height:1.1;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.knopf svg{width:1.35em;height:1.35em;flex:none}
.knopf[hidden]{display:none}
.knopf-lack{color:#fff4e2;background:linear-gradient(180deg,#d9503f 0%,var(--lack) 52%,#8e231a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -2px 0 rgba(0,0,0,.25),0 8px 16px -8px rgba(0,0,0,.8)}
.knopf-lack:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,0,.25),0 4px 10px -6px rgba(0,0,0,.8)}
.knopf-leinen{color:var(--leinen);background:rgba(239,229,210,.07);box-shadow:inset 0 0 0 1.5px rgba(239,229,210,.55)}
.knopf-leinen:active{background:rgba(239,229,210,.15)}
.knopf-klein{min-height:44px;padding:.45rem 1rem;font-size:.98rem;color:var(--kerze);background:rgba(239,229,210,.05);box-shadow:inset 0 0 0 1px rgba(232,184,74,.6)}
.knopf-klein svg{width:1.2em;height:1.2em}

/* ---------- Leinentuch mit Nüssen ---------- */
.tuch-bereich{position:relative;min-width:0;max-width:640px;width:100%;margin:0 auto}
.tuch-bereich h2{margin:0;font-family:var(--schrift-titel);font-weight:400;font-size:clamp(1.3rem,5vw,1.65rem);line-height:1.15;color:#f8ecd6}
.legende{display:grid;grid-template-columns:repeat(2,max-content);gap:4px 22px;margin:.4rem 0 .9rem;padding:0;list-style:none;font-size:.95rem;color:rgba(239,229,210,.85)}
.legende li{display:inline-flex;align-items:center;gap:6px}
.legende li[hidden]{display:none}
.legende svg,.legende .mini-offen{width:26px;height:26px;flex:none}
.mini-offen{position:relative;display:inline-block}
.mini-offen i{position:absolute;left:18%;top:6%;width:64%;height:58%;border-radius:2px;background:linear-gradient(135deg,#8fc0e0,#e9c27a);box-shadow:0 0 0 1.5px #f6ecd6}
.mini-offen svg{position:absolute;bottom:0;width:58%;height:auto}
.mini-offen svg:first-of-type{left:-4%;transform:rotate(-14deg)}
.mini-offen svg:last-of-type{right:-4%;transform:scaleX(-1) rotate(-14deg)}

.tuch{--sp:4;position:relative;display:grid;grid-template-columns:repeat(var(--sp),minmax(0,1fr));grid-auto-rows:clamp(68px,19.5vw,92px);
  padding:38px clamp(10px,3.4vw,22px) 38px;border-radius:5px;color:#3a200d;
  background:
    linear-gradient(180deg,transparent 0 13px,rgba(184,53,43,.88) 13px 18px,transparent 18px 22px,rgba(184,53,43,.75) 22px 24px,transparent 24px) top/100% 30px no-repeat,
    linear-gradient(0deg,transparent 0 13px,rgba(184,53,43,.88) 13px 18px,transparent 18px 22px,rgba(184,53,43,.75) 22px 24px,transparent 24px) bottom/100% 30px no-repeat,
    repeating-linear-gradient(0deg,rgba(120,92,55,.075) 0 1px,transparent 1px 3px,rgba(120,92,55,.05) 3px 4px,transparent 4px 7px),
    repeating-linear-gradient(90deg,rgba(120,92,55,.085) 0 1px,transparent 1px 3px,rgba(255,255,255,.12) 3px 4px,transparent 4px 9px),
    repeating-linear-gradient(90deg,transparent 0 41px,rgba(120,92,55,.06) 41px 43px,transparent 43px 97px),
    radial-gradient(120% 90% at 20% 0%,#f6eedd 0%,var(--leinen) 45%,#e2d4b9 100%);
  box-shadow:0 22px 34px -18px rgba(0,0,0,.85),0 3px 0 rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.45),inset 0 0 30px rgba(120,90,50,.12)}
.tuch::before{content:"";position:absolute;inset:6px;border:1.5px dashed rgba(140,100,60,.42);border-radius:3px;pointer-events:none}
.nuss{position:relative;display:grid;place-items:center;min-width:0;min-height:56px;margin:0;padding:0;border:0;border-radius:26%;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transform:translate(var(--dx,0),var(--dy,0)) rotate(var(--r,0deg))}
.nuss:focus-visible{outline:3px solid #7d2418;outline-offset:-2px}
.figur{position:relative;display:block;width:min(88%,78px);aspect-ratio:1}
.figur>svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 2px rgba(70,40,15,.4))}
.nuss-svg text{font-family:var(--schrift-zahl);font-size:33px;text-anchor:middle}
.nuss-svg .z{fill:#3a200d;fill-opacity:.84}
.nuss-svg .zl{fill:#ffe9c4;fill-opacity:.4}
.nuss-svg.gold .z{fill:#5a3604;fill-opacity:.88}
.nuss-svg.gold .zl{fill:#fff7d8;fill-opacity:.6}
.z-heute .figur::before{content:"";position:absolute;inset:-22%;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,214,120,.75),rgba(255,196,90,.32) 55%,rgba(255,196,90,0) 100%);animation:gluehen 2.6s ease-in-out 8}
@keyframes gluehen{50%{opacity:.45;transform:scale(.9)}}
.leer .figur::before{display:none}
.z-heute.gefunden .figur::before{animation:none;inset:-34%;background:radial-gradient(closest-side,rgba(255,224,140,.95),rgba(255,196,90,.4) 55%,rgba(255,196,90,0) 100%)}
.offen .foto{position:absolute;left:17%;top:3%;width:66%;height:66%;border-radius:3px;overflow:hidden;transform:rotate(-4deg);
  background:repeating-linear-gradient(135deg,#e9dcc2 0 4px,#f3e9d6 4px 8px);box-shadow:0 0 0 2.5px #f8f0df,0 3px 5px 1px rgba(70,40,15,.38)}
.offen .foto img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .3s ease-out}
/* Vorschau lädt (echte Bilder kommen asynchron vom Server): Tagesfarbe unter den Leinenstreifen, das Bild
   blendet erst nach dem Laden ein – nie ein leeres, schwarzes oder kaputtes Feld, keine Dauer-Animation */
.offen .foto.laedt{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.2) 0 4px,rgba(255,255,255,0) 4px 8px)}
.offen .foto.laedt img{opacity:0;transition:none}
.offen .schale{position:absolute;bottom:5%;width:51%;height:auto;filter:drop-shadow(0 2px 1.5px rgba(70,40,15,.45))}
.offen .sl{left:-3%;transform:rotate(-16deg)}
.offen .sr{right:-3%;transform:scaleX(-1) rotate(-14deg)}
.offen .nr{position:absolute;right:-6%;top:-6%;min-width:25px;height:25px;padding:0 5px;border-radius:13px;display:grid;place-items:center;font-family:var(--schrift-zahl);font-size:14px;line-height:1;color:#3a200d;background:#f8f0df;box-shadow:0 0 0 1.5px rgba(140,100,60,.55),0 2px 3px rgba(70,40,15,.3)}
.mulde{position:absolute;inset:12% 8% 8%;border-radius:50%;display:grid;place-items:center;font-family:var(--schrift-zahl);font-size:20px;color:rgba(120,85,45,.55);
  background:radial-gradient(closest-side,rgba(110,80,45,.26),rgba(110,80,45,.12) 70%,transparent);box-shadow:inset 0 2px 4px rgba(90,60,30,.18)}
.z-heute.leer .mulde{color:#8a5d12;background:radial-gradient(closest-side,rgba(232,184,74,.32),rgba(232,184,74,.12) 70%,transparent);box-shadow:inset 0 2px 4px rgba(90,60,30,.18),0 0 0 1.5px rgba(193,142,44,.55)}
.neu .figur{animation:aufploppen .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes aufploppen{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.zurueckrollen .figur{animation:zurueckrollen .7s cubic-bezier(.3,.7,.3,1)}
@keyframes zurueckrollen{0%{transform:none}28%{transform:translate(9px,-5px) rotate(38deg)}58%{transform:translate(-4px,0) rotate(-14deg)}80%{transform:translate(2px,0) rotate(6deg)}100%{transform:none}}
.hopst .figur{animation:hopsen .9s cubic-bezier(.3,.7,.3,1)}
@keyframes hopsen{0%,100%{transform:none}20%{transform:translateY(-16px) scale(1.08)}40%{transform:translateY(0) scale(1.03,.95)}58%{transform:translateY(-9px) scale(1.05)}76%{transform:none}}
.kaputt{background:repeating-linear-gradient(135deg,#d9c7a6 0 5px,#ebdfc6 5px 10px)!important}

.blase{position:absolute;z-index:20;width:max-content;max-width:min(270px,88%);padding:.55rem .85rem .65rem;border-radius:14px;background:#fbf4e6;color:#3a200d;font-size:.95rem;line-height:1.3;box-shadow:0 12px 28px -10px rgba(0,0,0,.75);pointer-events:none;animation:blaseRein .3s cubic-bezier(.2,.9,.3,1.25)}
.blase strong{display:block;font-family:var(--schrift-titel);font-weight:400;font-size:1.22rem;line-height:1.15;margin-bottom:.1rem}
.blase::after{content:"";position:absolute;top:100%;left:var(--pfeil,50%);margin-left:-8px;border:8px solid transparent;border-top-color:#fbf4e6}
.blase.unten::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#fbf4e6}
.blase[hidden]{display:none}
@keyframes blaseRein{from{opacity:0;transform:translateY(6px) scale(.94)}to{opacity:1;transform:none}}

.flug{position:fixed;left:0;top:0;z-index:40;pointer-events:none;will-change:transform}
.flug svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 5px rgba(0,0,0,.4))}

/* ---------- Bildansicht: das ausgerollte Pergament ---------- */
.ansicht{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;overflow:hidden;background:transparent;color:var(--leinen)}
.ansicht::backdrop{background:transparent}
.a-hg{position:absolute;inset:0;
  background:
    radial-gradient(70% 48% at 50% 40%,rgba(255,196,110,.2),transparent 70%),
    repeating-linear-gradient(91deg,rgba(255,222,170,.03) 0 3px,transparent 3px 11px,rgba(0,0,0,.07) 11px 13px,transparent 13px 23px),
    radial-gradient(90% 70% at 50% 40%,#4a2f1b 0%,#2e1c10 60%,#170e07 100%)}
.a-innen{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.a-kopf{display:flex;align-items:center;gap:10px;min-height:50px;max-width:1100px;width:100%;margin:0 auto}
.a-zaehler{flex:1;min-width:0;margin:0 0 0 4px;font-size:.98rem;color:var(--kerze);white-space:nowrap}
.a-buehne{position:relative;min-height:0;overflow:hidden;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none;cursor:grab}
.spur{position:absolute;inset:0}
.papier{position:absolute;left:0;top:0;--rh:14px;--pad:10px}
.blatt{position:absolute;left:0;right:0;top:calc(var(--rh) / 2);bottom:calc(var(--rh) / 2);padding:var(--pad);
  background:
    radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.5),transparent 60%),
    repeating-linear-gradient(0deg,rgba(150,115,70,.05) 0 1px,transparent 1px 4px),
    linear-gradient(180deg,#f6ecd8,#eadcc0);
  box-shadow:0 22px 40px -14px rgba(0,0,0,.8),inset 0 0 18px rgba(150,110,60,.25)}
.blatt img{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none;pointer-events:none;background:#e9dcc2}
.blatt img[hidden]{display:none}
.rolle{position:absolute;left:-7px;right:-7px;height:var(--rh);border-radius:calc(var(--rh) / 2);z-index:1;
  background:linear-gradient(180deg,#fff9ec 0%,#efe1c4 38%,#cfb68c 78%,#a88b60 100%);box-shadow:0 3px 6px rgba(0,0,0,.4)}
.rolle::before,.rolle::after{content:"";position:absolute;top:0;width:var(--rh);height:var(--rh);border-radius:50%;
  background:radial-gradient(circle,#b89a6c 0 12%,#f3e6cb 14% 30%,#c9ad80 32% 40%,#f3e6cb 42% 58%,#c9ad80 60% 66%,#efe1c4 68%)}
.rolle::before{left:0}.rolle::after{right:0}
.rolle.oben{top:0}.rolle.unten{bottom:0}
.rolle .band{position:absolute;left:50%;top:-2px;bottom:-2px;width:9px;margin-left:-4.5px;border-radius:2px;background:linear-gradient(90deg,#8e231a,#d9503f 50%,#8e231a);opacity:0}
.zu-gerollt .rolle.unten .band{opacity:1}
.a-laden{position:absolute;inset:var(--pad);display:grid;place-items:center;align-content:center;gap:10px;text-align:center;padding:12px;color:#6a4a2a;font-size:1rem;
  background:repeating-linear-gradient(135deg,#e9dcc2 0 10px,#efe4cf 10px 20px)}
.a-laden[hidden]{display:none}
.a-laden>svg{width:46px;height:46px;animation:drehen 1.1s linear infinite}
@keyframes drehen{to{transform:rotate(360deg)}}
/* Ladeanzeige erst nach kurzer Wartezeit – schnell geladene Fotos sollen sie nicht aufblitzen lassen */
.a-laden.laedt>*{animation:spaetEin .25s ease-out .3s both}
.a-laden.laedt>svg{animation:drehen 1.1s linear infinite,spaetEin .25s ease-out .3s both}
@keyframes spaetEin{from{opacity:0}to{opacity:1}}
.a-laden p{margin:0;max-width:20rem;text-wrap:balance}
.a-laden .knopf{color:#fff4e2}
.a-status{position:absolute;left:0;right:0;text-align:center;font-size:.95rem;color:var(--kerze);pointer-events:none}
.a-status[hidden]{display:none}
.a-fuss{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;gap:8px;max-width:780px;width:100%;margin:0 auto}
.a-text{text-align:center;min-width:0}
.a-text h2{margin:0;font-family:var(--schrift-titel);font-weight:400;font-size:clamp(1.25rem,4.8vw,1.75rem);line-height:1.15;color:#f8ecd6;text-wrap:balance}
.a-text p{margin:.15rem 0 0;color:var(--kerze);font-size:.98rem}
.rund{display:grid;place-items:center;width:52px;height:52px;flex:none;padding:0;border:0;border-radius:50%;cursor:pointer;color:var(--leinen);background:rgba(239,229,210,.08);box-shadow:inset 0 0 0 1.5px rgba(232,184,74,.8);-webkit-tap-highlight-color:transparent}
.rund svg{width:24px;height:24px}
.rund:disabled{opacity:.3;cursor:default}
.rund:not(:disabled):active{background:rgba(239,229,210,.16)}
.a-nochmal{min-height:44px;padding:.4rem .9rem}
@media (max-width:380px){.a-nochmal{padding:.4rem .7rem;font-size:.92rem}.a-kopf{gap:8px}}
/* Handy quer: Pfeile und Texte an die Seiten, das Foto nutzt die volle Höhe */
@media (max-height:500px) and (orientation:landscape){
  .a-innen{grid-template-columns:clamp(116px,23vw,250px) minmax(0,1fr) clamp(116px,23vw,250px);grid-template-rows:auto minmax(0,1fr) auto;gap:6px 8px}
  .a-kopf,.a-fuss{display:contents}
  .a-zaehler{grid-column:1;grid-row:1;align-self:start;margin:4px 0 0 4px;white-space:normal}
  #aZu{grid-column:3;grid-row:1;justify-self:end;align-self:start}
  .a-nochmal{grid-column:3;grid-row:3;justify-self:end;align-self:end;max-width:100%;text-align:left}
  #aVor{grid-column:1;grid-row:2;align-self:center;justify-self:start}
  #aNach{grid-column:3;grid-row:2;align-self:center;justify-self:end}
  .a-text{grid-column:1;grid-row:3;align-self:end;text-align:left;padding-left:4px}
  .a-text h2{font-size:1.15rem}
  .a-text p{font-size:.9rem}
  .a-buehne{grid-column:2;grid-row:1/4}
}

/* ---------- Tablet & Desktop ---------- */
@media (min-width:600px){
  .legende{display:flex;flex-wrap:wrap}
  .tuch{--sp:6;padding:40px 24px}
  .tuch-bereich{max-width:660px}
}
@media (min-width:960px){
  .seite{padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right));padding-bottom:max(20px,env(safe-area-inset-bottom))}
  .tisch{grid-template-columns:minmax(0,1.06fr) minmax(0,1fr);align-items:start;column-gap:clamp(28px,4vw,64px);margin-top:14px}
  .tuch-bereich{margin-top:clamp(8px,3vh,34px)}
  .buehne{--bw:min(100%,660px,calc((100vh - 320px) * 1.351))}
  @supports (height:100svh){.buehne{--bw:min(100%,660px,calc((100svh - 320px) * 1.351))}}
  .tuch-bereich{max-width:620px}
  .tuch{grid-auto-rows:clamp(76px,7.4vw,96px)}
}
/* Schmaler Desktop/Tablet quer: Die Tafel-Texte reichen hier bis an den linken Rand – unten links die Ecke des
   Menü-Knopfs (--menue-knopf-zone) freihalten, die Bühne rechnet den Platz mit ein (sonst läge der Knopf über Text) */
@media (min-width:960px) and (max-width:1129px){
  .werkbank{padding-bottom:44px}
  .buehne{--bw:min(100%,660px,calc((100vh - 364px) * 1.351))}
  @supports (height:100svh){.buehne{--bw:min(100%,660px,calc((100svh - 364px) * 1.351))}}
}
/* Handy quer: Bühne so klein, dass Nussknacker und goldene Nuss ohne Scrollen zu sehen sind */
@media (max-height:500px) and (orientation:landscape) and (max-width:959px){
  .buehne{--bw:min(100%,560px,calc((100vh - 104px) * 1.351))}
  @supports (height:100svh){.buehne{--bw:min(100%,560px,calc((100svh - 104px) * 1.351))}}
}
@media (prefers-reduced-motion:reduce){
  .z-heute .figur::before{animation:none}
  .neu .figur,.zurueckrollen .figur,.hopst .figur,.blase{animation:none}
  .a-laden>svg,.a-laden.laedt>svg{animation-duration:3s}
}
</style>

    </div>
  </div>
</dialog>

    };

  // Ausrollen: (1) die kleine Rolle fliegt von der Nuss in die Mitte, (2) wartet aufs Foto, (3) rollt sich auf
  function entrolle(art, geladen, mein) {
    var pap = el.papier, blatt = el.blatt, ru = el.rolleUnten;

    var flugFertig = new Promise(function (ok) { if (flug) { flug.onfinish = ok; flug.oncancel = ok; } else ok(); });
    Promise.all([flugFertig, geladen]).then(function () { clearTimeout(warten); aufrollen(820); });
  }

  function blaettern(d) {
    var n = A.i + d;

    if (e.button > 0 || (e.target.closest && e.target.closest('button'))) return;
