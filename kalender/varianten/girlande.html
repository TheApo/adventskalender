<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kugel-Girlanden – {{TITEL}}</title>
<link rel="stylesheet" href="../fonts/girlande.css">
<style>
:root {
  /* Farb-Tokens */
  --nacht: #08170f;      /* Tannennacht, fast schwarz */
  --tanne: #1b3d2c;      /* Nadelgrün für Flächen */
  --matt: #46705a;       /* mattgrüne Kugel */
  --rot: #c9302b;        /* Kugelrot */
  --gold: #d9ad55;       /* Kappen, Fäden, Schrift-Akzent */
  --creme: #f3e6c8;      /* Ziffern, Text */
  /* Schrift-Tokens */
  --schrift-display: 'Fraunces', 'Georgia', 'Times New Roman', serif;
  --schrift-fein: 'Cormorant Garamond', 'Georgia', serif;
  --cw: calc(100vw - 28px);
  --d: 84px;
  --sw: 120px;
}

* { box-sizing: border-box; }
html { background: var(--nacht); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  color: var(--creme);
  font-family: var(--schrift-display);
}
.seite { overflow-x: hidden; overflow-x: clip; }
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    var(--muster1, none),
    var(--muster2, none),
    radial-gradient(110% 70% at 50% 30%, #13301f 0%, #0c2016 42%, #06120c 100%);
  background-size: 230px 230px, 370px 370px, auto;
  pointer-events: none;
}
button { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Lichterkette oben ---------- */
.lichter { display: block; width: 100%; height: 34px; overflow: hidden; }
.birne { transform-box: fill-box; }
.fest .birne.funkel { animation: funkeln 2.6s ease-in-out infinite; }
@keyframes funkeln { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

/* ---------- Kopf ---------- */
.kopf {
  width: var(--cw);
  margin: 2px auto 0;
  display: grid;
  gap: 14px 40px;
}
.titel {
  margin: 0;
  font-family: var(--schrift-display);
  font-weight: 800;
  font-size: clamp(31px, 9.4vw, 62px);
  line-height: 1;
  letter-spacing: -0.012em;
  font-variation-settings: 'opsz' 144, 'SOFT' 35, 'WONK' 1;
  color: var(--creme);
  text-shadow: 0 2px 0 rgba(0, 0, 0, .35), 0 8px 22px rgba(0, 0, 0, .5);
}
.titel .z1, .titel .z2 { display: block; }
.initial { position: relative; color: #d8392f; }
.ilex {
  position: absolute;
  width: .8em;
  height: auto;
  left: -.28em;
  top: -.36em;
  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .45));
  pointer-events: none;
}
.unterzeile {
  margin: 12px 0 0;
  font-family: var(--schrift-fein);
  font-weight: 600;
  font-size: clamp(14.5px, 3.9vw, 19px);
  letter-spacing: .06em;
  color: var(--gold);
}
.trenn {
  display: inline-block;
  width: .3em;
  height: .3em;
  margin: 0 .4em;
  background: var(--gold);
  transform: translateY(-.18em) rotate(45deg);
  opacity: .75;
}
.statusblock { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.aktionen { display: flex; flex-wrap: wrap; gap: 8px 10px; }
.aktionen[hidden], .jahr[hidden] { display: none; }
.sprungliste { display: contents; }
.sprung {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  min-height: 44px;
  padding: 0 16px 0 10px;
  border: 1.5px solid rgba(217, 173, 85, .6);
  border-radius: 22px;
  background: rgba(8, 23, 15, .6);
  color: var(--creme);
  font-weight: 600;
  font-size: 15.5px;
  font-variation-settings: 'opsz' 14;
  cursor: pointer;
}
.sprung:hover { background: rgba(217, 173, 85, .14); }
.sprung:focus-visible { outline: 3px solid var(--creme); outline-offset: 3px; }
.sprung .mini { width: 18px; height: 18px; }
.status {
  margin: 0;
  font-size: 16px;
  line-height: 1.5;
  font-weight: 400;
  font-variation-settings: 'opsz' 14, 'SOFT' 50;
  color: rgba(243, 230, 200, .84);
  max-width: 34em;
}
.status strong { font-weight: 650; color: var(--creme); }
.status .gold { color: #e9c477; }
.jahr {
  min-height: 44px;
  padding: 0 20px;
  border: 1.5px solid rgba(217, 173, 85, .75);
  border-radius: 22px;
  background: rgba(8, 23, 15, .6);
  color: var(--creme);
  font-weight: 600;
  font-size: 16px;
  font-variation-settings: 'opsz' 14;
  cursor: pointer;
}
.jahr:hover { background: rgba(217, 173, 85, .14); }
.jahr:focus-visible, .zu-heute:focus-visible, .a-knopf:focus-visible { outline: 3px solid var(--creme); outline-offset: 3px; }

@media (min-width: 1000px) {
  .kopf { grid-template-columns: 1fr 400px; align-items: end; }
  .titel { white-space: nowrap; font-size: min(60px, 4.1vw, calc((var(--cw) - 440px) / 11.8)); }
  .titel .z1, .titel .z2 { display: inline; }
  .unterzeile { letter-spacing: .1em; }
  .trenn { margin: 0 .55em; }
  .statusblock { padding-bottom: 4px; }
  /* Desktop: alle Kugeln sind ohnehin sichtbar – keine „Zu Kugel …“-Pillen oben rechts (sparen Platz, kein Scrollen) */
  .sprungliste { display: none; }
  .status { font-size: 15.5px; }
}

@media (orientation: landscape) and (max-height: 520px) and (min-width: 600px) {
  .kopf { grid-template-columns: 1fr minmax(240px, 320px); align-items: end; gap: 10px 32px; }
  .titel { white-space: nowrap; font-size: min(clamp(26px, 8vh, 40px), calc((var(--cw) - 300px) / 11.8)); }
  .titel .z1, .titel .z2 { display: inline; }
  .unterzeile { margin-top: 8px; font-size: 15px; }
  .status { font-size: 15px; }
}

/* ---------- Baum / Girlanden ---------- */
.baum {
  position: relative;
  width: var(--cw);
  margin: 10px auto 0;
  touch-action: pan-y pinch-zoom;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.reihe { position: relative; }
.girlande {
  position: absolute;
  left: -10px;
  top: 0;
  pointer-events: none;
}
.haenger {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: 0;
  height: 0;
}
.pendel {
  position: absolute;
  top: 0;
  left: calc(var(--d) * -.5);
  width: var(--d);
  transform-origin: 50% 0;
  will-change: transform;
}
.schwung { transform-origin: 50% 0; }
.faden {
  display: block;
  width: 1px;
  height: var(--l);
  margin: 0 auto;
  background: linear-gradient(rgba(233, 205, 140, .25), rgba(233, 205, 140, .85));
}
.kugel {
  position: relative;
  display: block;
  width: var(--d);
  height: calc(var(--d) * 1.17);
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  isolation: isolate;
  -webkit-tap-highlight-color: transparent;
  touch-action: pan-y pinch-zoom;
}
.kugel:focus { outline: none; }
.kugel::after {
  content: '';
  position: absolute;
  z-index: 4;
  left: 0;
  bottom: 0;
  width: var(--d);
  height: var(--d);
  border-radius: 50%;
  box-shadow: 0 0 0 3px #f1cf86, 0 0 18px 4px rgba(241, 207, 134, .55);
  opacity: 0;
  pointer-events: none;
}
.ruft .kugel::after { animation: rufen 1s ease-out 3; }
@keyframes rufen { 0% { opacity: .95; transform: scale(1); } 100% { opacity: 0; transform: scale(1.7); } }
.kugel:focus-visible .koerper { outline: 3px solid var(--creme); outline-offset: 5px; }
.oese {
  position: absolute;
  top: 0;
  left: 50%;
  width: calc(var(--d) * .09);
  height: calc(var(--d) * .09);
  margin-left: calc(var(--d) * -.045);
  border: 1.5px solid #caa14c;
  border-radius: 50%;
}
.kappe {
  position: absolute;
  z-index: 2;
  top: calc(var(--d) * .075);
  left: 50%;
  width: calc(var(--d) * .25);
  height: calc(var(--d) * .13);
  margin-left: calc(var(--d) * -.125);
  border-radius: 2px 2px 35% 35% / 2px 2px 55% 55%;
  background:
    repeating-linear-gradient(90deg, rgba(60, 35, 5, .28) 0 1px, transparent 1px 3px),
    linear-gradient(90deg, #7d5819 0%, #f6dc93 32%, #d3a346 58%, #8a621d 100%);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .55);
}
.koerper {
  position: absolute;
  left: 0;
  bottom: 0;
  width: var(--d);
  height: var(--d);
  border-radius: 50%;
  display: grid;
  place-items: center;
}
.koerper::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  pointer-events: none;
}
.koerper::before {
  content: '';
  position: absolute;
  z-index: -1;
  inset: calc(var(--d) * -.5);
  border-radius: 50%;
  display: none;
  pointer-events: none;
}
.ziffer {
  position: relative;
  z-index: 1;
  font-family: var(--schrift-display);
  font-weight: 800;
  font-size: calc(var(--d) * .5);
  line-height: 1;
  font-variant-numeric: lining-nums;
  font-variation-settings: 'opsz' 72, 'SOFT' 100, 'WONK' 0;
  color: var(--creme);
  transform: translateY(1%);
  text-shadow: 0 calc(var(--d) * .022) 0 rgba(0, 0, 0, .38), 0 calc(var(--d) * .05) calc(var(--d) * .1) rgba(0, 0, 0, .45);
  pointer-events: none;
}
.plakette {
  display: none;
  position: absolute;
  z-index: 3;
  right: calc(var(--d) * -.07);
  bottom: calc(var(--d) * -.04);
  min-width: max(30px, calc(var(--d) * .4));
  height: max(30px, calc(var(--d) * .4));
  padding: 0 .28em;
  border-radius: 999px;
  place-items: center;
  background: radial-gradient(circle at 36% 30%, #fffaf0 0%, #f3e6c8 55%, #d9c497 100%);
  box-shadow: 0 0 0 calc(var(--d) * .02) #c99b45, 0 2px 5px rgba(0, 0, 0, .55);
  color: #a92621;
  font-weight: 800;
  font-size: max(16px, calc(var(--d) * .23));
  line-height: 1;
  font-variant-numeric: lining-nums;
  font-variation-settings: 'opsz' 24, 'SOFT' 100;
  pointer-events: none;
}
.glas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  display: none;
}
.glas.neu { animation: glas-auf .45s ease-out; }
@keyframes glas-auf { from { opacity: 0; } to { opacity: 1; } }
/* Ladezustand: Das Foto der geöffneten Kugel kommt übers Netz. Bis es da ist, schimmert die Kugel
   in der Leitfarbe des Tages (statt leer/dunkel zu bleiben). */
.lader {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  display: none;
  pointer-events: none;
  background:
    linear-gradient(115deg, rgba(255, 250, 230, 0) 30%, rgba(255, 250, 230, .34) 50%, rgba(255, 250, 230, 0) 70%) 120% 0 / 260% 100% no-repeat,
    radial-gradient(circle at 40% 35%, var(--ladefarbe, #6f8a78) 0%, rgba(15, 35, 27, .92) 78%);
  animation: lader 1.5s ease-in-out infinite;
}
.ist-offen.glas-laedt .lader { display: block; }
@keyframes lader { 0% { background-position: 120% 0, 0 0; } 70%, 100% { background-position: -30% 0, 0 0; } }
.etikett {
  position: absolute;
  top: calc(var(--l) + var(--d) * 1.21 + 4px);
  left: calc(var(--sw) * -.5);
  width: var(--sw);
  text-align: center;
  font-family: var(--schrift-fein);
  font-style: italic;
  font-weight: 600;
  font-size: clamp(17px, calc(var(--d) * .2), 23px);
  line-height: 1;
  color: #e3bd6c;
  pointer-events: none;
  white-space: nowrap;
}

/* Gesperrt: matt-grüner Samt */
.ist-zu .koerper {
  background: radial-gradient(circle at 42% 38%, #5b866a 0%, #47725a 34%, #2f5641 66%, #1a3727 100%);
  box-shadow:
    inset calc(var(--d) * -.07) calc(var(--d) * -.1) calc(var(--d) * .18) rgba(0, 0, 0, .4),
    0 calc(var(--d) * .07) calc(var(--d) * .16) rgba(0, 0, 0, .55);
}
.ist-zu .koerper::after {
  background:
    radial-gradient(ellipse 48% 36% at 35% 27%, rgba(255, 255, 255, .16), rgba(255, 255, 255, 0) 72%),
    var(--rauschen, none);
  background-size: auto, 56px 56px;
}

/* Heute: rot, Goldrand, leuchtet, pendelt */
.ist-heute .koerper {
  background: radial-gradient(circle at 37% 31%, #ff8d72 0%, #e5453b 20%, #bd2324 52%, #74101a 92%);
  box-shadow:
    0 0 0 1px rgba(70, 12, 10, .7),
    0 0 0 calc(var(--d) * .045) #dfb45c,
    0 0 0 calc(var(--d) * .055) rgba(90, 55, 10, .7),
    inset calc(var(--d) * -.06) calc(var(--d) * -.1) calc(var(--d) * .18) rgba(60, 0, 10, .45),
    0 calc(var(--d) * .07) calc(var(--d) * .16) rgba(0, 0, 0, .5);
}
.ist-heute .koerper::after {
  background:
    radial-gradient(ellipse 26% 17% at 34% 24%, rgba(255, 255, 255, .92), rgba(255, 255, 255, .32) 45%, rgba(255, 255, 255, 0) 75%),
    radial-gradient(ellipse 36% 14% at 58% 86%, rgba(255, 190, 150, .28), rgba(255, 190, 150, 0) 75%);
}
.ist-heute .koerper::before, .ist-tag.ist-offen .koerper::before {
  background: radial-gradient(circle, rgba(255, 110, 70, .55) 0%, rgba(255, 90, 50, .22) 30%, rgba(255, 170, 80, 0) 64%);
  display: block;
  animation: gluehen 2.8s ease-in-out infinite;
}
.ist-tag.ist-offen .koerper::before {
  background: radial-gradient(circle, rgba(255, 210, 120, .35) 0%, rgba(255, 190, 90, .12) 32%, rgba(255, 190, 90, 0) 62%);
}
.ist-heute .schwung { animation: pendeln 3.4s ease-in-out infinite; }
@keyframes pendeln { 0%, 100% { transform: rotate(-3.2deg); } 50% { transform: rotate(3.2deg); } }
@keyframes gluehen { 0%, 100% { opacity: .75; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.04); } }
.ist-heute .etikett, .ist-tag .etikett { color: #f6d692; font-weight: 700; font-size: clamp(18px, calc(var(--d) * .22), 25px); }
.ist-verpasst .etikett { font-weight: 700; }

/* Verpasst: Gold mit Schimmer */
.ist-verpasst .koerper {
  background: radial-gradient(circle at 37% 31%, #fff3c9 0%, #efcd78 17%, #c9963d 50%, #845b1b 82%, #5c3d10 100%);
  box-shadow:
    inset calc(var(--d) * -.06) calc(var(--d) * -.1) calc(var(--d) * .18) rgba(60, 30, 0, .4),
    0 0 calc(var(--d) * .3) rgba(240, 190, 90, .22),
    0 calc(var(--d) * .07) calc(var(--d) * .16) rgba(0, 0, 0, .5);
}
.ist-verpasst .ziffer {
  color: #1d3b29;
  text-shadow: 0 calc(var(--d) * .015) 0 rgba(255, 244, 205, .55), 0 calc(var(--d) * -.01) 0 rgba(60, 35, 5, .35);
}
.ist-verpasst .koerper::after {
  background:
    linear-gradient(112deg, rgba(255, 250, 225, 0) 38%, rgba(255, 250, 225, .7) 48%, rgba(255, 250, 225, 0) 58%),
    radial-gradient(ellipse 26% 17% at 34% 24%, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0) 75%);
  background-size: 300% 100%, auto;
  background-position: 120% 0, 0 0;
  background-repeat: no-repeat;
  animation: schimmer 4.2s ease-in-out infinite;
}
@keyframes schimmer { 0% { background-position: 120% 0, 0 0; } 55%, 100% { background-position: -30% 0, 0 0; } }

/* Geöffnet: Glaskugel mit Foto */
.ist-offen .koerper {
  background: radial-gradient(circle at 40% 35%, #2d5a49, #0f231b);
  box-shadow: 0 calc(var(--d) * .07) calc(var(--d) * .18) rgba(0, 0, 0, .6);
}
.ist-offen .glas { display: block; }
.ist-offen .ziffer { display: none; }
.ist-offen .plakette { display: grid; }
.ist-offen .koerper::after {
  background:
    radial-gradient(ellipse 25% 15% at 33% 22%, rgba(255, 255, 255, .85), rgba(255, 255, 255, .25) 45%, rgba(255, 255, 255, 0) 75%),
    radial-gradient(circle at 26% 30%, rgba(255, 255, 255, .9) 0, rgba(255, 255, 255, 0) 2.5%),
    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0) 60%, rgba(255, 255, 255, .13) 67%, rgba(255, 255, 255, 0) 72%),
    radial-gradient(ellipse 40% 16% at 56% 87%, rgba(255, 255, 255, .26), rgba(255, 255, 255, 0) 75%);
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, .32),
    inset calc(var(--d) * -.04) calc(var(--d) * -.06) calc(var(--d) * .12) rgba(0, 0, 0, .28);
}

/* Bewegung reduzieren */
@media (prefers-reduced-motion: reduce) {
  .ist-heute .schwung, .ist-verpasst .koerper::after, .ist-heute .koerper::before,
  .ist-tag.ist-offen .koerper::before, .fest .birne.funkel, .glas.neu { animation: none; }
  .lader { animation: none; }
  .ruft .kugel::after { animation: none; opacity: .9; }
}

/* ---------- Fuß ---------- */
.fuss {
  width: var(--cw);
  margin: 0 auto;
  /* Platz für die Pille und den Menü-Knopf unten links (mindestens --menue-knopf-zone) */
  padding: 6px 0 calc(max(86px, var(--menue-knopf-zone, 64px)) + env(safe-area-inset-bottom));
}
.hinweis {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin: 0;
  font-family: var(--schrift-fein);
  font-style: italic;
  font-weight: 600;
  font-size: clamp(18px, 4.8vw, 22px);
  line-height: 1.3;
  color: var(--gold);
  text-align: center;
}
.hinweis::before, .hinweis::after {
  content: '';
  flex: 0 1 64px;
  min-width: 18px;
  height: 1px;
  background: linear-gradient(90deg, rgba(217, 173, 85, 0), rgba(217, 173, 85, .75));
}
.hinweis::after { background: linear-gradient(90deg, rgba(217, 173, 85, .75), rgba(217, 173, 85, 0)); }

/* ---------- Zur heutigen Kugel ---------- */
/* Mittig unten, aber nie in der Ecke des Menü-Knopfs: Die Pille steht zwischen den beiden
   --menue-knopf-zone-Rändern (margin auto zentriert); ist sie breiter, beginnt sie rechts neben der Zone. */
.zu-heute {
  position: fixed;
  z-index: 20;
  left: calc(var(--menue-knopf-zone, 64px) + env(safe-area-inset-left));
  right: calc(var(--menue-knopf-zone, 64px) + env(safe-area-inset-right));
  bottom: calc(14px + env(safe-area-inset-bottom));
  width: -webkit-max-content;
  width: max-content;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 0 18px 0 12px;
  border: 1.5px solid rgba(223, 180, 92, .85);
  border-radius: 24px;
  background: rgba(10, 28, 19, .92);
  box-shadow: 0 10px 28px rgba(0, 0, 0, .55);
  font-weight: 600;
  font-size: 16px;
  font-variation-settings: 'opsz' 14;
  cursor: pointer;
  white-space: nowrap;
  animation: pille-auf .35s ease-out;
}
.zu-heute[hidden] { display: none; }
.mini {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: radial-gradient(circle at 37% 31%, #ff8d72 0%, #e5453b 22%, #bd2324 55%, #74101a 95%);
  box-shadow: 0 0 0 2px #dfb45c, 0 0 12px rgba(255, 90, 60, .6);
}
.zu-heute svg { width: 16px; height: 16px; transition: transform .2s; }
.mini.gold, .zu-heute.nachholen .mini {
  background: radial-gradient(circle at 37% 31%, #fff3c9 0%, #efcd78 20%, #c9963d 55%, #845b1b 95%);
  box-shadow: 0 0 0 1.5px rgba(255, 240, 200, .5), 0 0 10px rgba(240, 190, 90, .45);
}
.zu-heute.oben svg { transform: rotate(180deg); }
/* Desktop (ab 1000 px): alle Kugeln passen auf einen Bildschirm → keine schwebende Heute-Pille und unten nur wenig Rand
   (der Menü-Knopf sitzt links, der Hinweis mittig). Steht bewusst NACH den Grundregeln von .fuss und .zu-heute,
   sonst würden diese (gleiche Spezifität, später im Stylesheet) die Desktop-Werte überschreiben. */
@media (min-width: 1000px) {
  .zu-heute { display: none; }
  .fuss { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
}
/* Menü-Knopf (#kalender-reset aus shared/kalender.js, rund, 40 px): sitzt fest unten links (Lage setzt
   kalender.js). Die Seite hält die Ecke frei: Heute-Pille rechts neben der Zone, Fuß mit genug Abstand
   nach unten. In der Bildansicht ist er ausgeblendet. */
.ansicht-offen #kalender-reset { display: none; }
@keyframes pille-auf { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- Sprechblase ---------- */
.blase {
  position: absolute;
  z-index: 30;
  left: 0;
