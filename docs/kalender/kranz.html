<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Der Lichterkranz – Dein Adventskalender</title>
<link rel="stylesheet" href="../fonts/kranz.css">
<style>
:root {
  /* Farben: Raum, Wachs, Flamme, Kerzenrot, Tanne, Messing */
  --nacht: #120b07;
  --wachs: #f5ead6;
  --glut: #ffb65f;
  --kerzenrot: #b8262f;
  --tanne: #2f4c30;
  --messing: #c99f55;
  /* Schriften: Fraunces (weich wie Wachs, SOFT-Achse) + Alegreya Sans */
  --schrift-titel: 'Fraunces', Georgia, 'Times New Roman', serif;
  --schrift-text: 'Alegreya Sans', 'Gill Sans', 'Trebuchet MS', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--nacht); color: var(--wachs); }
html { overflow-x: hidden; }
body {
  font: 400 17px/1.4 var(--schrift-text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
#szene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

.app {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: 100vh; height: 100dvh; min-height: 520px;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overflow-x: clip;
}

/* ---------- Kopf ---------- */
.kopf { padding: 14px 20px 0; text-align: center; text-shadow: 0 1px 14px rgba(0,0,0,.7); }
h1 {
  margin: 0;
  font: 560 clamp(27px, 7.6vw, 48px)/1.02 var(--schrift-titel);
  font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" 96;
  letter-spacing: -.012em;
}
.h1-klein {
  display: block; margin-bottom: 3px;
  font-style: italic; font-weight: 400; font-size: .5em; letter-spacing: .01em;
  font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 40;
  color: var(--glut);
}
.status { margin: 6px 0 0; font-size: 15.5px; color: rgba(245,234,214,.78); }
.status.fest {
  font: italic 500 clamp(16px, 4.5vw, 20px)/1.2 var(--schrift-titel);
  font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 30;
  color: var(--glut);
}

/* ---------- Bühne mit dem Kranz ---------- */
.buehne {
  position: relative; min-height: 0;
  touch-action: pan-y;
  user-select: none; -webkit-user-select: none;
  cursor: grab;
}
.buehne.zieht { cursor: grabbing; }
.kerzen { position: absolute; inset: 0; }
.kerze {
  position: absolute; left: 0; top: 0;
  margin: 0; padding: 0; border: 0; border-radius: 16px;
  background: transparent;
  pointer-events: none;
  -webkit-tap-highlight-color: transparent;
}
.kerze:focus { outline: none; }
.kerze:focus-visible { outline: 2px solid var(--glut); outline-offset: 2px; box-shadow: 0 0 0 6px rgba(255,182,95,.18); }

.schild {
  position: absolute; left: 0; top: 0; z-index: 60;
  min-width: 44px; height: 28px; padding: 0 11px;
  display: grid; place-items: center;
  border-radius: 14px;
  font: 600 16px/1 var(--schrift-titel);
  font-variation-settings: "SOFT" 100, "opsz" 20;
  color: #2b1606;
  background: linear-gradient(#f4d896, #c99b4f);
  box-shadow: 0 0 0 1px rgba(255,236,190,.6) inset, 0 4px 14px rgba(0,0,0,.55);
  pointer-events: none; white-space: nowrap;
  transition: opacity .25s;
}
.schild.aus { opacity: 0; }
.schild { display: none; }
.hinweis {
  position: absolute; left: 0; top: 0; z-index: 55; pointer-events: none; white-space: nowrap;
  font: italic 400 14px/1 var(--schrift-text); color: rgba(245,234,214,.55);
  transition: opacity .6s;
}
.hinweis.weg { opacity: 0; }

.blase {
  --bx: 0px; --by: 0px; --tx: 50%;
  position: absolute; left: 0; top: 0; z-index: 70;
  max-width: min(320px, calc(100vw - 24px)); padding: 10px 15px 11px;
  border-radius: 16px;
  background: var(--wachs); color: #2a1708;
  font: italic 500 17.5px/1.22 var(--schrift-titel);
  font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 24;
  box-shadow: 0 12px 30px -8px rgba(0,0,0,.7), 0 0 0 1px rgba(201,159,85,.7), 0 0 30px rgba(255,170,80,.25);
  /* lange Hinweise („Noch ist November – Geduld!“) umbrechen statt über den Rand zu laufen */
  pointer-events: none; white-space: normal; text-wrap: balance; text-align: center;
  opacity: 0;
  transform: translate(var(--bx), var(--by)) scale(.85);
  transform-origin: var(--tx) 100%;
  transition: opacity .18s ease, transform .3s cubic-bezier(.3,1.5,.5,1);
}
.blase::after {
  content: ''; position: absolute; left: var(--tx); bottom: -6px;
  width: 13px; height: 13px; margin-left: -6.5px;
  background: inherit; border-radius: 2px; transform: rotate(45deg);
  box-shadow: 1px 1px 0 rgba(201,159,85,.7);
}
.blase.zeigen { opacity: 1; transform: translate(var(--bx), var(--by)) scale(1); }

/* ---------- Seite: Panel + Bildansicht ---------- */
.seite { position: relative; padding: 0 max(16px, env(safe-area-inset-left)) 12px; }
.seite::before {
  content: ''; position: absolute; left: 0; right: 0; top: -26px; bottom: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(to bottom, rgba(12,7,4,0), rgba(12,7,4,.72) 34%, rgba(12,7,4,.88));
}
.panel { max-width: 540px; margin: 0 auto; padding: 4px 0 2px; transition: opacity .3s; }
.panel-kopf { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 8px; }
.pfeil {
  width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center; padding: 0; cursor: pointer;
  border: 1px solid rgba(201,159,85,.55);
  background: rgba(18,11,7,.55); color: var(--wachs);
  transition: background .2s, transform .15s;
}
.pfeil:active { transform: scale(.94); }
.pfeil svg { width: 20px; height: 20px; }
.panel-mitte { text-align: center; min-width: 0; }
.panel-eyebrow { margin: 0; font-size: 14.5px; color: var(--glut); letter-spacing: .015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel-titel {
  margin: 1px 0 0;
  font: 500 clamp(17px, 4.8vw, 21px)/1.18 var(--schrift-titel);
  font-variation-settings: "SOFT" 100, "opsz" 30;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.panel-inhalt { display: flex; align-items: center; justify-content: center; gap: 12px; height: 60px; margin: 6px 0 8px; }
/* Vorschau im Panel: runder Rahmen; solange das Bild lädt, glimmt er in der Farbe des Fotos */
.panel-bild {
  --laden-farbe: rgba(150,96,52,.6);
  position: relative; flex: none; width: 54px; height: 54px; border-radius: 50%; overflow: hidden;
  background: radial-gradient(circle at 50% 64%, var(--laden-farbe), rgba(26,16,10,.95) 74%);
  box-shadow: 0 0 0 2px rgba(201,159,85,.8), 0 0 22px rgba(255,160,70,.5);
}
.panel-bild[hidden] { display: none; }
.panel-bild img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; transition: opacity .35s ease; }
.panel-bild.laedt img { opacity: 0; }
.panel-bild::after {
  content: ''; position: absolute; left: 50%; top: 50%; width: 10px; height: 15px; margin: -9px 0 0 -5px;
  border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%;
  background: radial-gradient(circle at 50% 70%, #fff6dc, #ffc36e 45%, rgba(255,128,40,0) 75%);
  opacity: 0; transition: opacity .3s; pointer-events: none;
}
.panel-bild.laedt::after { opacity: .9; animation: glimmen 1.1s ease-in-out infinite alternate; }
@keyframes glimmen { from { transform: scale(.82); filter: brightness(.85); } to { transform: scale(1.08); filter: brightness(1.15); } }
.panel-text {
  margin: 0; max-width: 36ch; text-align: center;
  font-size: 16.5px; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  text-wrap: balance;
}
.panel-text.titel {
  font: italic 450 18px/1.25 var(--schrift-titel);
  font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 24;
  text-align: left;
}
.panel-knoepfe { display: flex; gap: 10px; justify-content: center; min-height: 52px; }
.aktion {
  flex: 1 1 auto; max-width: 330px; min-height: 52px; padding: 0 22px;
  border: 0; border-radius: 26px; cursor: pointer;
  font: 600 18.5px/1 var(--schrift-titel);
  font-variation-settings: "SOFT" 100, "opsz" 24;
  color: #2b1606;
  background: linear-gradient(180deg, #f8dc98, #dca852 58%, #b9802f);
  box-shadow: 0 0 0 1px rgba(255,236,190,.55) inset, 0 -2px 0 rgba(120,70,20,.35) inset, 0 10px 26px -8px rgba(255,150,50,.6);
  transition: transform .15s, filter .2s;
}
.aktion:active { transform: scale(.97); }
.aktion.still {
  background: rgba(18,11,7,.5); color: var(--wachs);
  box-shadow: 0 0 0 1px rgba(201,159,85,.65) inset;
  font-weight: 500;
}
.aktion[hidden], .neben[hidden] { display: none; }
.neben {
  flex: none; min-height: 52px; padding: 0 18px; border-radius: 26px; cursor: pointer;
  background: rgba(18,11,7,.5); border: 1px solid rgba(201,159,85,.55);
  font: 500 16.5px/1 var(--schrift-text);
}
.platzhalter { visibility: hidden; }
.wichern {
  margin: 10px auto 0; max-width: 44ch; text-align: center;
  font-size: 13.5px; line-height: 1.35; font-style: italic;
  color: rgba(245,234,214,.58);
}
button:focus { outline: none; }
button:focus-visible { outline: 2px solid var(--glut); outline-offset: 3px; }

/* ---------- Bildansicht ---------- */
.ansicht {
  position: fixed; inset: 0; z-index: 100;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 12px);
  background:
    radial-gradient(110% 60% at 50% 104%, rgba(170,80,20,.38), rgba(0,0,0,0) 62%),
    rgba(12,7,4,.94);
  opacity: 0; transition: opacity .4s ease;
}
.ansicht.offen { opacity: 1; }
.ansicht:focus { outline: none; }
.ansicht[hidden] { display: none; }
.a-kopf { display: flex; align-items: flex-start; gap: 12px; padding: 0 2px; }
.a-texte { flex: 1 1 auto; min-width: 0; padding-top: 2px; }
.a-datum { margin: 0; font-size: 14.5px; color: var(--glut); }
.a-titel {
  margin: 2px 0 0;
  font: italic 480 23px/1.15 var(--schrift-titel);
  font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 36;
}
.a-zu {
  flex: none; width: 48px; height: 48px; border-radius: 50%; padding: 0; cursor: pointer;
  display: grid; place-items: center;
  border: 1px solid rgba(201,159,85,.6); background: rgba(18,11,7,.6); color: var(--wachs);
}
.a-zu svg { width: 18px; height: 18px; }
.a-buehne { position: relative; min-height: 0; touch-action: pan-y pinch-zoom; user-select: none; -webkit-user-select: none; }
.a-glut {
  position: absolute; left: 0; top: 0; width: 10px; height: 10px; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255,166,74,.62), rgba(255,124,42,.22) 55%, rgba(255,100,30,0));
  opacity: .8;
}
.app.modal-offen .kopf, .app.modal-offen .buehne, .app.modal-offen .panel { opacity: 0; transition: opacity .3s; }
.a-rahmen {
  position: absolute; left: 0; top: 0; margin: 0;
  padding: 5px; border-radius: 4px;
  background: linear-gradient(#efe1c3, #e2cfa9);
  box-shadow: 0 30px 60px -22px rgba(0,0,0,.9), 0 0 0 1px rgba(255,230,180,.25);
  will-change: transform;
}
.a-rahmen img { display: block; width: 100%; height: 100%; object-fit: contain; background: #1a120c; border-radius: 2px; -webkit-user-drag: none; user-select: none; transition: opacity .4s ease; }
/* Ladezustand: die echten Fotos kommen übers Netz – bis dahin glimmt der Rahmen (mit verschwommener
   Vorschau, falls die schon da ist) und eine kleine Flamme sagt „Foto wird geholt …“ */
.a-rahmen.laedt img { opacity: 0; }
.a-laden {
  --laden-farbe: rgba(150,96,52,.6);
  position: absolute; left: 5px; top: 5px; right: 5px; bottom: 5px; border-radius: 2px; overflow: hidden;
  display: grid; place-items: center; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 72%, var(--laden-farbe), #1a120c 78%);
  opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility 0s linear .45s;
}
.a-rahmen.laedt .a-laden { opacity: 1; visibility: visible; transition: opacity .2s ease, visibility 0s; }
.a-laden-bild { position: absolute; left: -28px; top: -28px; right: -28px; bottom: -28px; background: center / cover no-repeat; filter: blur(18px) saturate(1.1) brightness(.8); opacity: .8; }
.a-laden-text {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px;
  font: italic 450 17px/1.2 var(--schrift-titel); font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 24;
  color: rgba(245,234,214,.9); text-shadow: 0 1px 10px rgba(0,0,0,.7);
  opacity: 0;
}
.a-rahmen.laedt .a-laden-text { animation: auftauchen .4s ease .3s forwards; }
.a-laden-text::before {
  content: ''; width: 16px; height: 26px;
  border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%;
  background: radial-gradient(circle at 50% 72%, #fffbe8, #ffd082 38%, rgba(255,128,40,.55) 62%, rgba(255,110,30,0) 78%);
  box-shadow: 0 0 26px 8px rgba(255,160,70,.35);
  animation: glimmen 1.1s ease-in-out infinite alternate;
}
@keyframes auftauchen { to { opacity: 1; } }
.a-licht {
  position: absolute; inset: 0; border-radius: 4px; pointer-events: none;
  background:
    radial-gradient(130% 85% at 50% 118%, rgba(255,176,90,.8), rgba(255,140,60,.2) 52%, rgba(30,14,6,.45) 100%);
  box-shadow: inset 0 -26px 46px -18px rgba(255,170,80,.9), inset 0 0 0 1px rgba(255,214,150,.5), inset 0 0 38px rgba(255,150,60,.35);
  mix-blend-mode: soft-light;
  opacity: .7;
}
.a-fuss { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.a-nav {
  min-height: 48px; padding: 0 16px; border-radius: 24px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid rgba(201,159,85,.55); background: rgba(18,11,7,.55);
  font: 500 16px/1 var(--schrift-text); color: var(--wachs);
}
.a-nav svg { width: 16px; height: 16px; flex: none; }
#a-zurueck { justify-self: start; }
#a-weiter { justify-self: end; }
.a-nav.weg { visibility: hidden; }
.a-kerze { display: flex; flex-direction: column; align-items: center; gap: 0; }
.a-kerze canvas { width: 40px; height: 54px; display: block; }
.a-kerze span { font: 500 14px/1 var(--schrift-text); color: rgba(245,234,214,.75); margin-top: 2px; }

/* Runder Menü-Knopf aus shared/kalender.js (#kalender-reset, 40 px) sitzt in allen Ansichten fest unten links.
   Hochkant endet das Panel über seiner Ecke (--menue-knopf-zone, 64 px); quer und am Desktop steht das Panel
   rechts, links unten ist nur Raum unter dem Kranz. In der Bildansicht ausgeblendet. */
.seite { padding-bottom: var(--menue-knopf-zone, 64px); }
.foto-offen #kalender-reset { display: none; }
.sr { position: absolute; top: 0; left: 0; margin: 0; padding: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

/* ---------- Kleine Bildschirme ---------- */
@media (max-height: 700px) {
  .kopf { padding-top: 10px; }
  h1 { font-size: clamp(25px, 7vw, 40px); }
  .status { margin-top: 4px; font-size: 14.5px; }
  .panel-inhalt { margin: 4px 0 6px; }
  .wichern { margin-top: 8px; font-size: 12.5px; }
}
@media (max-height: 600px) { .wichern { display: none; } }

/* Querformat auf dem Handy: Kranz links, Panel rechts */
@media (orientation: landscape) and (max-height: 599px) and (min-width: 560px) {
  .app { grid-template-columns: minmax(0, 1fr) minmax(300px, 42%); grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
  .kopf { grid-column: 2; grid-row: 1; padding-top: 12px; }
  h1 { font-size: 26px; }
  .buehne { grid-column: 1; grid-row: 1 / 3; }
  .seite { grid-column: 2; grid-row: 2; display: flex; align-items: center; padding-bottom: 12px; }
  .seite::before { display: none; }
  .panel { width: 100%; }
  .panel-titel { font-size: 18px; }
  .hinweis { display: none; }
}

/* ---------- Desktop: Kranz groß, Bildbereich daneben ---------- */
@media (min-width: 1000px) and (min-height: 600px) and (orientation: landscape) {
  .app { grid-template-columns: minmax(0, 1fr) clamp(400px, 41vw, 620px); grid-template-rows: auto minmax(0, 1fr); }
  .kopf { grid-column: 1; grid-row: 1; text-align: left; padding: 30px 44px 0; }
  h1 { font-size: clamp(36px, 3.4vw, 52px); }
  .status { font-size: 17px; }
  .buehne { grid-column: 1; grid-row: 2; }
  .seite { grid-column: 2; grid-row: 1 / 3; display: flex; align-items: center; justify-content: center; padding: 36px 44px 36px 8px; }
  .seite.seite { padding-bottom: 36px; }
  .seite::before { display: none; }
  .panel { width: 100%; max-width: 460px; }
  .panel-titel { font-size: 27px; }
  .panel-eyebrow { font-size: 16px; }
  .panel-inhalt { height: 84px; justify-content: flex-start; }
  .panel-bild { width: 76px; height: 76px; }
  .panel-text { text-align: left; font-size: 18px; }
  .panel-text.titel { font-size: 21px; }
  .wichern { text-align: left; margin-left: 0; font-size: 14.5px; margin-top: 22px; }
  .seite.foto .panel { opacity: 0; visibility: hidden; }
  .ansicht { position: absolute; inset: 0; z-index: 5; background: none; padding: 30px 44px 30px 8px; gap: 14px; }
  .a-titel { font-size: 27px; }
}
@media (prefers-reduced-motion: reduce) {
  .blase, .ansicht, .panel, .schild { transition: none; }
  .panel-bild.laedt::after, .a-laden-text::before { animation: none; }
  .a-rahmen.laedt .a-laden-text { animation: none; opacity: 1; }
}
</style>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head>
<body>
<canvas id="szene" aria-hidden="true"></canvas>

<div class="app" id="app">
  <header class="kopf" id="kopf">
    <h1><span class="h1-klein">Dein</span> Adventskalender</h1>
    <p class="status" id="status"></p>
  </header>

  <main class="buehne" id="buehne" aria-label="Adventskranz mit 24 Kerzen. Zum Drehen seitlich wischen.">
    <div class="kerzen" id="kerzen" role="group" aria-label="Kerzen vom 1. bis 24. Dezember"></div>
    <div class="schild aus" id="schild" aria-hidden="true"></div>
    <div class="hinweis" id="hinweis" aria-hidden="true">Zum Drehen seitlich wischen</div>
    <div class="blase" id="blase" role="status" aria-live="polite"></div>
  </main>

  <aside class="seite" id="seite">
    <section class="panel" id="panel" aria-label="Ausgewählte Kerze">
      <div class="panel-kopf">
        <button class="pfeil" id="p-zurueck" type="button" aria-label="Vorherige Kerze">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="panel-mitte">
          <p class="panel-eyebrow" id="p-eyebrow"></p>
          <h2 class="panel-titel" id="p-titel"></h2>
        </div>
        <button class="pfeil" id="p-weiter" type="button" aria-label="Nächste Kerze">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="panel-inhalt">
        <span class="panel-bild" id="p-bildrahmen" hidden><img id="p-bild" alt="" width="54" height="54" decoding="async" draggable="false"></span>
        <p class="panel-text" id="p-text"></p>
      </div>
      <div class="panel-knoepfe">
        <button class="aktion" id="p-aktion" type="button">Kerze anzünden</button>
        <button class="neben" id="p-neben" type="button" hidden>Zu heute</button>
      </div>
      <p class="wichern" id="wichern">Wie bei Wicherns erstem Adventskranz (Hamburg, 1839): kleine rote Kerzen für die Werktage, große weiße für die Sonntage.</p>
    </section>

    <div class="ansicht" id="ansicht" role="dialog" aria-modal="true" aria-labelledby="a-titel" tabindex="-1" hidden>
      <div class="a-kopf">
        <div class="a-texte">
          <p class="a-datum" id="a-datum"></p>
          <h2 class="a-titel" id="a-titel"></h2>
        </div>
