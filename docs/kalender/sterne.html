<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050817">
<title>Der Sternenhimmel – Dein Adventskalender</title>
<link rel="stylesheet" href="../fonts/sterne.css">
<style>
:root{
  /* Farben des Winterhimmels */
  --nacht:#050817;   /* Zenit, Bildansicht */
  --himmel:#142650;  /* Himmelsmitte */
  --polar:#5ef0c0;   /* Polarlicht – nur als Licht, nie als Knopffarbe */
  --gold:#ffd27a;    /* Sternenlinien, heute, Knöpfe */
  --stern:#eef2ff;   /* Sternweiß, Schrift */
  --schnee:#a8b8d8;  /* mondbeschienener Schnee */
  /* Schriften: gestochene Atlas-Antiqua + Planetariums-Grotesk */
  --schrift-titel:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --schrift-text:'Jost','Futura','Century Gothic','Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--nacht);-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* Menü-Knopf aus kalender.js (#kalender-reset, runder 40-px-Knopf: Ansicht wechseln, Testmodus): sitzt in allen
   Ansichten fest unten links (Lage setzt kalender.js, hier nichts verschieben). Diese Seite hält seine Ecke frei
   (--menue-knopf-zone, 64 px ab dem Rand, zzgl. Safe-Area): anordnen() lässt links neben dem Sternenfeld einen
   Streifen so breit wie die Zone – beim Scrollen läuft kein Stern, kein Schild und keine Foto-Vorschau unter dem
   Knopf durch. Der „Heute finden“-Chip steht mittig, am Seitenende liegt dort nur die Landschaft.
   Im Himmelsfenster (Verbinden, Bildansicht) ist der Knopf ausgeblendet. */
.rand-mass{position:absolute;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:0 env(safe-area-inset-right,0px) 0 calc(var(--menue-knopf-zone,64px) + env(safe-area-inset-left,0px))}
html.offen{overflow:hidden}
html.offen #kalender-reset{display:none}
body{margin:0;min-height:100vh;color:var(--stern);font-family:var(--schrift-text);font-size:1.0625rem;line-height:1.45;overflow-x:clip}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.unsichtbar{position:absolute!important;top:0;left:0;width:1px;height:1px;margin:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* ---------- Himmel ---------- */
.seite{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;
  background:
    radial-gradient(90% 38% at 50% 100%,rgba(48,118,130,.42),transparent 70%),
    linear-gradient(180deg,#03050f 0%,#081032 24%,var(--himmel) 58%,#1d3a63 84%,#2a5672 100%)}
.himmel-bg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.polarlicht{position:absolute;left:-12%;right:-12%;bottom:calc(var(--land-h) * .45 + var(--land-frei));height:min(64%,720px);pointer-events:none;
  opacity:calc(.18 + var(--polar-staerke,0) * .62);
  background:
    radial-gradient(34% 58% at 18% 86%,rgba(94,240,192,.34),transparent 72%),
    radial-gradient(30% 48% at 47% 78%,rgba(94,240,192,.24),transparent 72%),
    radial-gradient(26% 52% at 74% 70%,rgba(120,230,200,.2),transparent 72%),
    radial-gradient(30% 40% at 88% 52%,rgba(160,128,255,.16),transparent 72%);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 45%);mask-image:linear-gradient(180deg,transparent,#000 45%)}
body.november .polarlicht{opacity:0}
body.fest .seite::before{content:""}
.seite::before{position:absolute;inset:0 0 auto;height:min(70vh,560px);pointer-events:none;background:radial-gradient(60% 70% at 50% 0%,rgba(255,210,122,.16),rgba(94,240,192,.07) 45%,transparent 75%)}
body.fest .polarlicht{opacity:1;animation:polarZiehen 14s ease-in-out infinite alternate}
@keyframes polarZiehen{from{transform:translateX(-2%) scaleY(.96)}to{transform:translateX(2%) scaleY(1.05)}}
.mond{position:absolute;top:max(22px,env(safe-area-inset-top));right:max(18px,6%);width:38px;height:38px;border-radius:50%;pointer-events:none;
  box-shadow:inset -11px 4px 0 1px #f2ead2;filter:drop-shadow(0 0 14px rgba(242,234,210,.45));rotate:-18deg}
body.november .mond{opacity:.7}

/* ---------- Kopf ---------- */
.kopf{position:relative;z-index:3;text-align:center;padding:max(22px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 4px max(18px,env(safe-area-inset-left))}
.kopf h1{margin:0;font-family:var(--schrift-titel);font-weight:400;line-height:1;font-optical-sizing:auto;text-shadow:0 2px 24px rgba(3,5,15,.7)}
.kopf h1 .gross{display:block;font-style:italic;font-weight:600;font-size:clamp(2.6rem,13vw,4.4rem);letter-spacing:-.01em}
.kopf h1 .klein{display:block;margin-top:.12em;font-size:clamp(1.1rem,5vw,1.55rem);letter-spacing:.01em}
.heute-zeile{margin:.7rem 0 0;color:var(--gold);font-weight:500;font-size:1.05rem}
.hilfe{margin:.15rem auto 0;max-width:30rem;color:rgba(238,242,255,.8);font-size:.98rem;text-wrap:pretty}
.stand{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;margin:.55rem 0 0;font-size:.94rem;color:rgba(238,242,255,.72)}
.stand[hidden]{display:none}
.mini-knopf{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 11px;border:0;border-radius:999px;cursor:pointer;font-weight:600;font-size:.98rem;color:var(--stern);
  background:rgba(8,14,38,.5);box-shadow:inset 0 0 0 1.5px rgba(238,242,255,.55);-webkit-tap-highlight-color:transparent}
.mini-knopf svg{width:15px;height:15px;color:var(--gold)}
.mini-knopf:active{background:rgba(238,242,255,.12)}

/* ---------- Sternbilder ---------- */
.feld{position:relative;z-index:4;margin:6px auto auto;flex:none}
.sb{position:absolute;left:0;top:0;margin:0;padding:0;border:0;background:none;cursor:pointer;border-radius:24%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.sb:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sb.z-verpasst{z-index:2}
.sb.z-heute{z-index:3}
.sb-figur{position:absolute;inset:0;display:block;rotate:var(--rot,0deg);transition:scale .3s ease;pointer-events:none}
.sb-figur svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sb .hinweis{fill:none;stroke:rgba(205,218,255,.26);stroke-linecap:round;stroke-linejoin:round}
.sb .linien{display:none}
.sb .linien path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.sb .unter{stroke:rgba(3,6,20,.55)}
.sb .schein{stroke:rgba(255,206,110,.3)}
.sb .kern{stroke:#ffe3a3}
.sb circle{fill:#dfe6ff;opacity:.62;stroke:transparent}
.sb .glanz{fill:#fff4d6;opacity:0}
.sb-halo{position:absolute;inset:-22%;border-radius:50%;pointer-events:none;display:none;background:radial-gradient(closest-side,rgba(255,210,122,.32),rgba(255,210,122,.1) 58%,transparent)}
.sb-vorschau{position:absolute;left:13%;top:13%;width:74%;height:74%;border-radius:50%;overflow:hidden;opacity:0;transition:opacity .7s ease;pointer-events:none;
  -webkit-mask-image:radial-gradient(closest-side,#000 42%,transparent 100%);mask-image:radial-gradient(closest-side,#000 42%,transparent 100%)}
.sb-vorschau img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.85) brightness(.92)}
.sb-vorschau::after{content:"";position:absolute;inset:0;background:radial-gradient(closest-side,rgba(10,20,60,.1),rgba(10,20,60,.45))}
.sb-etikett,.sb-nr{position:absolute;pointer-events:none;white-space:nowrap;line-height:1}
/* Das Schild gehört zum eigenen Knopf: anklickbar, liegt über den Nachbarn */
.sb-etikett{left:50%;bottom:2px;translate:-50% 0;padding:5px 11px 6px;border-radius:999px;font-weight:600;font-size:13px;display:none;pointer-events:auto}
.sb-nr{right:2%;bottom:6%;font-family:var(--schrift-titel);font-style:italic;font-weight:600;font-size:15px;color:rgba(238,242,255,.6)}
.z-heute .sb-nr,.mit-schild .sb-nr{bottom:auto;top:4%;right:0}
/* geöffnet */
.z-offen .hinweis{display:none}
.z-offen .linien{display:inline}
.z-offen circle{fill:#fff3d6;opacity:1}
.z-offen .glanz{opacity:.7}
.z-offen .sb-vorschau.da{opacity:.8}
.z-offen .sb-nr{color:var(--gold)}
/* heute */
.z-heute .sb-figur{scale:1.12;filter:drop-shadow(0 0 5px rgba(255,206,110,.75))}
.z-heute .sb-halo{display:block;inset:-30%;background:radial-gradient(closest-side,rgba(255,214,130,.44),rgba(255,200,110,.16) 55%,transparent);animation:atmen 3.2s ease-in-out infinite}
.z-heute .sb-halo::after{content:"";position:absolute;inset:22%;border-radius:50%;border:1.5px solid rgba(255,222,150,.7);animation:leuchtfeuer 2.8s ease-out infinite}
@keyframes leuchtfeuer{0%{transform:scale(.55);opacity:0}25%{opacity:.9}100%{transform:scale(1.3);opacity:0}}
.z-heute circle{fill:#fff0c4;opacity:1;stroke:rgba(255,210,122,.5);animation:funkeln 2.6s ease-in-out infinite;animation-delay:var(--v,0s)}
.z-heute .glanz{fill:#fff1c8;opacity:.95;animation:funkeln 2.6s ease-in-out infinite reverse}
.z-heute .hinweis{stroke:rgba(255,220,140,.95)}
.z-heute .linien{display:inline;opacity:.3}
.z-heute .linien .unter{display:none}
.z-heute .sb-etikett{display:block;color:#1b1630;background:linear-gradient(180deg,#ffe6ae,var(--gold));box-shadow:0 2px 10px rgba(255,190,80,.45)}
.z-heute .sb-nr{color:var(--gold)}
/* verpasst */
.z-verpasst circle{fill:#f4f6ff;opacity:.9;animation:blinken 2s ease-in-out infinite;animation-delay:var(--v,0s)}
.z-verpasst .hinweis{stroke:rgba(238,242,255,.45)}
.z-verpasst.mit-schild .sb-etikett{display:block;color:var(--stern);background:rgba(8,14,38,.72);box-shadow:inset 0 0 0 1px rgba(238,242,255,.6)}
/* gesperrt */
.z-zu circle{opacity:.5}
.z-zu .hinweis{stroke:rgba(205,218,255,.2)}
body.november .z-zu circle{opacity:.42}
@keyframes funkeln{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes blinken{0%,100%{opacity:.28}45%{opacity:1}}
@keyframes atmen{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.06);opacity:1}}
@keyframes wackeln{0%{transform:none}15%{transform:translateX(-6px) rotate(-5deg)}35%{transform:translateX(5px) rotate(4deg)}55%{transform:translateX(-3px) rotate(-2deg)}78%{transform:translateX(2px)}100%{transform:none}}
.wackelt{animation:wackeln .6s ease-out}
@keyframes ankommen{0%{transform:scale(.5);opacity:0}30%{opacity:1}100%{transform:scale(1.7);opacity:0}}
.frisch .sb-halo{display:block;animation:ankommen 1.4s ease-out 1 both}
body.fest .sb[data-tag="24"] .sb-halo{display:block}
@keyframes gefunden{0%,100%{transform:scale(1)}30%{transform:scale(1.35)}60%{transform:scale(.95)}}
.gefunden .sb-halo{animation:gefunden .9s ease-out 2}
.schnuppe{position:absolute;z-index:6;width:90px;height:2px;margin-top:-1px;transform-origin:0 50%;pointer-events:none;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,247,226,.95));filter:drop-shadow(0 0 4px rgba(255,236,190,.9))}
.schnuppe::after{content:"";position:absolute;right:-2px;top:-2px;width:6px;height:6px;border-radius:50%;background:#fffaf0;box-shadow:0 0 10px 3px rgba(255,236,190,.8)}

/* ---------- Landschaft ---------- */
/* Unter dem Häuschen liegt noch ein Streifen Schnee (--land-frei), damit der feste „Heute finden“-Knopf
   (46px hoch, unten max(14px, Safe-Area + 8px)) ganz unten auf dem Schnee liegt und nie Haus oder Boden verdeckt.
   Die Landschaft (viewBox 1200×240, unten bündig) zeigt unter y=200 noch max(100vw/30, --land-h/6) Schnee –
   nur was dann noch fehlt, kommt dazu. */
.land{position:relative;z-index:2;flex:none;height:calc(var(--land-h) + var(--land-frei));margin-top:calc(var(--land-h) * -.38);pointer-events:none;
  background:linear-gradient(180deg,#3f4f78,#33406a) left bottom / 100% calc(var(--land-frei) + 2px) no-repeat}
.land svg{position:absolute;left:0;top:0;width:100%;height:var(--land-h);display:block}
/* Höhe des Landschaftsbilds: auf breiten Bildschirmen wächst es mit (12.5vw = 150 von 240 Einheiten sichtbar),
   sonst schneidet „slice“ oben Dach und Schornstein (Dachfirst y=109) ab */
.seite{--land-h:max(clamp(104px,26vw,180px),12.5vw);
  --land-frei:max(0px,calc(46px + max(14px,calc(env(safe-area-inset-bottom) + 8px)) + 10px - max(3.334vw,calc(var(--land-h) / 6))))}
.lichterkette{display:none}
body.fest .lichterkette{display:inline}
body.november .fenster-licht{opacity:.55}

/* ---------- Sprechblase & Heute-finden ---------- */
.blase{position:absolute;z-index:8;width:max-content;max-width:min(270px,calc(100% - 16px));padding:.55rem .9rem .65rem;border-radius:14px;background:#eef2ff;color:#0e1734;font-size:.95rem;line-height:1.3;
  box-shadow:0 14px 30px -12px rgba(0,0,0,.75);pointer-events:none;animation:blaseRein .32s cubic-bezier(.2,.9,.3,1.25)}
.blase[hidden]{display:none}
.blase strong{display:block;font-family:var(--schrift-titel);font-style:italic;font-weight:600;font-size:1.3rem;line-height:1.15;margin-bottom:.12rem}
.blase::after{content:"";position:absolute;top:100%;left:var(--pfeil,50%);margin-left:-8px;border:8px solid transparent;border-top-color:#eef2ff}
.blase.unten::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#eef2ff}
@keyframes blaseRein{from{opacity:0;transform:translateY(6px) scale(.94)}to{opacity:1;transform:none}}
.chip{position:fixed;z-index:30;left:50%;bottom:max(14px,calc(env(safe-area-inset-bottom) + 8px));translate:-50% 0;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px 0 13px;border:0;border-radius:999px;cursor:pointer;
  font-weight:600;font-size:1rem;color:var(--gold);background:rgba(6,10,30,.84);box-shadow:inset 0 0 0 1.5px rgba(255,210,122,.75),0 10px 26px -10px rgba(0,0,0,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:blaseRein .3s ease-out}
.chip[hidden]{display:none}
.chip svg{width:18px;height:18px;flex:none}
.chip .pfeil{transition:rotate .2s}
.chip.nach-oben .pfeil{rotate:180deg}

/* ---------- Knöpfe ---------- */
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.6rem 1.3rem;border:0;border-radius:999px;font-weight:600;font-size:1.02rem;line-height:1.1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.knopf svg{width:1.2em;height:1.2em;flex:none}
.knopf[hidden]{display:none}
.knopf-gold{color:#1b1630;background:linear-gradient(180deg,#ffe6ae,var(--gold) 55%,#eab655);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 24px -10px rgba(255,190,80,.7)}
.knopf-gold:active{transform:translateY(1px)}
.knopf-linie{color:var(--stern);background:rgba(8,14,38,.6);box-shadow:inset 0 0 0 1.5px rgba(255,210,122,.75)}
.knopf-linie:active{background:rgba(255,210,122,.14)}
.knopf:disabled{opacity:.5;cursor:default}
.knopf-rund{display:grid;place-items:center;width:52px;height:52px;padding:0;border:0;border-radius:50%;cursor:pointer;color:var(--stern);background:rgba(8,14,38,.6);box-shadow:inset 0 0 0 1.5px rgba(255,210,122,.7);-webkit-tap-highlight-color:transparent}
.knopf-rund svg{width:24px;height:24px}
.knopf-rund:disabled{opacity:.28;cursor:default}
.knopf-rund:not(:disabled):active{background:rgba(255,210,122,.16)}

/* ---------- Himmelsfenster: Verbinden + Bildansicht ---------- */
.fenster{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;overflow:hidden;background:transparent;color:var(--stern);overscroll-behavior:contain}
.fenster::backdrop{background:transparent}
.fenster canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.f-innen{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;pointer-events:none;
  padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.f-innen>*{pointer-events:auto}
.f-kopf{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;width:100%;max-width:1100px;margin:0 auto;transition:opacity .35s ease}
.f-kopf-text{margin:0 0 0 4px;font-size:.95rem;line-height:1.25;color:rgba(238,242,255,.82)}
.f-kopf-text b{display:block;font-family:var(--schrift-titel);font-style:italic;font-weight:600;font-size:1.35rem;color:var(--stern)}
.f-kopf-knoepfe{display:flex;align-items:center;gap:8px;flex:none}
.knopf-rund.klein{width:44px;height:44px;box-shadow:inset 0 0 0 1.5px rgba(238,242,255,.4)}
.knopf-rund.klein svg{width:21px;height:21px}
.knopf-rund.klein[aria-pressed="true"]{color:var(--gold);box-shadow:inset 0 0 0 1.5px rgba(255,210,122,.7)}
.m-bild #fTon{display:none}
.knopf-schalter{color:var(--stern);background:rgba(8,14,38,.6);box-shadow:inset 0 0 0 1.5px rgba(238,242,255,.45);padding-inline:1rem 1.1rem}
.knopf-schalter svg{color:rgba(238,242,255,.7)}
.knopf-schalter[aria-pressed="true"]{color:#1b1630;background:linear-gradient(180deg,#ffe6ae,var(--gold));box-shadow:0 8px 20px -10px rgba(255,190,80,.7)}
.knopf-schalter[aria-pressed="true"] svg{color:#1b1630}
.kurz{display:none}
@media (max-width:440px){.lang{display:none}.kurz{display:inline}}
@media (max-width:400px){.f-kopf{gap:8px}.f-kopf-text{margin-left:0;font-size:.86rem}.f-kopf-text b{font-size:1.16rem}}
.f-buehne{position:relative;min-height:0;outline:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.m-verbinden .f-buehne{touch-action:none;cursor:crosshair}
.m-bild .f-buehne{touch-action:pan-y pinch-zoom;cursor:grab}
.f-buehne:focus-visible{outline:2px dashed rgba(255,210,122,.7);outline-offset:-4px;border-radius:16px}
.f-spur{position:absolute;inset:0;display:none}
.m-bild .f-spur{display:block}
/* Solange das große Foto lädt: die kleine Vorschau vom Himmel, weich und gedämpft, in der Form des Fotos */
.f-vorbild{position:absolute;left:0;top:0;width:0;height:0;border-radius:3px;background:center/cover no-repeat;filter:blur(10px) saturate(.85) brightness(.8);opacity:0;transition:opacity .35s ease;pointer-events:none}
.f-vorbild.da{opacity:.6}
.f-spur img{position:relative;display:block;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(.965);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.7,.2,1);
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.6)) drop-shadow(0 0 34px rgba(94,240,192,.16));-webkit-user-drag:none;user-select:none;pointer-events:none}
.f-spur img.da{opacity:1;transform:none}
.f-spur img.sofort{transition:none}
.f-laden,.f-fehler{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;color:rgba(238,242,255,.85);text-shadow:0 1px 10px rgba(3,6,20,.9)}
.f-laden[hidden],.f-fehler[hidden]{display:none}
.f-fehler p{margin:0;max-width:20rem;font-size:1.02rem}
.lade-sterne{display:flex;gap:12px}
.lade-sterne i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px 2px rgba(255,210,122,.7);animation:laden 1.2s ease-in-out infinite}
.lade-sterne i:nth-child(2){animation-delay:.2s}.lade-sterne i:nth-child(3){animation-delay:.4s}
.lade-sterne.klein{display:inline-flex;gap:6px;margin-right:9px;vertical-align:.12em}
.lade-sterne.klein i{width:6px;height:6px;box-shadow:0 0 8px 1px rgba(255,210,122,.7)}
@keyframes laden{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:none}}
.f-fuss{height:var(--fuss-h,150px);width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;transition:opacity .35s ease}
.rein .f-kopf,.rein .f-fuss{opacity:0;pointer-events:none}
.fuss-v{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.fuss-v[hidden],.fuss-b[hidden]{display:none}
.f-hinweis{margin:0;min-height:2.4em;display:flex;flex-direction:column;justify-content:center;font-family:var(--schrift-titel);font-style:italic;font-weight:500;font-size:clamp(1.18rem,4.6vw,1.55rem);line-height:1.18;text-wrap:balance}
.f-hinweis small{display:block;margin-top:.25rem;font-family:var(--schrift-text);font-style:normal;font-weight:500;font-size:.92rem;color:var(--gold)}
.fuss-knoepfe{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.fuss-b{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;grid-template-areas:"z t w" "n n n";align-items:center;gap:6px 10px}
#fZurueck{grid-area:z}#fWeiter{grid-area:w}
.f-text{grid-area:t;min-width:0;text-align:center}
.f-text h2{margin:0;font-family:var(--schrift-titel);font-style:italic;font-weight:600;font-size:clamp(1.3rem,5vw,1.8rem);line-height:1.12;text-wrap:balance;overflow-wrap:anywhere}
.f-text p{margin:.2rem 0 0;color:var(--gold);font-size:.95rem}
.f-nochmal{grid-area:n;justify-self:center;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border:0;border-radius:999px;background:none;cursor:pointer;color:rgba(238,242,255,.78);font-size:.95rem;font-weight:500}
.f-nochmal svg{width:17px;height:17px;color:var(--gold)}
.f-nochmal:active{background:rgba(238,242,255,.08)}
.f-ring{position:absolute;z-index:2;left:0;top:0;width:var(--d,64px);height:var(--d,64px);margin:calc(var(--d,64px) / -2) 0 0 calc(var(--d,64px) / -2);border-radius:50%;pointer-events:none;
  border:2px solid rgba(255,226,160,.95);box-shadow:0 0 18px rgba(255,210,122,.45),inset 0 0 12px rgba(255,210,122,.3);animation:ringPuls 1.6s ease-out infinite}
.f-ring[hidden]{display:none}
.f-ring.zappelt{animation:ringZappeln .36s ease-in-out 2}
@keyframes ringPuls{0%{transform:scale(.55);opacity:0}25%{opacity:1}100%{transform:scale(1.25);opacity:0}}
@keyframes ringZappeln{0%,100%{transform:none;opacity:1}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ---------- Tablet & Desktop ---------- */
@media (min-width:900px){
  .kopf{padding-top:max(18px,env(safe-area-inset-top))}
  .kopf h1 .gross,.kopf h1 .klein{display:inline}
  .kopf h1 .gross{font-size:clamp(2.6rem,4.2vw,3.6rem)}
  .kopf h1 .klein{margin-left:.3em;font-size:clamp(1.5rem,2.3vw,2rem)}
  .heute-zeile{display:inline;margin-right:.4em}
  .hilfe{display:inline;max-width:none}
  .kopf .zeile2{margin:.55rem auto 0;max-width:62rem}
  .mond{width:46px;height:46px;box-shadow:inset -13px 5px 0 1px #f2ead2}
  .fuss-b{grid-template-columns:56px minmax(0,1fr) 56px}
  .fenster{--fuss-h:138px}
}
@media (max-width:899px){
  .kopf .zeile2{margin:.1rem auto 0;max-width:34rem}
}
/* Handy quer: Bühne über die ganze Höhe, Text und Knöpfe in eine Seitenspalte */
@media (orientation:landscape) and (max-height:520px){
  .fenster{--fuss-h:auto}
  .f-innen{grid-template-columns:minmax(0,1fr) minmax(220px,36%);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"b k" "b f";column-gap:16px}
  .f-kopf{grid-area:k;max-width:none;min-height:48px}
  .f-kopf-text b{font-size:1.15rem}
  .f-buehne{grid-area:b}
  .f-fuss{grid-area:f;height:auto;max-width:none;justify-content:flex-start;padding-top:6px;overflow:hidden}
  .f-hinweis{font-size:1.12rem;min-height:0}
  .fuss-knoepfe{flex-direction:column;align-items:stretch}
  .fuss-b{grid-template-columns:48px minmax(0,1fr) 48px}
  .fuss-b .knopf-rund{width:48px;height:48px}
  .f-text h2{font-size:1.2rem}
}
@media (prefers-reduced-motion:reduce){
  .z-heute .sb-halo,.z-heute circle,.z-heute .glanz,.z-verpasst circle,body.fest .polarlicht{animation:none}
  .z-heute .sb-halo::after{animation:none;opacity:.55}
  .wackelt,.frisch .sb-halo,.gefunden .sb-halo{animation-duration:.01s}
  .f-ring{animation:none;opacity:.95}
  .blase,.chip{animation:none}
  .f-spur img{transition:opacity .15s}
}
