<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b1c33">
<title>Der Drehbaum – Dein Adventskalender</title>
<link rel="stylesheet" href="../fonts/baum.css">
<style>
:root{
  /* Farben: Wohnzimmerecke am Abend */
  --pflaume:#3b1c33;   /* Wand im Lampenlicht */
  --nacht:#1d0c19;     /* tiefe Schatten, Bildansicht */
  --tanne:#1e4a37;     /* Nordmanntanne */
  --honig:#f2c46a;     /* Lichterkette, Stern, Akzente */
  --kupfer:#cf7446;    /* Kupferkugeln, warme Knöpfe */
  --creme:#f8ecda;     /* Schrift, Strick-Baumdecke */
  /* Schriften: weiche Grotesk-Antiqua für Titel und Zahlen, skandinavische Grotesk für Text */
  --schrift-titel:'Young Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --schrift-text:'Schibsted Grotesk','Segoe UI',system-ui,sans-serif;
  /* Menü-Knopf aus kalender.js (#kalender-reset, runder 40-px-Knopf: Ansicht wechseln, Testmodus): sitzt fest
     unten links (Lage setzt kalender.js, hier nichts verschieben). Diese Seite hält nur seine Ecke frei
     (--menue-knopf-zone, 64 × 64 px ab der Ecke, zzgl. Safe-Area): Hochkant rückt die Knopfleiste rechts neben die
     Zone (siehe .knoepfe), quer und am Desktop liegt dort nur die Wand neben dem Baum. Während Bildansicht und
     Kugel-Liste ist der Knopf ausgeblendet (siehe unten). */
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--nacht);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{height:100%;margin:0;overflow:hidden;color:var(--creme);font-family:var(--schrift-text);font-size:16px;line-height:1.45;font-variant-numeric:lining-nums;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--honig);outline-offset:3px}
.unsichtbar{position:absolute!important;top:0;left:0;width:1px;height:1px;margin:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Szene (Canvas hinter allem) ---------- */
#szene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.leuchten{position:fixed;left:0;top:0;width:0;height:0;z-index:1;pointer-events:none;display:none}
.leuchten.an{display:block}
.leuchten i{position:absolute;border-radius:50%;mix-blend-mode:screen;will-change:transform,opacity;
  background:radial-gradient(closest-side,rgba(255,236,170,0) 34%,rgba(255,224,135,.95) 42%,rgba(255,198,96,.5) 58%,rgba(255,170,70,.14) 80%,rgba(255,170,70,0) 100%);
  animation:puls 1.9s ease-in-out infinite}
.leuchten.hinten i{background:radial-gradient(closest-side,rgba(255,226,160,.62),rgba(255,190,100,.36) 32%,rgba(255,160,80,.12) 64%,rgba(255,150,70,0) 100%);animation-duration:2.3s}
.leuchten.seite i{animation-duration:1.45s}
.leuchten.nah i{animation-duration:1.05s}
.leuchten.gefunden i::after{content:"";position:absolute;inset:-30%;border-radius:50%;border:2px solid rgba(255,226,150,.9);animation:ring .9s ease-out forwards}
/* Funken, wenn die heutige Kugel gefunden ist */
.funken{position:fixed;left:0;top:0;width:0;height:0;z-index:30;pointer-events:none}
.funken i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;opacity:0;background:#ffe3a0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  filter:drop-shadow(0 0 4px rgba(255,200,110,.95));animation:funke var(--t,.9s) cubic-bezier(.15,.7,.3,1) var(--v,0s) forwards}
@keyframes funke{0%{opacity:1;transform:translate(0,0) scale(.3) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(var(--s,1)) rotate(140deg)}}
@keyframes puls{0%,100%{opacity:.5;transform:scale(.88)}50%{opacity:1;transform:scale(1.06)}}
@keyframes ring{from{opacity:1;transform:scale(.45)}to{opacity:0;transform:scale(1.25)}}

/* ---------- Raster ---------- */
.app{position:relative;z-index:2;height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"kopf" "buehne" "steuer";
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.kopf{grid-area:kopf;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:start;column-gap:6px}
.titel{grid-column:2;text-align:center;min-width:0}
h1{margin:3px 0 0;font-family:var(--schrift-titel);font-weight:400;font-size:clamp(1.32rem,5.7vw,2.1rem);line-height:1.08;letter-spacing:-.005em;text-wrap:balance;text-shadow:0 2px 16px rgba(16,4,12,.75)}
.datum{margin:.28rem 0 0;font-size:clamp(.84rem,3.9vw,.95rem);font-weight:600;text-wrap:balance;color:var(--honig);text-shadow:0 1px 8px rgba(16,4,12,.8)}
.listen-knopf{grid-column:3;grid-row:1;width:44px;height:44px;margin-top:1px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--creme);background:rgba(29,12,25,.5);box-shadow:inset 0 0 0 1.5px rgba(242,196,106,.6)}
.listen-knopf svg{width:22px;height:22px}
.listen-knopf:active,.ton-knopf:active{background:rgba(242,196,106,.18)}
.kopf{position:relative}
/* Ton-Knopf: Handy/Tablet links in der Kopfzeile (Gegenstück zum Listen-Knopf), Desktop über dem Titel */
.titel{grid-row:1}
.ton-knopf{grid-column:1;grid-row:1;position:relative;z-index:3;width:44px;height:44px;margin-top:1px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--creme);background:rgba(29,12,25,.42);box-shadow:inset 0 0 0 1.5px rgba(248,236,218,.32)}
.ton-knopf svg{width:21px;height:21px}
.ton-knopf[aria-pressed="false"]{color:rgba(248,236,218,.6)}
/* nur für den Prototyp-Baustein (dort wird der Knopf nach dem Zurücksetzen kurz zur breiten Textpille und läge
   dann über dem „‹“-Knopf) – mit dem Produktions-Baustein wirkungslos */
html body #kalender-reset.ok{width:40px;padding:0}html body #kalender-reset.ok span{display:none}

.buehne{grid-area:buehne;position:relative;min-height:0}
.baum-platz{position:absolute;inset:0;touch-action:pan-y pinch-zoom;cursor:grab;border-radius:28px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.baum-platz.zieht{cursor:grabbing}
html.oben,html.oben body{overscroll-behavior:none}
.baum-platz:focus{outline:none}
.baum-platz:focus-visible{outline:2px dashed rgba(242,196,106,.5);outline-offset:-6px}
.baum-platz.zeiger:focus-visible{outline:none}

.steuer{grid-area:steuer;padding:4px 0 0;text-align:center}
.hinweis{margin:0 auto 10px;max-width:30rem;height:2.9em;overflow:hidden;font-size:1rem;line-height:1.45;text-wrap:balance;text-shadow:0 1px 10px rgba(16,4,12,.95),0 0 2px rgba(16,4,12,.6)}
/* Knopfleiste: mittig, aber nie in der Ecke des Menü-Knopfs. --kz = wie weit die Leiste vom linken Rand der
   Steuer-Spalte wegbleiben muss (Zone + Safe-Area − Seitenrand der .app). Ab etwa 550 px Breite bleibt sie mittig,
   darunter beginnt sie rechts neben der Zone und reicht bis zum rechten Rand. */
.knoepfe{--kz:calc(var(--menue-knopf-zone,64px) + env(safe-area-inset-left,0px) - max(10px,env(safe-area-inset-left,0px)));
  display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;gap:10px;
  width:min(420px,calc(100% - var(--kz)));max-width:420px;margin:0 0 0 max(var(--kz),calc((100% - 420px) / 2))}
.knopf-rund{width:52px;height:52px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--creme);background:rgba(29,12,25,.6);box-shadow:inset 0 0 0 1.5px rgba(242,196,106,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.knopf-rund:active{background:rgba(242,196,106,.2)}
.knopf-rund:disabled{opacity:.32;cursor:default}
.knopf-haupt{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:52px;padding:.6rem 1rem;border:0;border-radius:26px;cursor:pointer;font-weight:700;font-size:1.04rem;line-height:1.15;color:#2b1021;
  background:linear-gradient(180deg,#f8dc98,var(--honig) 55%,#d8a246);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -2px 0 rgba(120,70,20,.35),0 10px 22px -10px rgba(0,0,0,.85)}
.knopf-haupt svg{width:22px;height:22px}
.knopf-haupt span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.knopf-haupt:active{transform:translateY(1px)}
.knopf-haupt.kupfer{color:#26090f;background:linear-gradient(180deg,#eeac86,var(--kupfer) 55%,#a5532e)}
.knopf-haupt.ruhig{color:var(--creme);background:rgba(29,12,25,.62);box-shadow:inset 0 0 0 1.5px rgba(248,236,218,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

/* Sprechblase und Dreh-Hinweis */
.blase{position:fixed;z-index:50;left:0;top:0;width:max-content;max-width:min(270px,82vw);padding:.55rem .9rem .65rem;border-radius:14px;background:var(--creme);color:#2a1424;font-size:.95rem;line-height:1.3;box-shadow:0 14px 30px -10px rgba(0,0,0,.75);pointer-events:none;animation:blaseRein .32s cubic-bezier(.2,.9,.3,1.3)}
.blase strong{display:block;margin-bottom:.1rem;font-family:var(--schrift-titel);font-weight:400;font-size:1.22rem;line-height:1.15}
.blase::after{content:"";position:absolute;top:100%;left:var(--pfeil,50%);margin-left:-8px;border:8px solid transparent;border-top-color:var(--creme)}
.blase.unten::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--creme)}
@keyframes blaseRein{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:none}}
.pfeil{position:absolute;left:50%;bottom:4px;z-index:3;display:inline-flex;align-items:center;gap:.45rem;padding:.45rem 1rem .45rem .8rem;border-radius:999px;white-space:nowrap;pointer-events:none;font-weight:700;color:var(--honig);background:rgba(29,12,25,.78);box-shadow:inset 0 0 0 1px rgba(242,196,106,.45),0 8px 20px -8px rgba(0,0,0,.7);transform:translateX(-50%);animation:schubsL 1.5s ease-in-out infinite}
.pfeil[hidden]{display:none}
.pfeil svg{width:22px;height:22px}
.pfeil.rechts{flex-direction:row-reverse;padding:.45rem .8rem .45rem 1rem;animation-name:schubsR}
@keyframes schubsL{0%,100%{translate:0 0}50%{translate:-9px 0}}
@keyframes schubsR{0%,100%{translate:0 0}50%{translate:9px 0}}
@keyframes wackeln{0%{transform:rotate(0)}15%{transform:rotate(-12deg)}35%{transform:rotate(9deg)}55%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}100%{transform:rotate(0)}}

/* ---------- Liste aller Kugeln (Handy: Blatt von unten, Desktop: Seitenleiste) ---------- */
.liste{position:fixed;z-index:40;left:0;right:0;bottom:0;max-height:min(84vh,660px);overflow:auto;overscroll-behavior:contain;
  padding:14px max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  border-radius:22px 22px 0 0;background:linear-gradient(180deg,#4a2540,#2b1227 70%);box-shadow:0 -24px 60px -12px rgba(0,0,0,.65),inset 0 1px 0 rgba(242,196,106,.3);
  transform:translateY(104%);visibility:hidden;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s linear .34s}
.liste.offen{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s}
.liste-kopf{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:520px;margin:0 auto}
.liste h2{margin:0;font-family:var(--schrift-titel);font-weight:400;font-size:1.45rem;line-height:1.1}
.liste-hilfe{max-width:520px;margin:.3rem auto .8rem;font-size:.92rem;color:rgba(248,236,218,.78);text-wrap:pretty}
.knopf-rund.klein{width:44px;height:44px}
.gitter{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 6px;max-width:520px;margin:0 auto}
.mini{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;min-height:60px;padding:7px 0 5px;border:0;border-radius:12px;background:rgba(248,236,218,.05);cursor:pointer}
.mini:active{background:rgba(242,196,106,.14)}
.mk{position:relative;display:block;width:36px;height:44px;margin-top:-6px}
.mk canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.mk-stern{width:34px;height:34px;margin:2px 0 4px}
.mk-stern svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.mz{font-weight:700;font-size:.86rem;line-height:1}
.z-zu .mz{color:rgba(248,236,218,.6)}
.mini.ist-heute{box-shadow:inset 0 0 0 2px var(--honig);background:rgba(242,196,106,.12)}
.mini.ist-heute .mz{color:var(--honig)}
.mini.wackelt .mk{animation:wackeln .6s ease-out}
.legende{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;max-width:520px;margin:.9rem auto 0;padding:0;list-style:none;font-size:.84rem;color:rgba(248,236,218,.72)}
.legende li{display:inline-flex;align-items:center;gap:6px}
.legende canvas{display:block;width:20px;height:24px;flex:none}
.schleier{position:fixed;inset:0;z-index:39;background:rgba(14,4,11,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.schleier.offen{opacity:1;pointer-events:auto}

/* ---------- Bildansicht ---------- */
.ansicht{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;overflow:hidden;color:var(--creme);
  background:radial-gradient(70% 55% at var(--kx,50%) var(--ky,44%),#5b2c48 0%,#36172c 52%,var(--nacht) 100%)}
.ansicht::backdrop{background:transparent}
.ansicht:focus{outline:none}
.ansicht::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.8;
  background:radial-gradient(18px 18px at 12% 18%,rgba(255,214,130,.22),transparent),radial-gradient(26px 26px at 86% 12%,rgba(255,196,110,.16),transparent),
    radial-gradient(14px 14px at 78% 84%,rgba(255,220,150,.2),transparent),radial-gradient(30px 30px at 8% 78%,rgba(207,116,70,.16),transparent),
    radial-gradient(12px 12px at 50% 6%,rgba(255,230,170,.18),transparent),radial-gradient(22px 22px at 94% 52%,rgba(255,206,120,.14),transparent)}
.ansicht-innen{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.ansicht-kopf{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;width:100%;max-width:1100px;margin:0 auto}
.zaehler{margin:0 0 0 4px;font-size:.95rem;font-weight:600;color:var(--honig)}
.ansicht-buehne{position:relative;min-height:0;overflow:hidden;touch-action:pan-y pinch-zoom;cursor:grab;-webkit-user-select:none;user-select:none}
.spur{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
.spur img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 34px rgba(0,0,0,.6));-webkit-user-drag:none;user-select:none;pointer-events:none;transition:opacity .25s}
.spur.laedt img,.spur.fehler img{opacity:0}
/* Solange das große Bild unterwegs ist: die schon geladene kleine Vorschau unscharf dahinter (nur wenn vorhanden) */
.vorbild{position:absolute;inset:4%;background:center/contain no-repeat;filter:blur(18px) saturate(1.1);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility 0s linear .25s}
.spur.laedt.mitvor .vorbild{opacity:.5;visibility:visible;transition:opacity .25s}
.lader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--honig);font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.spur.laedt .lader{opacity:1;transition-delay:.18s}
.lader svg{width:46px;height:46px;filter:drop-shadow(0 1px 6px rgba(16,4,12,.8))}
.lader span{text-shadow:0 1px 8px rgba(16,4,12,.95),0 0 2px rgba(16,4,12,.7)}
.spur.laedt .lader svg{animation:drehen 1.6s linear infinite}   /* dreht nur, solange wirklich geladen wird */
@keyframes drehen{to{transform:rotate(360deg)}}
.fehlbild{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
.spur.fehler .fehlbild{display:flex}
.fehlbild p{margin:0;max-width:22rem}
.knopf-text{min-height:48px;padding:.6rem 1.2rem;border:0;border-radius:24px;font-weight:700;cursor:pointer;color:#2b1021;background:linear-gradient(180deg,#f8dc98,var(--honig) 55%,#d8a246)}
.ansicht-fuss{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;gap:8px;width:100%;max-width:780px;margin:0 auto}
.ansicht-text{min-width:0;text-align:center}
.ansicht-text h2{margin:0;font-family:var(--schrift-titel);font-weight:400;font-size:clamp(1.25rem,4.8vw,1.8rem);line-height:1.15;text-wrap:balance}
.ansicht-text p{margin:.2rem 0 0;font-size:.95rem;color:var(--honig)}
html.vollansicht #kalender-reset,html.listeoffen #kalender-reset{display:none}

/* ---------- Schmale Handys hochkant: Leiste rechts neben der Menü-Zone – kleinere Rundknöpfe, Symbol im
   Hauptknopf erst ab 420 px, damit auch „Kugel 12 aufmachen“ / „Kugel 22 ist noch zu“ ganz lesbar bleiben ---------- */
@media (max-width:559px){
  .knoepfe{grid-template-columns:48px minmax(0,1fr) 48px;gap:8px}
  .knoepfe .knopf-rund{width:48px;height:48px}
  .knopf-haupt{min-height:48px;padding:.6rem .7rem}
}
@media (max-width:419px){
  .knopf-haupt svg{display:none}
}
@media (max-width:380px){
  .knoepfe{grid-template-columns:46px minmax(0,1fr) 46px;gap:6px}
  .knoepfe .knopf-rund{width:46px;height:46px}
  .knopf-haupt{min-height:46px;padding:.55rem .5rem;font-size:.96rem}
}
/* ---------- Querformat am Handy (Menü-Knopf liegt hier unten links vor der Wand, die Leiste steht rechts) ---------- */
@media (orientation:landscape) and (max-height:540px) and (max-width:999px){
  .app{grid-template-columns:minmax(0,1fr) minmax(230px,300px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"buehne kopf" "buehne steuer";column-gap:12px}
  h1{font-size:1.3rem}
  .steuer{align-self:end}
  .hinweis{height:4.4em}
  .knoepfe{width:auto;margin:0 auto;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px}
  .knoepfe .knopf-rund{width:48px;height:48px}
  .knopf-haupt{min-height:48px;padding:.6rem .7rem}
  .knopf-haupt svg{display:none}
}
/* ---------- Desktop: Baum mittig, Info links, Liste rechts ---------- */
@media (min-width:1000px) and (min-height:560px){
  .app{grid-template-columns:minmax(270px,330px) minmax(0,1fr) minmax(270px,330px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"kopf buehne liste" "steuer buehne liste";column-gap:clamp(14px,2.4vw,40px);padding:22px 28px}
  .kopf{display:block;padding-top:48px}
  .titel{text-align:left}
  h1{font-size:clamp(2rem,2.8vw,2.75rem);line-height:1.05}
  .datum{font-size:1.02rem;margin-top:.55rem}
  .listen-knopf{display:none}
  .ton-knopf{position:absolute;top:-12px;left:0}
  .steuer{align-self:start;padding-top:22px;text-align:left}
  .hinweis{height:auto;min-height:4.4em;margin:0 0 18px;font-size:1.05rem;text-wrap:pretty}
  /* Spalte ist 330 px breit: etwas kleinere Rundknöpfe, damit auch „Kugel 22 ist noch zu“ mit Symbol ganz passt */
  .knoepfe{width:auto;margin:0;max-width:340px;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px}
  .knoepfe .knopf-rund{width:48px;height:48px}
  .knopf-haupt{min-height:48px;padding:.6rem .75rem;font-size:1rem}
  .liste{position:relative;z-index:auto;inset:auto;grid-area:liste;align-self:center;max-height:100%;padding:18px 18px 16px;border-radius:20px;transform:none;visibility:visible;transition:none;
    background:rgba(29,12,25,.58);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(242,196,106,.25),0 20px 40px -20px rgba(0,0,0,.6)}
  .liste #listeZu{display:none}
  .gitter{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .schleier{display:none}
}
@media (prefers-reduced-motion:reduce){

  function zeichneBirne(b, lichtAn) {

  }

  // Schatten, den der Rock einer Etage auf die darunterliegende wirft

    for (var i = 0; i <= 16; i++) { proj(e.rb * 0.8, e.yb - 0.02, -Math.PI / 2 + i / 16 * Math.PI); if (i) g.lineTo(P.x, P.y); else g.moveTo(P.x, P.y); }

    g.strokeStyle = 'rgba(2,12,7,.26)'; g.lineWidth = G.R * 0.22; g.stroke();
    g.strokeStyle = 'rgba(2,12,7,.32)'; g.lineWidth = G.R * 0.1; g.stroke();
  }
  function zeichneEtage(k, lichtAn) {
    var liste = etagenListen[k], e = ETAGEN[k], i, it, a;

  /* --- Stern an der Spitze (Tag 24): 3D-Stern mit Facetten, dreht sich mit --- */
  var STERN = [];
  (function () { for (var i = 0; i < 10; i++) { var w = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 0.43 : 1; STERN.push([Math.cos(w) * r, Math.sin(w) * r]); } })();
  var LICHT = (function () { var v = [-0.45, -0.6, 0.66], n = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]); return [v[0] / n, v[1] / n, v[2] / n]; })();

  for (var fi = 0; fi < 20; fi++) facetten.push({ p: null, z: 0, d: 0, n: [0, 0, 0], sicht: false });
  function zeichneStern() {

    var an = sternLicht, wa = Math.cos(sternWackel), wb = Math.sin(sternWackel), i;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    g.beginPath(); g.moveTo(cx, G.apexY + R * 0.2); g.lineTo(cx, cy + R * 0.3); g.stroke();
    var blitz = sternAnim ? Math.sin(Math.min(1, sternAnim.u) * Math.PI) : 0;
    if (an > 0.01 || blitz > 0) {
      var oben = Math.max(R * 1.5, cy - G.kopfUnten - 6);   // Platz bis zur Kopfzeile
      var gr = Math.min(R * (3.4 + blitz * 2.2), Math.max(R * 2.2, oben * 1.25)), hg = g.createRadialGradient(cx, cy, R * 0.2, cx, cy, gr);

      g.globalCompositeOperation = 'lighter'; g.fillStyle = hg; g.fillRect(cx - gr, cy - gr, 2 * gr, 2 * gr);
      // feine Strahlen

  function zeichneFlug() {

    var x = f.x0 + (f.x1 - f.x0) * u, y = f.y0 + (f.y1 - f.y0) * u - Math.sin(u * Math.PI) * f.bogen, r = f.r0 + (f.r1 - f.r0) * u;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    var hg = g.createRadialGradient(x, y, r * 0.8, x, y, r * 2.2);
    hg.addColorStop(0, 'rgba(255,210,130,' + (0.45 * u).toFixed(3) + ')'); hg.addColorStop(1, 'rgba(255,210,130,0)');
    g.globalCompositeOperation = 'lighter'; g.fillStyle = hg; g.fillRect(x - r * 2.2, y - r * 2.2, r * 4.4, r * 4.4);

      var ein = f.foto ? sanft(klemm((f.u - 0.3) / 0.55, 0, 1)) : 0;
      malKugel(g, r, k.tag, 'glas', k.farbe, null, false, ein > 0);
      if (ein > 0) {

  }

  function zeichneFokus() {

    g.strokeStyle = 'rgba(242,196,106,.95)'; g.lineWidth = 2.5; g.setLineDash([5, 4]);

    if (!gs.hop && !gs.kipp) { g.setTransform(DPR, 0, 0, DPR, 0, 0); g.drawImage(gs.c, gs.bx, gs.by, gs.bw, gs.bh); return; }
    var c = Math.cos(gs.kipp), sn = Math.sin(gs.kipp);

  var leuchtGr = 0, leuchtI = el.leuchten.querySelector('i');
  function setzeLeuchten() {
    var h = K.heute(), x, y, r, stufe = 'nah', op = 1;
    if (h >= 1 && h <= 23 && zustand(h) === 'heute') {
      var k = kugelVon[h];
      if (k && !k.fliegt) {
        x = k.sx; y = k.sy; r = k.sr;
        // warm/kalt: hinten ein großer, langsamer Schein; je weiter vorn, desto schneller und heller pulsiert sie
        stufe = k.ca < -0.05 ? 'hinten' : k.ca < 0.8 ? 'seite' : 'nah';
        if (stufe === 'hinten') { op = 0.85; r *= 2.4; } else if (stufe === 'seite') op = 0.82 + k.ca * 0.2;
      }
    } else if (h === 24 && zustand(24) === 'heute' && !sternAnim) { x = G.cx; y = G.starY; r = G.starR * 1.2; }
    if (x === undefined || A.offen) { el.leuchten.classList.remove('an'); return; }
    el.leuchten.classList.add('an');
    if (el.leuchten.dataset.stufe !== stufe) {

    el.leuchten.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
    el.leuchten.style.opacity = op.toFixed(2);
  }

  function zeichne() {
    if (!G.R || !raumHinten) return;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    g.drawImage(raumHinten, 0, 0);
    var lichtAn = K.heute() > 0, h = K.heute(), i;
    heuteK = h >= 1 && h <= 23 && zustand(h) === 'heute' ? kugelVon[h] : null;
    dunkler = lichtAn ? 0 : 0.1;
    for (i = 0; i < geschenke.length; i++) if (!geschenke[i].vorne) zeichneGeschenk(geschenke[i]);
    for (var k = 0; k < etagenListen.length; k++) zeichneEtage(k, lichtAn);
    zeichneStern();
    for (i = 0; i < geschenke.length; i++) if (geschenke[i].vorne) zeichneGeschenk(geschenke[i]);
    if (flug) zeichneFlug();
    if (fokusRing && !flug) zeichneFokus();

  }

  /* ================================================================
     Bewegung: Drehen mit Schwung, Feder zum Ziel, Magnet, Pendeln
     ================================================================ */
  function setzeZiel(k, steif, fertig, frueh) { ziel = { k: k, steif: steif, fertig: fertig || null, frueh: !!frueh }; anstossen(); }
  function zielErreicht() { var z = ziel; ziel = null; omega = 0; if (z && z.fertig) z.fertig(); }
  function magnetZiel() {
    var pz = phi + omega * 0.8, best = null, bd = 1e9, h = K.heute();
    for (var i = 0; i < kugeln.length; i++) {
      var k = kugeln[i], d = Math.abs(wrap(k.th + pz));
      if (k.tag === h && zustand(h) === 'heute' && d < 0.42) return k;
      if (d < bd) { bd = d; best = k; }
    }
    return bd < 0.5 ? best : null;
  }
  function vorneKugel() {
    var best = null, bd = 0.3;

    return best;
  }

  function schritt(dt) {

    if (zug && zug.aktiv) { /* phi folgt dem Finger */ }
    else if (ziel) {

      if (REDUZIERT) { phi += d; zielErreicht(); }
      else {

        omega += acc * dt; phi += omega * dt;

        if (Math.abs(d) < 0.002 && Math.abs(omega) < 0.03) { phi += d; zielErreicht(); }
      }

      phi += omega * dt;
      if (Math.abs(omega) < 1.5) { var m = magnetZiel(); if (m) setzeZiel(m, REDUZIERT ? 1 : 30); else if (Math.abs(omega) < 0.04) omega = 0; }
    }
    phiLetzt = phi;
    var w = (phi - phiAlt) / dt;
    wGlatt += (w - wGlatt) * Math.min(1, dt * 16);
    var beschl = klemm((wGlatt - wVorher) / dt, -140, 140); wVorher = wGlatt;
    if (Math.abs(wGlatt) < 0.004) wGlatt = 0;
