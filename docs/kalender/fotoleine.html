<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#25484b">
<title>Die Fotoleine – Dein Adventskalender</title>
<link rel="stylesheet" href="../fonts/fotoleine.css">
<style>
:root {
  /* Farben */
  --wand: #25484b;    /* Petrol-Putz der Wohnzimmerwand am Abend */
  --kraft: #c99c66;   /* Kraftpapier der Umschläge */
  --siegel: #b3342b;  /* Siegellack */
  --lampe: #ffcd78;   /* Glühbirnchen der Lichterkette */
  --foto: #f5f2ea;    /* Sofortbild-Rahmen, Zettel, Klebeband */
  --tinte: #2b221c;   /* Filzstift */
  /* Schriften */
  --hand: 'Gochi Hand', 'Segoe Print', 'Bradley Hand', cursive;
  --text: 'Alegreya', Georgia, 'Times New Roman', serif;
  /* Texturen (werden per Canvas erzeugt) */
  --putz: linear-gradient(transparent, transparent);
  --faser: linear-gradient(transparent, transparent);
  --albumfaser: linear-gradient(transparent, transparent);
  --stempelmaske: linear-gradient(#000, #000);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html {
  -webkit-text-size-adjust: 100%;
  scrollbar-gutter: stable;
  background: color-mix(in srgb, var(--wand) 88%, #000);
}
html.gesperrt { overflow: hidden; background: color-mix(in srgb, var(--wand) 40%, #000); }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--text);
  color: var(--foto);
  background:
    var(--putz),
    radial-gradient(130% 55% at 50% -6%, color-mix(in srgb, var(--lampe) 26%, transparent), transparent 62%),
    linear-gradient(180deg, color-mix(in srgb, var(--wand) 90%, var(--lampe)) 0%, var(--wand) 34%, color-mix(in srgb, var(--wand) 78%, #000) 100%);
}
body.november {
  background:
    var(--putz),
    linear-gradient(180deg, color-mix(in srgb, var(--wand) 92%, #fff) 0%, var(--wand) 40%, color-mix(in srgb, var(--wand) 74%, #000) 100%);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--lampe); outline-offset: 3px; }
.nur-sr { position: fixed; left: 0; top: 0; margin: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ---------- Kopf: Titel auf Klebeband ---------- */
.kopf {
  text-align: center;
  padding: calc(18px + env(safe-area-inset-top)) 14px 4px;
}
.titel {
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-weight: 400;
}
.band {
  display: inline-block;
  font-family: var(--hand);
  color: var(--tinte);
  line-height: 1;
  padding: .16em .62em .12em;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 2px, transparent 2px 5px),
    color-mix(in srgb, var(--foto) 88%, transparent);
  clip-path: polygon(0 0, 1.6% 9%, .2% 19%, 1.8% 30%, .4% 41%, 1.6% 52%, 0 63%, 1.5% 74%, .3% 86%, 1.4% 100%,
    98.5% 100%, 99.8% 88%, 98.4% 77%, 100% 66%, 98.6% 54%, 99.7% 43%, 98.3% 31%, 99.8% 20%, 98.5% 9%, 100% 0);
}
.band-1 { font-size: clamp(34px, 10vw, 60px); transform: rotate(-2.2deg); position: relative; z-index: 1; }
.band-2 { font-size: clamp(22px, 6.2vw, 32px); transform: rotate(1.4deg) translateX(.8em); margin-top: -.18em; }
.unterzeile {
  margin: 16px auto 0;
  max-width: 34em;
  font-size: clamp(16px, 4.2vw, 18.5px);
  line-height: 1.42;
  text-wrap: balance;
}
.unterzeile .eins { display: block; }
.unterzeile .zwei { display: block; margin-top: 3px; font-style: italic; font-size: .92em; color: color-mix(in srgb, var(--foto) 78%, var(--wand)); }
@media (max-width: 599px) {
  .unterzeile { margin-top: 12px; }
  .advent .unterzeile .zwei { display: none; }
}
.feier .unterzeile .eins { font-family: var(--hand); font-size: 1.75em; line-height: 1.1; color: var(--lampe); }
@media (min-width: 720px) {
  .titel { flex-direction: row; justify-content: center; align-items: flex-end; gap: .3em; }
  .band-2 { margin-top: 0; transform: rotate(1.6deg) translateY(-.15em); }
  .kopf { padding-top: calc(24px + env(safe-area-inset-top)); }
  .unterzeile { margin-top: 14px; }
}

/* ---------- Die Wand mit den Leinen ---------- */
.wand {
  position: relative;
  max-width: 1240px;
  margin: 10px auto 0;
  /* unten Platz für den Heute-Hinweis und den Menü-Knopf unten links (mindestens --menue-knopf-zone) */
  padding: 0 8px calc(max(96px, var(--menue-knopf-zone, 64px)) + env(safe-area-inset-bottom));
  overflow-x: clip;
}
@media (min-width: 600px) { .wand { padding-left: 24px; padding-right: 24px; } }
.leine { position: relative; }
.schnur { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.s-grund { fill: none; stroke: color-mix(in srgb, var(--kraft) 80%, var(--foto)); stroke-width: 2.3; }
.s-drall { fill: none; stroke: rgba(55, 35, 15, .5); stroke-width: 2.3; stroke-dasharray: 1.1 3.1; }
.halo { opacity: .95; }
.sockel { fill: color-mix(in srgb, var(--wand) 45%, #000); }
.glas { fill: var(--lampe); }
.nagel { fill: color-mix(in srgb, var(--kraft) 70%, var(--lampe)); stroke: rgba(0,0,0,.4); stroke-width: 1; }
.november .halo { display: none; }
.november .glas { fill: rgba(255,255,255,.2); }
.feier .funkel .halo { animation: funkeln 2.6s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
@keyframes funkeln { from { opacity: .2; } to { opacity: 1; } }

/* Ein Tag an der Leine */
.tag {
  position: absolute;
  z-index: 1;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.tag:focus { outline: none; }
.tag:focus-visible .gegenstand { outline: 3px solid var(--lampe); outline-offset: 5px; }
.tag.heute { z-index: 2; }
.tag.heute .umschlag { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--lampe) 70%, transparent), 0 0 22px 4px color-mix(in srgb, var(--lampe) 55%, transparent), 0 7px 12px -6px rgba(0,0,0,.6); }
.tag.versteckt { visibility: hidden; }
.schwinger {
  position: absolute;
  left: 0; right: 0; top: 0;
  display: block;
  transform-origin: 50% 0;
  transform: rotate(var(--neig, 0deg));
}
.wackler { position: relative; display: flex; flex-direction: column; align-items: center; transform-origin: 50% 0; }
.wackelt .wackler, .winkt .wackler { animation: wackeln .8s cubic-bezier(.3,.7,.4,1); }
@keyframes wackeln {
  0% { transform: rotate(0); } 14% { transform: rotate(10deg); } 34% { transform: rotate(-7.5deg); }
  54% { transform: rotate(4.5deg); } 74% { transform: rotate(-2.2deg); } 100% { transform: rotate(0); }
}
.klammer {
  position: absolute;
  left: 50%;
  top: calc(var(--env-w) * -.2232 - 2px);
  width: calc(var(--env-w) * .1108);
  height: calc(var(--env-w) * .36);
  transform: translateX(-50%);
  z-index: 4;
  filter: drop-shadow(1px 2px 1.2px rgba(0,0,0,.45));
}

/* Umschlag */
.umschlag {
  position: relative;
  z-index: 1;
  display: block;
  width: var(--env-w);
  aspect-ratio: 1.42;
  color: var(--kraft);
  border-radius: 2px;
  box-shadow: 0 7px 12px -6px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.25);
}
.umschlag::after {
  content: '';
  position: absolute; inset: 0;
  background: var(--faser);
  mix-blend-mode: multiply;
  opacity: .6;
  pointer-events: none;
}
.u-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.u-nr {
  position: absolute;
  left: 7%;
  bottom: 1%;
  z-index: 2;
  font: calc(var(--env-w) * .33)/1 var(--hand);
  color: var(--tinte);
  transform: rotate(-5deg);
}
.siegel {
  position: absolute;
  left: 50%; top: 56%;
  width: 27%;
  z-index: 3;
  transform: translate(-50%, -50%) rotate(-8deg);
  filter: drop-shadow(0 2px 2px rgba(0,0,0,.45));
}
.schein {
  position: absolute;
  left: 50%; top: calc(var(--env-w) * .35);
  width: calc(var(--env-w) * 2.1);
  height: calc(var(--env-w) * 1.6);
  transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, color-mix(in srgb, var(--lampe) 85%, transparent) 30%, color-mix(in srgb, var(--lampe) 30%, transparent) 62%, transparent);
  pointer-events: none;
  animation: atmen 3.6s ease-in-out infinite alternate;
}
@keyframes atmen {
  from { opacity: .55; transform: translate(-50%, -50%) scale(.93); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
}
.tag.zu .umschlag { color: color-mix(in srgb, var(--kraft) 78%, var(--wand)); box-shadow: 0 6px 10px -6px rgba(0,0,0,.55); }
.tag.zu .u-nr { left: 5%; font-size: calc(var(--env-w) * .29); color: color-mix(in srgb, var(--tinte) 85%, var(--kraft)); }
.marke { position: absolute; right: 3%; top: 4%; width: 40%; z-index: 2; color: inherit; }
.stempel {
  position: absolute;
  right: 3.5%;
  top: 47%;
  z-index: 2;
  padding: .22em .34em .18em;
  border: 1.5px solid currentColor;
  border-radius: 3px;
  color: color-mix(in srgb, var(--wand) 62%, #000);
  font: italic 700 max(11px, calc(var(--env-w) * .1))/1 var(--text);
  text-align: center;
  white-space: nowrap;
  transform: rotate(-7deg);
  opacity: .85;
  -webkit-mask-image: var(--stempelmaske);
  mask-image: var(--stempelmaske);
}
.stempel small { display: block; font-size: max(9.5px, .7em); font-weight: 500; margin-bottom: .14em; }
.zettel {
  position: relative;
  z-index: 0;
  margin-top: calc(var(--env-w) * -.035);
  margin-left: 34%;
  padding: .32em .55em .26em;
  font: max(14px, calc(var(--env-w) * .1))/1.02 var(--hand);
  color: var(--tinte);
  text-align: left;
  white-space: nowrap;
  background:
    linear-gradient(180deg, transparent calc(100% - 1px), color-mix(in srgb, var(--wand) 30%, transparent) 0) 0 0 / 100% 1.02em,
    var(--foto);
  transform: rotate(-5deg);
  box-shadow: 0 3px 6px -2px rgba(0,0,0,.5);
}

/* Sofortbild */
.sofort {
  position: relative;
  display: block;
  background: var(--foto);
  box-shadow: 0 9px 14px -7px rgba(0,0,0,.65), 0 1px 1px rgba(0,0,0,.2);
}
.sofort.klein {
  width: var(--foto-w);
  height: calc(var(--foto-w) * 1.2159);
  padding: calc(var(--foto-w) * .06) calc(var(--foto-w) * .06) 0;
}
.s-bild {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1;
  overflow: hidden;
  background: var(--farbe, color-mix(in srgb, var(--foto) 55%, var(--wand)));
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.14);
}
.s-bild img { display: block; width: 100%; height: 100%; object-fit: cover; -webkit-user-drag: none; user-select: none; opacity: 0; transition: opacity .35s; }
.s-bild.da img { opacity: 1; }
/* Ladezustand: bis das Foto da ist, zeigt der Rahmen die Leitfarbe des Tages mit sanftem Lichtschimmer */
.s-bild::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(105deg, transparent 32%, rgba(255,255,255,.3) 50%, transparent 68%);
  transform: translateX(-100%);
  animation: schimmer 1.5s ease-in-out infinite;
  pointer-events: none;
}
.s-bild.da::after { content: none; }
@keyframes schimmer { to { transform: translateX(100%); } }
.s-nr {
  display: block;
  text-align: center;
  margin-top: calc(var(--foto-w) * .045);
  font: calc(var(--foto-w) * .2)/1 var(--hand);
  color: var(--tinte);
  transform: rotate(-3deg);
}

/* Hinweis auf heute: mittig unten, aber nie in der Ecke des Menü-Knopfs. Er steht zwischen den beiden
   --menue-knopf-zone-Rändern (margin auto zentriert); ist er breiter, beginnt er rechts neben der Zone. */
.heute-hinweis {
  position: fixed;
  z-index: 30;
  left: calc(var(--menue-knopf-zone, 64px) + env(safe-area-inset-left));
  right: calc(var(--menue-knopf-zone, 64px) + env(safe-area-inset-right));
  bottom: calc(14px + env(safe-area-inset-bottom));
  width: -webkit-max-content;
  width: max-content;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 50px;
  padding: 0 16px 0 10px;
  border: 0;
  border-radius: 8px;
  color: var(--tinte);
  font: 700 17px/1 var(--text);
  white-space: nowrap;
  background: var(--faser), var(--kraft);
  box-shadow: 0 10px 24px -8px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.25) inset;
  cursor: pointer;
  animation: reinSchieben .35s cubic-bezier(.2,.9,.3,1.2), stupsen 1s 1.1s ease-in-out;
}
@keyframes stupsen {
  0%, 100% { transform: none; }
  25% { transform: translateY(-7px); } 50% { transform: none; } 75% { transform: translateY(-4px); }
}
.heute-hinweis .hh-siegel { width: 30px; height: 30px; }
.heute-hinweis .hh-pfeil { width: 20px; height: 20px; }
.heute-hinweis.oben .hh-pfeil { transform: rotate(180deg); }
@keyframes reinSchieben { from { transform: translateY(20px); opacity: 0; } }

/* Menü-Knopf #kalender-reset (aus kalender.js): sitzt fest unten links (Lage setzt kalender.js).
   Die Seite hält die Ecke frei: Heute-Hinweis rechts neben der Zone, Wand mit genug Abstand nach unten.
   In Bühne und Album ist er ausgeblendet. */
html.gesperrt #kalender-reset { display: none; }

/* Sprechzettel bei gesperrten Tagen */
.blase {
  position: absolute;
  z-index: 40;
  width: max-content;
  max-width: min(250px, calc(100vw - 16px));
  padding: 10px 14px 11px;
  color: var(--tinte);
  background: var(--foto);
  border-radius: 3px;
  box-shadow: 0 12px 24px -8px rgba(0,0,0,.65);
  cursor: pointer;
  transform-origin: var(--zipfel, 50%) 100%;
}
.blase.unten { transform-origin: var(--zipfel, 50%) 0; }
.blase strong { display: block; font: 400 23px/1.05 var(--hand); }
.blase span { display: block; margin-top: 4px; font: italic 15px/1.3 var(--text); }
.blase::after {
  content: '';
  position: absolute;
  left: calc(var(--zipfel, 50%) - 8px);
  bottom: -7px;
  width: 16px; height: 16px;
  background: var(--foto);
  transform: rotate(45deg);
}
.blase.unten::after { bottom: auto; top: -7px; }
.blase.zeigt { animation: blaseRein .34s cubic-bezier(.3,1.55,.5,1); }
.blase.geht { opacity: 0; transition: opacity .22s; pointer-events: none; }
@keyframes blaseRein { from { transform: scale(.6) rotate(-4deg); opacity: 0; } }

/* ---------- Bühne: Umschlag öffnen, Sofortbild entwickeln ---------- */
.buehne {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  user-select: none;
  -webkit-user-select: none;
}
.buehne:focus { outline: none; }
.b-grund {
  position: absolute; inset: 0;
  background:
    radial-gradient(70% 55% at 50% 44%, color-mix(in srgb, var(--wand) 78%, var(--lampe)) 0%, transparent 70%),
    color-mix(in srgb, var(--wand) 62%, #000);
  opacity: 0;
  transition: opacity .4s;
}
.b-farbe {
  position: absolute; inset: 0;
  background: radial-gradient(48% 38% at 50% 44%, var(--farbe), transparent 100%);
  opacity: 0;
}
.buehne.da .b-grund { opacity: .95; }
.b-kopf {
  position: relative; z-index: 4;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 66px;
  padding: 10px 10px 0 18px;
  opacity: 0;
  transition: opacity .4s;
}
.buehne.da .b-kopf { opacity: 1; }
.b-datum { margin: 0; display: flex; flex-direction: column; gap: 2px; }
.b-nr { font: 27px/1 var(--hand); color: var(--lampe); }
.b-tag { font: italic 16px/1.25 var(--text); color: color-mix(in srgb, var(--foto) 85%, transparent); }
.rund {
  flex: none;
  width: 48px; height: 48px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1.5px solid color-mix(in srgb, var(--foto) 38%, transparent);
  background: color-mix(in srgb, var(--wand) 60%, #000);
  cursor: pointer;
}
.rund svg { width: 22px; height: 22px; }
.b-mitte {
  position: relative; z-index: 3;
  flex: 1;
  width: 100%;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.b-szene { position: relative; perspective: 1100px; }
.b-teil {
  position: absolute;
  transform-origin: 50% 0;
  transform: translateY(0px) rotate(0deg);
}
.b-rueck {
  z-index: 1;
  border-radius: 3px;
  background: linear-gradient(180deg, rgba(0,0,0,.32), rgba(0,0,0,.06) 45%), color-mix(in srgb, var(--kraft) 76%, #3a2410);
  box-shadow: 0 26px 44px -18px rgba(0,0,0,.8);
}
.b-rueck::after, .k-aussen::after, .b-front::after {
  content: '';
  position: absolute; inset: 0;
  background: var(--faser);
  mix-blend-mode: multiply;
  opacity: .6;
  pointer-events: none;
}
.b-front { z-index: 4; color: var(--kraft); }
.b-front svg, .k-aussen svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.b-front::after { clip-path: polygon(0 0, 44.9% 51.4%, 50% 46%, 55.1% 51.4%, 100% 0, 100% 100%, 0 100%); }
.b-klappe {
  z-index: 5;
  color: var(--kraft);
  transform-style: preserve-3d;
  transform: translateY(0px) rotate(0deg) rotateX(0deg);
  transition: transform .62s cubic-bezier(.45,.05,.3,1), z-index 0s .3s;
}
.k-aussen, .k-innen {
  position: absolute; inset: 0;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}
.k-aussen::after { clip-path: polygon(0 0, 100% 0, 50% 58%); }
.k-innen {
  transform: rotateX(180deg);
  clip-path: polygon(0 100%, 100% 100%, 50% 42%);
  background:
    linear-gradient(0deg, rgba(0,0,0,.3), transparent 30%),
    radial-gradient(circle at 25% 25%, var(--lampe) 0 1.3px, transparent 1.7px) 0 0 / 13px 13px,
    radial-gradient(circle at 75% 75%, color-mix(in srgb, var(--siegel) 80%, var(--foto)) 0 1.3px, transparent 1.7px) 0 0 / 13px 13px,
    var(--wand);
}
.b-siegel {
  position: absolute;
  z-index: 6;
  transform: translate(-50%, -50%) rotate(-8deg);
  filter: drop-shadow(0 3px 3px rgba(0,0,0,.5));
}
.bricht .b-siegel { animation: siegelfall .9s cubic-bezier(.45,0,.85,.55) forwards; }
@keyframes siegelfall {
  0% { transform: translate(-50%, -50%) rotate(-8deg); }
  18% { transform: translate(-50%, -50%) rotate(-15deg) scale(1.15); }
  100% { transform: translate(-50%, -50%) translateY(var(--fall)) rotate(100deg) scale(.9); opacity: .3; }
}
.offen .b-klappe { transform: translateY(0px) rotate(0deg) rotateX(180deg); z-index: 2; }
.weg .b-teil {
  transform: translateY(var(--fall)) rotate(8deg);
  opacity: 0;
  transition: transform .8s cubic-bezier(.55,0,.85,.4), opacity .35s .45s;
}
.weg.offen .b-klappe { transform: translateY(var(--fall)) rotate(8deg) rotateX(180deg); }
/* Deckkraft < 1 würde preserve-3d abflachen und die Außenseite zeigen */
.weg .b-klappe { opacity: 1; transition: transform .8s cubic-bezier(.55,0,.85,.4); }

.sofort.gross {
  position: absolute;
  left: 0; top: 0;
  z-index: 3;
  width: var(--w);
  height: calc(var(--w) * 1.2159);
  margin: 0;
  padding: calc(var(--w) * .06) calc(var(--w) * .06) 0;
  border: 0;
  border-radius: 1px;
  cursor: grab;
  touch-action: none;
  transform-origin: 50% 0;
  transform: translateY(var(--ty0)) scale(var(--s0));
  box-shadow: 0 22px 44px -16px rgba(0,0,0,.75), 0 2px 3px rgba(0,0,0,.25);
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
.sofort.gross:active { cursor: grabbing; }
.raus .sofort.gross { transform: translateY(var(--ty1)) scale(var(--s0)); transition: transform .7s cubic-bezier(.45,0,.25,1); }
.weg .sofort.gross { transform: translateY(0px) scale(1); transition: transform .8s cubic-bezier(.2,.75,.2,1); }
.b-szene.bereit .sofort.gross { transition: transform .55s cubic-bezier(.25,1.55,.5,1); }
.b-szene.bereit .sofort.gross.zieht { transition: none; }
.milch {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 38% 30%, color-mix(in srgb, var(--foto) 78%, #8fa6b8) 0%, color-mix(in srgb, var(--foto) 52%, #6f8797) 60%, color-mix(in srgb, var(--foto) 40%, #5b7282) 100%);
}
.glanz {
  position: absolute; inset: -20%;
  background: linear-gradient(118deg, transparent 36%, rgba(255,255,255,.2) 46%, rgba(255,255,255,.06) 53%, transparent 60%);
  transform: translateX(var(--glanz, 0px));
  transition: transform .5s;
  pointer-events: none;
}
.s-titel {
  display: flex;
  align-items: center;
  justify-content: center;
  height: calc(var(--w) * .2759);
  padding: 0 5% calc(var(--w) * .012);
  font: calc(var(--w) * .074)/1.02 var(--hand);
  color: var(--tinte);
  text-align: center;
  transition: opacity .3s;
}
.s-titel span { display: block; transform: rotate(-1.6deg); clip-path: inset(-25% 100% -25% 0); transition: clip-path 1s linear; }
.schreibt .s-titel span, .still .s-titel span { clip-path: inset(-25% -6% -25% -6%); }
/* lange Bildunterschriften: kleiner schreiben, höchstens drei Zeilen */
.s-titel.lang { font-size: calc(var(--w) * .058); }
.s-titel.sehr-lang { font-size: calc(var(--w) * .045); }
.s-titel.lang span, .s-titel.sehr-lang span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; line-height: 1.14; }
.b-hinweis {
  position: relative; z-index: 4;
  margin: 12px 20px 2px;
  max-width: 27em;
  min-height: 2.9em;
  text-align: center;
  font: italic 16.5px/1.42 var(--text);
  color: color-mix(in srgb, var(--foto) 92%, transparent);
  opacity: 0;
  transition: opacity .4s;
}
.b-knoepfe {
  position: relative; z-index: 4;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  padding: 6px 12px 18px;
  visibility: hidden;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity .4s, transform .4s, visibility 0s .4s;
}
.buehne.bereit .b-hinweis { opacity: 1; }
.buehne.bereit .b-knoepfe { visibility: visible; opacity: 1; transform: none; transition: opacity .4s, transform .4s; }
.buehne.haengt .b-grund, .buehne.haengt .b-kopf, .buehne.haengt .b-hinweis, .buehne.haengt .b-knoepfe, .buehne.geht { opacity: 0; transition: opacity .45s; }
.buehne.haengt .s-titel { opacity: 0; }
.buehne.haengt .s-bild img, .buehne.haengt .milch { transition: filter .5s, opacity .5s; }
.knopf {
  min-height: 48px;
  padding: 0 18px;
  border-radius: 6px;
  font: 700 16.5px/1 var(--text);
  cursor: pointer;
}
.knopf.haupt { border: 0; color: var(--tinte); background: var(--foto); box-shadow: 0 8px 18px -8px rgba(0,0,0,.7); }
.knopf.zweit { border: 1.5px solid color-mix(in srgb, var(--foto) 50%, transparent); background: transparent; color: var(--foto); }
.still .b-teil, .still .b-siegel { display: none; }
.still .sofort.gross { transform: none !important; }
.b-szene.bereit.still .sofort.gross.zieht, .still .sofort.gross { transition: none; }

/* ---------- Album: Bildansicht ---------- */
.album {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  color: var(--foto);
  background:
    var(--albumfaser),
    radial-gradient(90% 70% at 50% 42%, color-mix(in srgb, var(--tinte) 88%, var(--kraft)) 0%, color-mix(in srgb, var(--tinte) 70%, #000) 100%);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  opacity: 0;
  transition: opacity .22s;
  user-select: none;
  -webkit-user-select: none;
}
.album.da { opacity: 1; }
.album:focus { outline: none; }
.a-kopf {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 62px;
  padding: 8px 10px 2px 18px;
}
.a-datum { margin: 0; font: italic 500 clamp(16.5px, 4.4vw, 20px)/1.2 var(--text); }
.a-zu {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 48px;
  padding: 0 18px 0 13px;
  border-radius: 24px;
  border: 1.5px solid color-mix(in srgb, var(--foto) 30%, transparent);
  background: color-mix(in srgb, var(--foto) 8%, transparent);
  font: 500 16.5px/1 var(--text);
  cursor: pointer;
}
.a-zu svg { width: 20px; height: 20px; }
.a-buehne {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px 8px;
  overflow: hidden;
  touch-action: pan-y pinch-zoom;
}
.a-seite { margin: 0; will-change: transform; }
.a-rahmen {
  --farbe: #16181c;
  position: relative;
  padding: var(--rand, 6px);
  /* Innenfläche (solange die Collage lädt): dunkel, leicht in der Leitfarbe des Tages getönt */
  background: linear-gradient(color-mix(in srgb, var(--farbe) 34%, #16181c), color-mix(in srgb, var(--farbe) 34%, #16181c)) content-box, var(--foto);
  box-shadow: 0 16px 36px rgba(0,0,0,.6), 0 2px 4px rgba(0,0,0,.4);
}
.a-bild { display: block; width: 100%; height: 100%; object-fit: contain; background: #16181c; pointer-events: none; -webkit-user-drag: none; opacity: 0; transition: opacity .25s; }
.a-rahmen.da .a-bild { opacity: 1; }
/* Ladekringel, erscheint erst nach kurzer Wartezeit (schnelle Bilder blitzen so nicht) */
.a-laedt {
  position: absolute;
  left: 50%; top: 50%;
  width: 36px; height: 36px;
  margin: -18px 0 0 -18px;
  border-radius: 50%;
  border: 3px solid color-mix(in srgb, var(--foto) 22%, transparent);
  border-top-color: color-mix(in srgb, var(--foto) 85%, transparent);
  opacity: 1;
  transition: opacity .2s .3s;
  animation: drehen .9s linear infinite;
  pointer-events: none;
}
.a-rahmen.da .a-laedt { opacity: 0; transition: opacity .12s; animation: none; }
@keyframes drehen { to { transform: rotate(1turn); } }
.ecke {
  position: absolute;
  width: var(--e, 26px);
  height: var(--e, 26px);
  background:
    linear-gradient(135deg, transparent calc(50% - .5px), rgba(255,255,255,.22) 50%, transparent calc(50% + 1px)),
    linear-gradient(135deg, color-mix(in srgb, var(--tinte) 68%, #000) 0 50%, transparent calc(50% + .5px));
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.55));
}
.e1 { left: -3px; top: -3px; }
.e2 { right: -3px; top: -3px; transform: scaleX(-1); }
.e3 { left: -3px; bottom: -3px; transform: scaleY(-1); }
.e4 { right: -3px; bottom: -3px; transform: scale(-1, -1); }
.a-fuss {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 92px;
  padding: 4px 10px 14px;
}
.a-unterschrift { flex: 1; min-width: 0; text-align: center; }
.a-titel {
  margin: 0;
  font: clamp(23px, 6.2vw, 31px)/1.08 var(--hand);
  color: color-mix(in srgb, var(--foto) 94%, transparent);
  transform: rotate(-1deg);
}
.a-titel.lang {
  font-size: clamp(18px, 4.6vw, 23px);
  line-height: 1.14;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
}
.a-zahl { margin: 5px 0 0; font: italic 15px/1.3 var(--text); color: color-mix(in srgb, var(--foto) 66%, transparent); }
.a-titel[hidden] + .a-zahl { margin-top: 0; }
.a-nav {
  flex: none;
  width: 54px; height: 54px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1.5px solid color-mix(in srgb, var(--foto) 34%, transparent);
  background: color-mix(in srgb, var(--foto) 7%, transparent);
  cursor: pointer;
}
.a-nav svg { width: 26px; height: 26px; }
.a-nav:disabled { opacity: .22; cursor: default; }
@media (min-width: 900px) {
  .a-buehne { padding: 8px 104px; }
  .a-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 60px; }
  .a-zurueck { left: calc(26px + env(safe-area-inset-left)); }
  .a-weiter { right: calc(26px + env(safe-area-inset-right)); }
  .a-fuss { min-height: 96px; justify-content: center; }
}

@media (prefers-reduced-motion: reduce) {
  .schein, .feier .funkel .halo, .blase.zeigt, .heute-hinweis { animation: none; }
  .wackelt .wackler, .winkt .wackler { animation: none; }
  .wackelt .umschlag { outline: 3px solid color-mix(in srgb, var(--lampe) 70%, transparent); outline-offset: 3px; }
  .s-bild::after { animation: none; transform: none; background: rgba(255,255,255,.1); }
  .s-bild img, .a-bild { transition: none; }
  .a-laedt { animation-duration: 2.4s; }
}

  function wennGeladen(img, tag, px, fertig) {

    var m = typeof F.masse === 'function' ? F.masse(tag) : null;
    if (m && m.w > 0 && m.h > 0) return klemm(m.w / m.h, 0.4, 2.5);
    return F.format(tag) === 'hoch' ? 2 / 3 : 1;
  }

  function albumZeigen() {
    var tag = A.liste[A.i], titel = titelVon(tag), nr = ++A.nr;
    // Jedes Mal ein frisches <img>: sonst stünde beim Blättern kurz die alte Collage unter dem neuen Datum
    var img = doc.createElement('img');
    img.className = 'a-bild';
    img.alt = titel ? tx('fotoleine.ansicht.altTitel', 'Collage vom {n}. Dezember: {titel}', { n: tag, titel: titel }) : tx('fotoleine.ansicht.alt', 'Collage vom {n}. Dezember', { n: tag });
    img.draggable = false;
    img.decoding = 'async';
    img.src = F.bild(tag);
    A.rahmen.replaceChild(img, A.img);
    A.img = img;
    A.rahmen.classList.remove('da');
    A.rahmen.style.setProperty('--farbe', farbeVon(tag));
    A.ratio = verhaeltnis(tag);
    wennGeladen(img, tag, 0, function () {
      if (A.nr !== nr) return;
      // Rahmen an das tatsächlich geladene Bild anpassen (z. B. Platzhalter statt fehlender Collage)
      var r = img.naturalWidth > 0 && img.naturalHeight > 0 ? img.naturalWidth / img.naturalHeight : 0;
      if (r && Math.abs(r - A.ratio) > A.ratio * 0.03) { A.ratio = klemm(r, 0.4, 2.5); albumMasse(); }
      A.rahmen.classList.add('da');
    });
    A.titel.textContent = titel;
    A.titel.hidden = !titel;
    A.titel.classList.toggle('lang', titel.length > 40);
    A.datum.textContent = K.datumText(tag);
    A.zahl.textContent = tx('fotoleine.ansicht.zaehler', 'Foto {n} von {gesamt}', { n: A.i + 1, gesamt: A.liste.length }) + (GROB && A.liste.length > 1 ? ' – ' + tx('fotoleine.ansicht.wischen', 'wischen zum Blättern') : '');
    A.zurueck.disabled = A.i <= 0;
    A.weiter.disabled = A.i >= A.liste.length - 1;
    albumMasse();
    var i = A.i;
    setTimeout(function () {
      if (!A.offen || A.i !== i) return;
      if (A.liste[i + 1]) F.bild(A.liste[i + 1]);
      if (A.liste[i - 1]) F.bild(A.liste[i - 1]);
    }, 450);
  }

  function albumMasse() {
    if (!A || !A.offen) return;
    var cs = getComputedStyle(A.buehne);
    var aw = A.buehne.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var ah = A.buehne.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var ratio = A.ratio || 1;
    var rand = Math.round(klemm(Math.min(aw, ah) * 0.016, 4, 11));
    var iw = Math.max(40, Math.min(aw - 2 * rand, (ah - 2 * rand) * ratio)), ih = iw / ratio;
    A.rahmen.style.width = Math.floor(iw + 2 * rand) + 'px';
    A.rahmen.style.height = Math.floor(ih + 2 * rand) + 'px';
    A.rahmen.style.setProperty('--rand', rand + 'px');
    A.rahmen.style.setProperty('--e', Math.round(klemm(Math.min(iw, ih) * 0.075, 16, 40)) + 'px');
  }

  // Tastendrücke während eines Wechsels werden gepuffert und zügig nachgeholt
  function blaettern(dir) {
    if (!A.offen) return;
    if (A.wechselt) { A.puffer = klemm((A.puffer || 0) + dir, -6, 6); return; }
    var ni = A.i + dir;
    if (ni < 0 || ni >= A.liste.length) { A.puffer = 0; zurueckschnappen(); return; }
    if (RUHIG) { A.i = ni; albumZeigen(); return; }
    A.wechselt = true;
    var w = A.buehne.clientWidth, f = A.puffer ? 0.5 : 1;
    A.seite.style.transition = 'transform ' + (0.2 * f) + 's cubic-bezier(.5,0,.9,.6), opacity ' + (0.2 * f) + 's';
    A.seite.style.transform = 'translateX(' + (-dir * w * 0.7).toFixed(0) + 'px) rotate(' + (-dir * 4) + 'deg)';
    A.seite.style.opacity = '0';
    setTimeout(function () {
      A.i = ni;
      albumZeigen();
      A.seite.style.transition = 'none';
      A.seite.style.transform = 'translateX(' + (dir * w * 0.45).toFixed(0) + 'px) rotate(' + (dir * 3) + 'deg)';
      void A.seite.offsetWidth;
      A.seite.style.transition = 'transform ' + (0.36 * f) + 's cubic-bezier(.2,.8,.25,1), opacity ' + (0.24 * f) + 's';
      A.seite.style.transform = 'translateX(0px) rotate(0deg)';
      A.seite.style.opacity = '1';
      setTimeout(function () {
        A.wechselt = false;
        var p = A.puffer || 0;
        if (p) { var d = p > 0 ? 1 : -1; A.puffer = p - d; blaettern(d); }
      }, 160 * f);
    }, 200 * f);
  }

  function albumZu() {
    if (!A.offen) return;
    A.offen = false;
    var tag = A.liste[A.i];
    A.el.classList.remove('da');
    setTimeout(function () { if (!A.offen) A.el.hidden = true; }, RUHIG ? 0 : 220);
    seiteFrei(knoepfe[tag]);
  }

  /* ---------- Tastatur ---------- */
  doc.addEventListener('keydown', function (e) {
    if (A && A.offen) {
      if (e.key === 'Escape') { e.preventDefault(); albumZu(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); blaettern(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); blaettern(-1); }
      else if (e.key === 'Tab') falle(e, A.el);
    } else if (B) {
      if (e.key === 'Escape') { e.preventDefault(); aufhaengen(); }
      else if (e.key === 'Tab') falle(e, B.el);
    } else if (e.key === 'Escape') blaseWeg();
  });

  /* ---------- Datum oder Stand ändert sich (Testmenü, anderer Tab/andere Variante) ---------- */
  var letzterTag = K.heute();
  K.onChange(function () {
    var gleicherTag = K.heute() === letzterTag;
    letzterTag = K.heute();
    // Nur der gemeinsame Stand hat sich geändert (z. B. in einer anderen Variante etwas geöffnet):
    // Bühne bzw. Album bleiben offen, solange ihr Inhalt noch stimmt – nur die Leinen werden aufgefrischt.
    if (gleicherTag && (B || (A && A.offen)) &&
        (!B || !B.gemerkt || K.istGeoeffnet(B.tag)) &&
        (!A || !A.offen || A.liste.every(function (t) { return K.istGeoeffnet(t); }))) {
      alleFuellen();
      if (B && knoepfe[B.tag]) knoepfe[B.tag].classList.add('versteckt');
      kopfText();
      return;
    }
    if (B) { B.zu = true; if (B.el.parentNode) B.el.parentNode.removeChild(B.el); B = null; }
    if (A && A.offen) { A.offen = false; A.el.classList.remove('da'); A.el.hidden = true; }
    overlay = null;
    haupt.inert = false;
    root.classList.remove('gesperrt');
    blase.hidden = true;
    alleFuellen();
    kopfText();
    heuteBeobachten();
  });

  /* ---------- Größe ändert sich ---------- */
  var letzteBreite = 0, rz = 0;
  function neuMessen() {
    rz = 0;
    var w = wand.clientWidth;
    if (w !== letzteBreite) {
      letzteBreite = w;
      bauen();
      if (B && knoepfe[B.tag]) knoepfe[B.tag].classList.add('versteckt');
    }
    if (B && B.bereit) buehneMasse();
    albumMasse();
  }
  window.addEventListener('resize', function () { if (!rz) rz = requestAnimationFrame(neuMessen); });

  /* ---------- Start ---------- */
  texturen();
  markeSymbol();
  albumBauen();
  kopfText();
  letzteBreite = wand.clientWidth;
  bauen();
  setTimeout(function () { anstossen(0.45); }, 350);
})();
</script>
