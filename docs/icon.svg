<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Dein Adventskalender</title>
  <defs>
    <radialGradient id="licht" cx="50%" cy="56%" r="62%">
      <stop offset="0" stop-color="#3dbba3"/>
      <stop offset="1" stop-color="#2da48e"/>
    </radialGradient>
    <radialGradient id="kugel" cx="38%" cy="34%" r="72%">
      <stop offset="0" stop-color="#ff7454"/>
      <stop offset=".7" stop-color="#ff5330"/>
      <stop offset="1" stop-color="#e8431f"/>
    </radialGradient>
  </defs>
  <!-- Hintergrund: Petrol, randlos (für runde und eckige Masken) -->
  <rect width="512" height="512" fill="url(#licht)"/>
  <!-- Schneeflöckchen -->
  <g fill="#fff" opacity=".55">
    <circle cx="70" cy="200" r="7"/><circle cx="118" cy="402" r="5"/><circle cx="446" cy="214" r="6"/>
    <circle cx="400" cy="440" r="8"/><circle cx="58" cy="318" r="4"/><circle cx="470" cy="330" r="4"/>
    <circle cx="160" cy="60" r="5"/><circle cx="350" cy="48" r="4"/>
  </g>
  <!-- kleine Sterne in Senf -->
  <path fill="#f3bd69" d="M108.0 102.0L111.8 112.7L123.2 113.1L114.2 120.0L117.4 130.9L108.0 124.5L98.6 130.9L101.8 120.0L92.8 113.1L104.2 112.7Z"/>
  <path fill="#f3bd69" d="M410.0 84.0L412.9 92.0L421.4 92.3L414.8 97.5L417.1 105.7L410.0 101.0L402.9 105.7L405.2 97.5L398.6 92.3L407.1 92.0Z"/>
  <!-- Tannenzweig hinter der Kappe -->
  <g fill="#597533">
    <ellipse cx="196" cy="150" rx="70" ry="19" transform="rotate(-16 196 150)"/>
    <ellipse cx="316" cy="150" rx="70" ry="19" transform="rotate(16 316 150)"/>
  </g>
  <g fill="#6f8c3c">
    <ellipse cx="214" cy="132" rx="44" ry="12" transform="rotate(-32 214 132)"/>
    <ellipse cx="298" cy="132" rx="44" ry="12" transform="rotate(32 298 132)"/>
  </g>
  <!-- Aufhänger und Kappe -->
  <circle cx="256" cy="108" r="17" fill="none" stroke="#385052" stroke-width="9"/>
  <rect x="222" y="124" width="68" height="40" rx="9" fill="#f3bd69"/>
  <path d="M236 128v32M256 128v32M276 128v32" stroke="#d9a04a" stroke-width="5" stroke-linecap="round"/>
  <!-- Kugel aus Filz mit weißer Naht -->
  <circle cx="256" cy="308" r="140" fill="url(#kugel)"/>
  <circle cx="256" cy="308" r="118" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="15 13" opacity=".92"/>
  <!-- Glanzlicht -->
  <ellipse cx="196" cy="236" rx="38" ry="22" fill="#fff" opacity=".22" transform="rotate(-35 196 236)"/>
  <!-- Stern in der Mitte -->
  <path fill="#f3bd69" stroke="#fff4dc" stroke-width="4" stroke-linejoin="round" d="M256.0 244.0L271.3 287.0L316.9 288.2L280.7 316.0L293.6 359.8L256.0 334.0L218.4 359.8L231.3 316.0L195.1 288.2L240.7 287.0Z"/>
</svg>
